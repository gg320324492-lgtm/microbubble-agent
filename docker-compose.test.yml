# docker-compose.test.yml — qa-bench 物理隔离测试栈 (plan: qa-bench-isolation-a1.md)
#
# W68 第 7 批 A-3 (2026-07-24): 补齐 plan 核心交付物 (PARTIAL_REGRESSION 修复).
#
# 目的: qa-bench 跑测彻底物理隔离, 生产 DB / Redis / MinIO 永远不被写入.
#   - 独立 postgres (5433) + redis (6380) + minio (9001/9002) + app (8001)
#   - 独立数据卷 (test_pg_data / test_redis_data / test_minio_data)
#   - 独立网络 (mb-test-net) 与生产 default 网络隔离
#   - 销毁: docker compose -f docker-compose.test.yml down -v (-v 清数据卷, 0 残留)
#
# 端口错开生产 (5432/6379/9000/9001/8000) 避免冲突.
# JWT_SECRET / MinIO 凭据与生产不同, 防测试栈 token 误用于生产.
#
# ⚠️ 主指挥 SSH 部署必做见 docs/qa-bench-isolation-stack.md 第 4 节.
#
# 用法:
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v

services:
  # PostgreSQL 16 + pgvector (复用生产 Dockerfile.db, 端口错开)
  pg-test:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: microbubble_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test_password}
    ports:
      - "5433:5432"   # 错开生产 5432
    volumes:
      - test_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microbubble_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mb-test-net
    mem_limit: 512m

  # Redis 7 (端口错开)
  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 错开生产 6379
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mb-test-net
    mem_limit: 256m

  # MinIO (端口错开, 独立凭据 + bucket microbubble-test)
  #
  # ⚠️ 2026-10-02 S3.7④ 解锁 (默认不启动, 见下方 profiles 注释):
  #   上游 minio 镜像全仓不可达 (实测 2026-10-02, 非本机问题):
  #     quay.io/minio/minio:latest + 6 个候选 RELEASE tag -> 全部 "no such manifest"
  #     quay.io/minio/minio (无 tag) -> 同样 no such manifest  ← 整个 repo 不可达
  #     minio/minio (Docker Hub)   -> denied / unauthorized
  #     ghcr.io/minio/minio        -> denied
  #     对照组 quay.io/prometheus/busybox:latest / redis:7-alpine 均 rc=0 正常
  #   故**不能靠换 tag 修复** (方案 A 已实测无解), 只能绕开 (方案 B)。
  #
  # profiles ["s3"] 的含义 = 默认 `docker compose up` **不启动** minio-test,
  #   但服务定义原样保留; 需要时 `docker compose --profile s3 up -d minio-test` 即恢复。
  #   配套改动: app-test.depends_on.minio-test 必须同时加 `required: false`,
  #   否则 compose 会**传递性**拉起 minio-test, profile 形同虚设 (已实测:
  #   仅从 `up` 服务列表删掉 minio-test 无效, depends_on 仍会拉它)。
  #
  # 为什么可以安全绕开 (三项实测依据):
  #   1. app-test 启动链不碰 minio: app/main.py:512 /health 是静态 dict (无 minio 依赖),
  #      main.py 零 minio 引用, file_service.py 已 lazy init (import 阶段 0 网络调用),
  #      scripts/init_test_db_all.py 零 minio 引用 → app-test 能正常 ready。
  #   2. a11y job 完全不依赖 S3: 其 testMatch = /a11y\/.*\.spec\.mjs$/ 只跑 a11y/ 子目录。
  #   3. visual job 内仅 4 个 drive spec 真调 POST /api/v1/drive/files/upload 会受影响
  #      (无 minio 时该请求 500), 但该 job 是 continue-on-error: true (非阻塞),
  #      且**当前状态是连启动都失败、0 个测试在跑** —— 去掉 minio 后 a11y 从 0 跑到满, 严格改进。
  #   待上游恢复后: 删掉本段 profiles + app-test 侧 required: false, 换真实存在的 tag 即可复原。
  minio-test:
    profiles: ["s3"]
    # 2026-10-01 S3.7 ⚠️ 修复受阻，勿误读为已修：
    #   诊断成立 = 原为 `minio/minio` 无 tag（全文件唯一如此），官方镜像已迁 quay.io，
    #   CI 报 pull access denied / repository does not exist，Playwright 两个 job
    #   全部死在 Start test environment。
    #   但当前 tag 是**复检官误写、已实测确认不存在**（docker manifest inspect exit=1）；
    #   对照组 hello-world / redis:7-alpine / alpine:3 均正常 → 非本机 registry 问题，
    #   quay.io/minio/minio 的所有候选 tag（含 latest、官方 releases 标 Latest 的那个）
    #   在本机均取不到 manifest，疑上游镜像供给停滞（旁证 issue #21675）。
    #   **不退回无 tag 形式**（那正是本条要修的 bug），也不换 S3 实现（属产品决策，
    #   app/ 与 alembic 迁移里 minio_object_key 相关面很大（52 处），属产品决策面。
    #   爆炸半径仅 Playwright：qa-bench-baseline 用 pip 客户端库、qa-bench-ci/smoke 连生产
    #   compose 的 localhost:9000，三者均不依赖本 minio-test 服务。待上游恢复后换真实 tag。
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_ACCESS_KEY:-test_minio}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_SECRET_KEY:-test_minio_password}
    ports:
      - "9001:9000"   # API  (错开生产 9000)
      - "9002:9001"   # Console (错开生产 9001)
    volumes:
      - test_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mb-test-net
    mem_limit: 256m

  # 主应用 (复用生产 Dockerfile, 独立 env, 端口错开)
  app-test:
    # W93: CI 复用 W67 pre-built image 模式 (build-image.yml push 时自动 build)
    #   本地已有 app-test:ci (docker pull + tag) 时直接用, 不 build
    image: app-test:ci
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"   # 错开生产 8000, 仅本地访问
    volumes:
      - ./app:/app/app
      - ./alembic/versions:/app/alembic/versions
      - ./models/hf_cache:/root/.cache/huggingface
    environment:
      # 指向测试栈内部服务 (docker network 内 hostname)
      DATABASE_URL: postgresql+asyncpg://postgres:${TEST_POSTGRES_PASSWORD:-test_password}@pg-test:5432/microbubble_test
      REDIS_URL: redis://redis-test:6379/0
      MINIO_ENDPOINT: minio-test:9000
      MINIO_ACCESS_KEY: ${TEST_MINIO_ACCESS_KEY:-test_minio}
      MINIO_SECRET_KEY: ${TEST_MINIO_SECRET_KEY:-test_minio_password}
      MINIO_BUCKET: microbubble-test
      # JWT secret 与生产不同 → 测试栈 token 无法用于生产
      SECRET_KEY: ${TEST_SECRET_KEY:-test_jwt_secret_different_from_prod}
      # 复用生产 LLM endpoint (qa-bench 需真 LLM 调用)
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-shibing624/text2vec-base-chinese}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
    depends_on:
      pg-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      # 2026-10-02 S3.7④: required: false 与 minio-test 的 profiles ["s3"] 配套。
      #   没有 required: false, compose 会在 `up -d app-test` 时传递性拉起 minio-test,
      #   profile 形同虚设 (已实测)。app-test 启动链不依赖 minio (见 minio-test 段注释)。
      minio-test:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - mb-test-net
    mem_limit: 4g

  # 2026-07-29 W87-B-1: GlitchTip all-in-one in the isolated test network.
  # Host port 8002 avoids production 8000 and dev 8001.
  glitchtip:
    image: glitchtip/glitchtip:6.2.2
    container_name: microbubble-agent-glitchtip-test-1
    environment:
      DATABASE_URL: "postgresql://postgres:${TEST_POSTGRES_PASSWORD:-test_password}@pg-test:5432/glitchtip"
      VALKEY_URL: "redis://redis-test:6379/1"
      SECRET_KEY: "${TEST_GLITCHTIP_SECRET_KEY:-test-glitchtip-not-for-production}"
      PORT: "8000"
      GLITCHTIP_DOMAIN: "${TEST_GLITCHTIP_DOMAIN:-http://localhost:8002}"
      EMAIL_ENABLED: "False"
      SERVER_ROLE: "all_in_one"
    ports:
      - "8002:8000"
    depends_on:
      pg-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - mb-test-net
    restart: unless-stopped

  # 2026-07-29 W86-F-1: pg_exporter — PostgreSQL Prometheus 暴露 (test stack 端口错开)
  # image 钉死 tag v0.15.0 (latest 不跟, 避免主指挥据实上报不可控)
  # 端口 9199 错开生产 9187, 数据库 microbubble_test, 密码 test_password
  # 仅加 service 段, 其它 service 的 image / volume / port 不动
  pg-exporter-test:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: microbubble-agent-pg-exporter-test-1
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${TEST_POSTGRES_PASSWORD:-test_password}@pg-test:5432/microbubble_test?sslmode=disable"
    ports:
      - "9199:9187"
    depends_on:
      pg-test:
        condition: service_healthy
    networks:
      - mb-test-net
    restart: unless-stopped

# 独立数据卷 (down -v 时一起销毁, 0 残留)
volumes:
  test_pg_data:
  test_redis_data:
  test_minio_data:

# 独立网络 (与生产 default 网络隔离)
networks:
  mb-test-net:
    driver: bridge
