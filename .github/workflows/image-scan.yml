name: image-scan (trivy)

# W86-C-1: Trivy 镜像漏洞扫描
# - PR: 仅当 Dockerfile* / docker/** / docker-compose*.yml 变化时触发, advisory (不 block PR)
# - schedule: 每周一 05:00 UTC 全量扫, HIGH/CRITICAL 命中即 fail
on:
  pull_request:
    paths:
      - 'Dockerfile*'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'web/Dockerfile'
      - '.github/workflows/image-scan.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: trivy ${{ matrix.name }}
    runs-on: ubuntu-latest
    # PR 上仅 advisory: 单个矩阵项失败不拖垮整个 workflow
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            context: .
          - name: db
            dockerfile: Dockerfile.db
            context: .
          - name: funasr
            dockerfile: Dockerfile.funasr
            context: .
          - name: mcp
            dockerfile: Dockerfile.mcp
            context: .
          - name: voice-pipeline
            dockerfile: Dockerfile.voice-pipeline
            context: .
          - name: whisper
            dockerfile: Dockerfile.whisper
            context: .
          - name: web
            dockerfile: web/Dockerfile
            context: web
          - name: commercial
            dockerfile: docker/Dockerfile.commercial
            context: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先做 config/IaC 扫描 (不需要 build, 永远能跑)
      - name: Trivy config scan (${{ matrix.dockerfile }})
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: ${{ matrix.dockerfile }}
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'
          # L-8: 引用已接受漏洞基线 (见 .trivyignore 全文注释)。
          # 该入参由 trivy-action entrypoint.sh 处理: 把各文件 cat 合并成
          # ./trivyignores 并 export TRIVY_IGNOREFILE。**必须显式传** ——
          # 不传则本文件完全不被读取 (2026-10-11 实测确认原 workflow 零引用)。
          trivyignores: '.trivyignore'

      # 构建镜像。原为无条件 continue-on-error: true —— L-9 (收尾计划 §4.11):
      # schedule/dispatch 硬路径上构建失败会被容错, 后续三步扫描又全部以
      # steps.build.outcome == 'success' 为条件 → 扫描全 skip、job 无失败步 →
      # 结论 success, "扫了空气还报平安", 把 schedule 的 fail 语义整个架空。
      # 改为与 job 级 (:27) 同型惯用法: PR 维持 advisory 设计不变,
      # schedule/dispatch 构建失败 = 步骤失败 = job 红 (三个 skip 照 skip, job 已红无需兜底)。
      - name: Build image
        id: build
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          docker build -f "${{ matrix.dockerfile }}" \
            -t "microbubble-scan-${{ matrix.name }}:ci" \
            "${{ matrix.context }}"

      # 镜像漏洞扫描 → sarif 上传
      - name: Trivy image scan (sarif)
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'microbubble-scan-${{ matrix.name }}:ci'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-${{ matrix.name }}.sarif'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Upload sarif to code scanning
        if: steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.name }}.sarif'
          category: 'trivy-${{ matrix.name }}'

      # table 输出写到 actions log + 严重度门禁
      # PR: exit-code 0 (advisory); schedule/manual: exit-code 1 (HIGH/CRITICAL 即 fail)
      - name: Trivy image scan (table + gate)
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'microbubble-scan-${{ matrix.name }}:ci'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          ignore-unfixed: true
          exit-code: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          trivyignores: '.trivyignore'
