name: image-scan (trivy)

# W86-C-1: Trivy 镜像漏洞扫描
# - PR: 仅当 Dockerfile* / docker/** / docker-compose*.yml 变化时触发, advisory (不 block PR)
# - push(main): 仅当 requirements.txt / .trivyignore / 本文件变化时触发, **硬失败**
#   见下方「2026-10-12 加 push 触发器」的说明
# - schedule: 每周一 05:00 UTC 全量扫, HIGH/CRITICAL 命中即 fail
on:
  pull_request:
    paths:
      - 'Dockerfile*'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'web/Dockerfile'
      - '.github/workflows/image-scan.yml'
  # 2026-10-12 新增 (L-8 收尾): **改 requirements.txt 从前不触发任何门禁**
  #   —— 本 workflow 原本只有 PR(限 Dockerfile/docker/compose) / schedule /
  #   workflow_dispatch, **没有 push**。而 L-8 治理的 4 条 CVE **全部是改
  #   requirements.txt 修的**(升 uvicorn+mcp, 删 langchain), 于是产生了一个
  #   荒唐局面: 整个治理做完了, CI 却一次都没验证过。2026-10-12 最后一次
  #   workflow_dispatch(head 09769e415)仍是 failure, 之后所有依赖改动都
  #   **静默地从未被扫描**。类 20.220: 守门必须验副作用真的发生。
  #
  #   为什么还带上 `.trivyignore`: 改豁免清单同样会改变门禁结果, 不触发等于
  #   "改豁免可以不验证" —— 那正是本文件第 5-14 行的原则要防的事。
  #
  #   ⚠️ **这还不是硬门**: main 的 required checks 是 9 个 Server Tests Baseline
  #   context, **不含本 workflow** ⇒ push 时红了也只是可见红叉, 挡不住合并。
  #   要变硬门需先连续绿若干次再把 job 名加进 required (类 20.222: 开保护前先修红)。
  # ⚠️ **这里只覆盖"依赖文件"，故意不含 `Dockerfile*` / `docker/**` /
  #   `docker-compose*.yml` / `web/Dockerfile`**（那些在 `pull_request.paths` 里）。
  #   原因是**补上去比不补更危险**：push 触发时跑的是 `scan-deps`，它**只含
  #   app / voice-pipeline 两个镜像**。而改 `Dockerfile.funasr` 真正
  #   需要被扫的是 funasr —— **它不在这两个里** ⇒ workflow 会跑、会绿、UI 上
  #   显示"扫描通过"，**而真正受影响的那个镜像根本没被扫**。
  #   这是类 20.220 的形态：状态字段在说谎。
  #   ⇒ **改 Dockerfile / docker-compose 之后必须手动 `gh workflow run` 一次**
  #   （全量 7 个镜像）。这条纪律已写进 CLAUDE.md。
  push:
    paths:
      - 'requirements.txt'
      - '.trivyignore'
      - '.github/workflows/image-scan.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

# 2026-10-12: 连续推送时取消同分支的进行中 run。
#
# **问题**：本仓是 direct-push（一天 3~6 次），而 `push` 触发器限 `paths`
# （requirements.txt / .trivyignore / 本文件），连续推几个都命中 paths 时会
# **同时起多轮 run 互不取消** —— 2026-10-12 实测就撞见过两轮并行。每轮 2 个
# 镜像构建 + 扫描，各 8-10 分钟，除了白烧 Actions 配额，还加剧了 trivy
# cache key 抢占用（同一 key 下只有第一轮能存 DB，其余每次重下）。
#
# **为什么 group 里带 `github.event_name`**（这不是可选的装饰）：
#   `schedule` 是**每周一次的全量扫描**（7 个镜像），`push` 是**依赖变更扫描**
#   （2 个镜像）—— 两者**互补，不可互相取代**。若 group 只用 `github.ref`，
#   那么"傍晚 18-20 点 schedule 刚起来"碰上"有人推了个改 requirements.txt 的
#   commit"，push 会**把全量扫描取消掉** ⇒ 本周唯一的全量扫描白跑。
#   带上 event_name 后：
#     push     → `image-scan-refs/heads/main-push`      （连续推送之间互相取消 ✅）
#     schedule → `image-scan-refs/heads/main-schedule`  （独立，不被 push 取消 ✅）
#     PR       → ref 是 `refs/pull/N/merge`，天然与 main 分开 ✅
#   `workflow_dispatch` 同理独立，人工触发跑全量不会被日常 push 顶掉。
concurrency:
  group: image-scan-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # 全量 7 个 —— PR / schedule / workflow_dispatch
  scan:
    if: github.event_name != 'push'
    # ⚠️ 2026-10-12: 这个 name **必须是纯静态字符串**, 不能带 `${{ }}`。
    #   job 被 skip 时 matrix **尚未展开**, 于是整个 name 里的表达式不会求值,
    #   UI 上就原样显示字面量 `trivy ${{ matrix.name }}` —— 看着像配置坏了。
    #   ⇒ push 那次运行(本 job 必然被 skip)现在显示 `trivy full (7 images)`。
    #
    #   取舍: 代价是**可运行时** 7 个 matrix job 同名, 折叠列表里分不出镜像。
    #   但镜像身份在 job **内部**仍然可见 —— step 名带 `(${{ matrix.dockerfile }})`,
    #   镜像 tag 是 `microbubble-scan-<name>:ci`, sarif 是 `trivy-<name>.sarif`,
    #   逐个点开即知。相对地, 若保留 `${{ matrix.name }}` 则可运行时分得清、
    #   但 skip 时仍显示未展开的字面量 —— 见 git log 同日 commit 的取舍说明。
    #   ⚠️ `scan-deps` 的 name **故意保留** `${{ matrix.name }}`: 它**从不**被 skip
    #   (if 条件为真才跑), 所以矩阵总能展开, 逐镜像可区分是有价值的。
    name: trivy full (7 images)
    runs-on: ubuntu-latest
    # PR 上仅 advisory: 单个矩阵项失败不拖垮整个 workflow
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            context: .
          - name: db
            dockerfile: Dockerfile.db
            context: .
          - name: funasr
            dockerfile: Dockerfile.funasr
            context: .
          - name: mcp
            dockerfile: Dockerfile.mcp
            context: .
          - name: voice-pipeline
            dockerfile: Dockerfile.voice-pipeline
            context: .
          - name: whisper
            dockerfile: Dockerfile.whisper
            context: .
          - name: web
            dockerfile: web/Dockerfile
            context: web
        # 2026-10-12: push(仅 requirements.txt / .trivyignore / 本文件变更)时,
        # 只跑**真的读 requirements.txt 的镜像**, 即改动实际影响的那些:
        #   ✅ 保留  app            (Dockerfile,                     COPY + pip install -r)
        #   ✅ 保留  voice-pipeline (Dockerfile.voice-pipeline, :14 COPY + :23 pip install -r)
        #   ❌ 排除  db / web                      —— 无 Python 依赖
        #   ❌ 排除  funasr / whisper              —— 独立内联 pip install, 不读本文件
        #   ❌ 排除  mcp (Dockerfile.mcp)          —— 同上
        #   ❌ 排除  commercial                    —— **休眠镜像**(见下方 scan-deps 同款注释)
        #
        # ⚠️ **别用 `grep -q requirements.txt Dockerfile.mcp` 来判断 mcp 读不读**
        #   —— 实测这是**假阳性**: Dockerfile.mcp 的**注释**里就写着
        #   「⚠️ 本文件不读 requirements.txt」(第 18 行), grep 命中的是那句注释文字。
        #   今天差点据此把 mcp 也算进受影响范围, 成本会多估近一倍。
        #   判据应是 `grep -nE "COPY requirements.txt|pip install .*-r requirements.txt"`,
        #   即**匹配用法而非提及**。同型坑见 CLAUDE.md 的 `.dft` 前缀假阳性。
        #
        # 成本: 全量 7 个约 28 分钟, 只跑 2 个约 8-10 分钟。
        # 失败语义: push 不在 `continue-on-error` 范围(见上), 也不在 exit-code 的
        #   advisory 分支(该表达式对非 PR 事件一律返回 '1') ⇒ **push 红了 = job 红**。
        #
        # ⚠️ **这里为什么用 `exclude` 而不是 job 级 `if`**(2026-10-12 实测踩到):
        #   job 级的 `if` 在 **matrix 展开之前**求值, 上下文只有
        #   `github` / `inputs` / `needs` / `vars` —— **拿不到 `matrix`**。
        #   写成 `if: ... || matrix.name == 'app'` 会让整个 workflow 报
        #   "Invalid workflow file" 且 **一个 job 都不起**(实测 event=push 直接 failure,
        #   jobs API 返回空数组)。actionlint 能离线抓到这个错, 改完先跑它再推。

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先做 config/IaC 扫描 (不需要 build, 永远能跑)
      - name: Trivy config scan (${{ matrix.dockerfile }})
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: ${{ matrix.dockerfile }}
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'
          # L-8: 引用已接受漏洞基线 (见 .trivyignore 全文注释)。
          # 该入参由 trivy-action entrypoint.sh 处理: 把各文件 cat 合并成
          # ./trivyignores 并 export TRIVY_IGNOREFILE。**必须显式传** ——
          # 不传则本文件完全不被读取 (2026-10-11 实测确认原 workflow 零引用)。
          trivyignores: '.trivyignore'

      # 构建镜像。原为无条件 continue-on-error: true —— L-9 (收尾计划 §4.11):
      # schedule/dispatch 硬路径上构建失败会被容错, 后续三步扫描又全部以
      # steps.build.outcome == 'success' 为条件 → 扫描全 skip、job 无失败步 →
      # 结论 success, "扫了空气还报平安", 把 schedule 的 fail 语义整个架空。
      # 改为与 job 级 (:27) 同型惯用法: PR 维持 advisory 设计不变,
      # schedule/dispatch 构建失败 = 步骤失败 = job 红 (三个 skip 照 skip, job 已红无需兜底)。
      - name: Build image
        id: build
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          docker build -f "${{ matrix.dockerfile }}" \
            -t "microbubble-scan-${{ matrix.name }}:ci" \
            "${{ matrix.context }}"

      # 镜像漏洞扫描 → sarif 上传
      - name: Trivy image scan (sarif)
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'microbubble-scan-${{ matrix.name }}:ci'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-${{ matrix.name }}.sarif'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Upload sarif to code scanning
        if: steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.name }}.sarif'
          category: 'trivy-${{ matrix.name }}'

      # table 输出写到 actions log + 严重度门禁
      # PR: exit-code 0 (advisory); schedule/manual: exit-code 1 (HIGH/CRITICAL 即 fail)
      - name: Trivy image scan (table + gate)
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'microbubble-scan-${{ matrix.name }}:ci'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          ignore-unfixed: true
          exit-code: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          trivyignores: '.trivyignore'

  # push(仅 requirements.txt / .trivyignore / 本文件变更)时只跑 2 个 ——
  # 那 2 个 Dockerfile **真的读 requirements.txt**, 即改动实际影响的镜像:
  #   ✅ app            (Dockerfile,                    COPY + pip install -r)
  #   ✅ voice-pipeline (Dockerfile.voice-pipeline, :14 COPY + :23 pip install -r)
  #   ❌ db / web                      —— 无 Python 依赖
  #   ❌ funasr / whisper              —— 独立内联 pip install, 不读本文件
  #   ❌ mcp (Dockerfile.mcp)          —— 同上
  #
  # ❌ **commercial 于 2026-10-13 停止扫描**（主指挥裁定 B）—— 它是**休眠镜像**:
  #   ① `docker compose config --services` 无 commercial 服务, 本机也无该镜像;
  #   ② 但它 COPY 了整个 `app/`（:93）, 而 `app/` 里有 **19 个文件**用到
  #      ffmpeg / ffprobe / soffice / libreoffice, 它 runtime 段（:41 起）
  #      **四个全无命中** ⇒ 一旦部署即静默缺件（类 20.220）;
  #   ③ 为一个不部署的镜像持续烧 Actions 配额是净亏。
  # ⇒ **Dockerfile 保留不删**（将来真要商业化部署时补齐 ffmpeg+libreoffice 再加回），
  #   `tests/trivy/test_workflow_exists.py` 的矩阵断言已同步改为 7 个。
  #
  # ⚠️ **别用 `grep -q requirements.txt Dockerfile.mcp` 判断 mcp 读不读** ——
  #   实测是**假阳性**: Dockerfile.mcp 的**注释**里就写着
  #   「⚠️ 本文件不读 requirements.txt」(第 18 行), grep 命中的是那句注释。
  #   判据应是 `grep -nE "COPY requirements.txt|pip install .*-r requirements.txt"`,
  #   即**匹配用法而非提及**(类 20.225)。
  #
  # 成本: 全量 7 个约 28 分钟, 只跑 2 个约 8-10 分钟。
  # 失败语义: push 不在 continue-on-error 范围, 也不在 gate 的 advisory 分支
  #   (该表达式对非 PR 事件一律返回 '1') ⇒ **push 红了 = job 红**。
    # ⚠️ 2026-10-12 踩坑留档: **job 级 `if` 在 matrix 展开之前求值, 拿不到
    # `matrix` 上下文**; 而 `strategy.matrix.exclude` 是**静态配置, 不接受
    # `${{ }}` 表达式**(实测两种写法都让 workflow 报 Invalid workflow file、
    # **一个 job 都不起**; actionlint 两种都查不出来 —— 它只做静态语法检查,
    # 不做运行时会话验证)。故只能拆成两个 job, 用 `if` 在 job 级分流。
  scan-deps:
    if: github.event_name == 'push'
    name: trivy deps ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            context: .
          - name: voice-pipeline
            dockerfile: Dockerfile.voice-pipeline
            context: .
        # 2026-10-12: push(仅 requirements.txt / .trivyignore / 本文件变更)时,
        # 只跑**真的读 requirements.txt 的镜像**, 即改动实际影响的那些:
        #   ✅ 保留  app            (Dockerfile,                     COPY + pip install -r)
        #   ✅ 保留  voice-pipeline (Dockerfile.voice-pipeline, :14 COPY + :23 pip install -r)
        #   ❌ 排除  db / web                      —— 无 Python 依赖
        #   ❌ 排除  funasr / whisper              —— 独立内联 pip install, 不读本文件
        #   ❌ 排除  mcp (Dockerfile.mcp)          —— 同上
        #   ❌ 排除  commercial                    —— **休眠镜像**(见下方 scan-deps 同款注释)
        #
        # ⚠️ **别用 `grep -q requirements.txt Dockerfile.mcp` 来判断 mcp 读不读**
        #   —— 实测这是**假阳性**: Dockerfile.mcp 的**注释**里就写着
        #   「⚠️ 本文件不读 requirements.txt」(第 18 行), grep 命中的是那句注释文字。
        #   今天差点据此把 mcp 也算进受影响范围, 成本会多估近一倍。
        #   判据应是 `grep -nE "COPY requirements.txt|pip install .*-r requirements.txt"`,
        #   即**匹配用法而非提及**。同型坑见 CLAUDE.md 的 `.dft` 前缀假阳性。
        #
        # 成本: 全量 7 个约 28 分钟, 只跑 2 个约 8-10 分钟。
        # 失败语义: push 不在 `continue-on-error` 范围(见上), 也不在 exit-code 的
        #   advisory 分支(该表达式对非 PR 事件一律返回 '1') ⇒ **push 红了 = job 红**。
        #
        # ⚠️ **这里为什么用 `exclude` 而不是 job 级 `if`**(2026-10-12 实测踩到):
        #   job 级的 `if` 在 **matrix 展开之前**求值, 上下文只有
        #   `github` / `inputs` / `needs` / `vars` —— **拿不到 `matrix`**。
        #   写成 `if: ... || matrix.name == 'app'` 会让整个 workflow 报
        #   "Invalid workflow file" 且 **一个 job 都不起**(实测 event=push 直接 failure,
        #   jobs API 返回空数组)。actionlint 能离线抓到这个错, 改完先跑它再推。

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先做 config/IaC 扫描 (不需要 build, 永远能跑)
      - name: Trivy config scan (${{ matrix.dockerfile }})
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: ${{ matrix.dockerfile }}
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'
          # L-8: 引用已接受漏洞基线 (见 .trivyignore 全文注释)。
          # 该入参由 trivy-action entrypoint.sh 处理: 把各文件 cat 合并成
          # ./trivyignores 并 export TRIVY_IGNOREFILE。**必须显式传** ——
          # 不传则本文件完全不被读取 (2026-10-11 实测确认原 workflow 零引用)。
          trivyignores: '.trivyignore'

      # 构建镜像。原为无条件 continue-on-error: true —— L-9 (收尾计划 §4.11):
      # schedule/dispatch 硬路径上构建失败会被容错, 后续三步扫描又全部以
      # steps.build.outcome == 'success' 为条件 → 扫描全 skip、job 无失败步 →
      # 结论 success, "扫了空气还报平安", 把 schedule 的 fail 语义整个架空。
      # 改为与 job 级 (:27) 同型惯用法: PR 维持 advisory 设计不变,
      # schedule/dispatch 构建失败 = 步骤失败 = job 红 (三个 skip 照 skip, job 已红无需兜底)。
      - name: Build image
        id: build
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          docker build -f "${{ matrix.dockerfile }}" \
            -t "microbubble-scan-${{ matrix.name }}:ci" \
            "${{ matrix.context }}"

      # 镜像漏洞扫描 → sarif 上传
      - name: Trivy image scan (sarif)
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'microbubble-scan-${{ matrix.name }}:ci'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-${{ matrix.name }}.sarif'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Upload sarif to code scanning
        if: steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.name }}.sarif'
          category: 'trivy-${{ matrix.name }}'

      # table 输出写到 actions log + 严重度门禁
      # PR: exit-code 0 (advisory); schedule/manual: exit-code 1 (HIGH/CRITICAL 即 fail)
      - name: Trivy image scan (table + gate)
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'microbubble-scan-${{ matrix.name }}:ci'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          ignore-unfixed: true
          exit-code: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          trivyignores: '.trivyignore'
