name: Playwright Tests

# W89-P-3 (2026-07-30): Playwright CI 接入 — a11y + visual 2 job 分跑
#
# 设计纪律 (派工 v6 §5 反馈 类 20.50 沉淀):
#   - 必须分 2 job (a11y + visual), 避免一个失败阻塞另一个
#     原因: a11y axe-core 跑 5 page × 5 project ≈ 2-3 min, 视觉回归更慢.
#           合并成 1 job = 失败时分不清 a11y 还是 visual 真出 bug, debug 困难.
#           分 2 job = PR 视图清晰看到哪个维度红了, 单独 retry 也方便.
#   - 触发 paths 仅 web/** + .github/workflows/playwright.yml, 避免后端 PR
#     误触发 (后端 PR 应跑 qa-bench-ci.yml 而非此 workflow).
#   - visual job 加 "Update snapshots (only on main push)" 自动更新 baseline.
#   - 不阻塞 (continue-on-error: true) on first iteration, 待 visual baseline 稳定后
#     再撤掉 continue-on-error 改 hard fail.

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'web/tests/**'
      - '.github/workflows/playwright.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ========== Job 1: a11y (axe-core) ==========
  a11y:
    name: axe-core a11y
    runs-on: ubuntu-latest
    # 2026-10-03 S3.9: 15 -> 30 分钟。run 37039049999 实测: 前置开销就已 866s
    # (15 分钟预算的 96%), 测试一步没跑到就被 job 超时杀掉, 结论是 cancelled
    # 而非任何真实断言失败。
    # 前置开销里的大头是 `npx playwright install --with-deps` —— 它会顺带跑 apt
    # 装字体/mesa 等系统依赖, 实测在 run 37039049999 花了 683s, 而前几次 run
    # (37037543090 / 37035451684 / 37024017862) 实测只有 25-32s, 相差 20 倍
    # —— 说明这是 apt 镜像源偶发变慢, 不是固定成本, 但必须能扛住。
    # 正常态前置开销约 193s (browsers 30 + fonts 6 + testenv 150 + vite 2 +
    # initdb 5), 实测测试本身 (25 baseline + 5 axe) 约 92s。
    # 30 分钟 = 最坏前置 866s 后仍留 934s, 约为实测测试耗时的 10 倍余量。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install CJK fonts (a11y color-contrast 需中文字体)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list | grep -i "noto.*cjk" | head -3

      - name: "Start test environment (W89: docker-compose.test.yml reuse)"
        run: |
          # W89-P-3: 复用 W68 第 7 批 A-3 已建的 docker-compose.test.yml
          #   (qa-bench 物理隔离栈: pg-test 5433 + app-test 8001)
          #   复用 W67 第 48 步 pre-built image 模式 (build-image.yml push 时自动 build):
          #   先 pull ghcr.io pre-built image → tag app-test:ci → compose 用 image: 而非 build
          docker pull ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest 2>&1 | tail -3
          docker tag ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest app-test:ci
          docker images app-test:ci --format "✓ app-test:ci ready, {{.Size}}"
          # 2026-10-02 S3.7④: 不再 up minio-test (上游 quay.io/minio/minio 全仓不可达,
          #   实测 latest + 6 个 RELEASE tag + 无 tag 形式全部取不到 manifest, 对照组正常,
          #   换 tag 无解)。app-test 启动链不依赖 minio (/health 是静态 dict + file_service
          #   已 lazy init), a11y job 的 testMatch 也不含任何 drive/upload spec。
          #   服务定义仍在 docker-compose.test.yml (profiles ["s3"]),
          #   上游恢复后加回 minio-test 即可复原。
          docker compose -f docker-compose.test.yml up -d app-test pg-test redis-test 2>&1 | tail -10

          # 等 app /health 200 (最长 180s, app 启动 ~30-60s)
          for i in {1..90}; do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "✓ app /health OK (attempt $i/90)"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "✗ app /health never returned 200"
              docker compose -f docker-compose.test.yml logs app-test | tail -50
              exit 1
            fi
            sleep 2
          done

      - name: Start vite dev server (proxy -> app-test:8001)
        working-directory: web
        env:
          VITE_API_PROXY_TARGET: http://localhost:8001
        run: |
          npx vite --port 3000 --strictPort > /tmp/vite-a11y.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "✓ vite dev OK (attempt $i/60)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "✗ vite dev never started"
              cat /tmp/vite-a11y.log
              exit 1
            fi
            sleep 2
          done

      - name: "Init test DB schema + seed + test user (W98 fix + S3.8 fail-loud)"
        run: |
          # W98 (2026-07-31): CI 空库 app-test 无 xiaoqi_testbot → login AUTH_ERROR →
          #   injectAuth 注入无效 token → 所有页面被 router 守卫带去看 dashboard,
          #   a11y baseline 记录的 25 个全 0 violations 是假绿 (X-18 真登录态守卫).
          #   复用 qa-bench-ci.yml 同一模式: 在 app-test 容器内跑 init_test_db_all.py
          #   (create_all + seed 24 members + ensure_test_user 幂等建号).
          #   init_db.py 读 settings.DATABASE_URL (容器默认指向 pg-test, compose 内网直连).
          #
          # 2026-10-02 S3.8 修复两处**静默失败** (run 37013474583 实测, 门禁红但根因不可见):
          #
          #   (1) 容器名不存在: 本行原为 `docker exec ... app-test`, 但 docker-compose.test.yml
          #       的 app-test / redis-test 都**没有** container_name (只有 glitchtip 和
          #       pg-exporter-test 有), compose 按 "<project>-<service>-1" 命名, project 取自
          #       仓库目录名 → CI 真实容器名是 `microbubble-agent-app-test-1`, 日志 step 7 实测:
          #           Container microbubble-agent-app-test-1  Started
          #           ✓ app /health OK (attempt 6/90)
          #       故 `docker exec app-test` 恒报 "No such container: app-test"。
          #       修法: 改用 `docker compose ... exec -T`, 由 compose 自行解析服务→容器,
          #       **不硬编码 project 前缀** (目录名/project name 一变又会漂移 —— 类 20.158 同型教训)。
          #
          #   (2) 失败被 `| tail -20` 吞掉: 管道后 bash -e 只看到 tail 的退出码 (恒 0),
          #       于是 docker exec 报错而 step 仍 conclusion=success, 后续 12 步全绿,
          #       直到快照比对才以"莫名新增违规"的面貌爆出来。
          #       修法: 输出落文件后 tee, 再 fail-loud 断言 (见下), 断言失败即 exit 1。
          #
          # 2026-10-02 S3.8 第二次修正 (run 37022083555 实测): 上面的容器名修好后,
          # init_test_db_all.py 暴露出**自身**的 TypeError, 即这行从来没成功跑过:
          #     File "/app/scripts/init_test_db_all.py", line 34, in run_ensure_test_user
          #       args = parse_args([])
          #     TypeError: parse_args() takes 0 positional arguments but 1 was given
          #   scripts/ensure_test_user.py:51 的签名是 `def parse_args():` (无参),
          #   而 init_test_db_all.py:34 传了 [] —— 两者自 830d6243e (2026-07-23)
          #   起就不兼容, 该脚本的 ensure 分支**从未成功执行过**。
          #   注意 init_db 部分是成功的 (日志里确有"数据库初始化完成"),
          #   只有 ensure_test_user 这一步炸, 故账号一直没建出来。
          #
          #   为什么不在 workflow 里改用修好的脚本, 而要拆成两条命令:
          #     - 修 scripts/init_test_db_all.py 需要重建 app-test-latest 镜像才生效
          #       (Dockerfile 是 COPY . ., 脚本烘进镜像; 仓库无 bind mount 覆盖 scripts/),
          #       而 build-image.yml 近 3 个月 8 次 push 全部 cancelled/failed,
          #       唯一一次成功是 2026-09-18。改脚本 = 本轮拿不到新镜像 = 门禁仍红。
          #     - init_test_db_all.py 本身只是这两个脚本的薄封装
          #       (run_init_db -> init_db.init_database; run_ensure_test_user -> ensure),
          #       且 --with-alembic-stamp 本 workflow 从未使用, 故直接分别调用
          #       两个脚本可执行文件, 语义完全等价, 且立即生效。
          #   两个脚本都有 `if __name__ == "__main__"` 入口, 可独立运行。
          set -o pipefail
          {
            docker compose -f docker-compose.test.yml exec -T \
              -e SKIP_DB_SETUP=1 app-test \
              python scripts/init_db.py
            docker compose -f docker-compose.test.yml exec -T \
              -e SKIP_DB_SETUP=1 app-test \
              python scripts/ensure_test_user.py
          } 2>&1 | tee /tmp/init-db.log

          # fail-loud 断言 (任一不满足即 exit 1, 不让"没建号"再流到快照比对才炸):
          #   数据库初始化完成 ← scripts/init_db.py:29
          #   [CREATED] / [OK]    ← scripts/ensure_test_user.py:116 / :90
          #   无 "No such container" / **真** traceback
          #
          # 2026-10-03 S3.9 修正 (run 37035451684 实测): 原来的
          #   `grep -qE "No such container|Traceback"`
          # 会在**建号成功之后**仍然误报失败。原因是 passlib 探测 bcrypt 版本时
          # 会往 stderr 打一段 (trapped) 警告, 它字面量里就含 "Traceback":
          #     (trapped) error reading bcrypt version
          #     Traceback (most recent call last):
          #       File ".../passlib/handlers/bcrypt.py", line 620, in _load_backend_mixin
          #         version = _bcrypt.__about__.__version__
          #     AttributeError: module 'bcrypt' has no attribute '__about__'
          # 这段是**良性**的: passlib 只是想知道 bcrypt 版本, 拿不到就跳过;
          # 实测 hash/verify 全部正常 (镜像内实跑: verify ok=True, reject ok=True),
          # 且日志里 [CREATED] 测试账号: id=23 已经打出来 —— 建号本就成功。
          # 所以不能按 "Traceback" 字面量判失败。修法: 先把这 7 行**已知的良性
          # passlib 噪音**用 grep -vE 剔掉, 再对剩余内容判失败:
          #   (trapped) error reading bcrypt version        <- 良性首行
          #   Traceback (most recent call last):           <- 良性首行 (顶格! '^Traceback' 拦不住)
          #     File ".../passlib/handlers/bcrypt.py"     <- 良性帧
          #     version = _bcrypt.__about__.__version__    <- 良性源码行
          #               ^^^^^^^^^^^^^^^^^                <- 良性指示符行
          #   AttributeError: ... has no attribute '__about__'  <- 良性末行
          # 注意: 试过用 '^Traceback' 收紧, **无效** —— passlib 那行 Traceback
          # 恰好顶格 (实测 repr 确认不以空格开头), 仍会误伤。故只能按内容白名单剔除。
          # 剔除后仍会命中的才是真异常 (已实测 5 个用例):
          #   正例(应放行): 仅 passlib 噪音 + [CREATED] 成功行
          #   反例(应拦下): 脚本自身 Traceback / "No such container" / "[ERROR] ..."
          #                / 我们自己代码抛的 Traceback (member_service.py 帧)
          # 真正的失败信号已由上面两条 grep 兜住 (缺 "数据库初始化完成" /
          # 缺 [CREATED]/[OK] 都会 exit 1), 这里只是额外防御。
          grep -q "数据库初始化完成" /tmp/init-db.log || {
            echo "::error::init_test_db_all 未跑成功 (缺 '数据库初始化完成') — 测试账号多半没建"; exit 1; }
          grep -qE "\[(CREATED|OK)\]" /tmp/init-db.log || {
            echo "::error::ensure_test_user 未建号 (缺 [CREATED]/[OK]) — 后续 login 必 AUTH_ERROR"; exit 1; }
          if grep -vE "^\(trapped\)|passlib/handlers/bcrypt\.py|_bcrypt\.__about__|^Traceback \(most recent call last\):$|^ +\^+$|^ *version = _bcrypt|has no attribute '__about__'" /tmp/init-db.log \
             | grep -qE "No such container|Traceback|Error:"; then
            echo "::error::init_test_db_all 输出含容器/致命异常错误"; cat /tmp/init-db.log; exit 1
          fi

      - name: Get fresh TEST_TOKEN from app-test
        env:
          TEST_USERNAME: ${{ secrets.PLAYWRIGHT_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: |
          # W93: CI 的 app-test 用 TEST_SECRET_KEY (test_jwt_secret_different_from_prod),
          #   本地 token 无效 → 必须从 CI 自己的后端现场拿
          #   secret 未设置时用默认测试账号 (env 层 || 生效, 比 secrets.X || 默认 可靠)
          USER="${TEST_USERNAME:-xiaoqi_testbot}"
          PASS="${TEST_PASSWORD:-testbot_pass_2026}"
          RESP=$(curl -s -X POST http://localhost:8001/api/v1/auth/login             -H "Content-Type: application/json"             -d "{\"username\":\"$USER\",\"password\":\"$PASS\"}")
          echo "TOKEN_LEN=${#RESP}"

          # 2026-10-02 S3.8 fail-loud: 后端 401 时响应体是错误 JSON,
          #   下游 TEST_TOKEN 拿到的就是这个 JSON, injectAuth 照样 return true,
          #   所有页面被 router 守卫打到 /login → 快照录的是登录页 (假绿)。
          #   实测 run 37013474583: TOKEN_LEN=65 且 env 里是 AUTH_ERROR JSON。
          #   断言: 必须是 JWT (三段 base64url, 以 eyJ 开头), 否则 exit 1。
          #
          # 2026-10-03 S3.9 修正 (run 37037543090 实测): S3.8 的断言**写错了对象**。
          #   /api/v1/auth/login 返回的是 JSON **对象**
          #     {"access_token":"eyJ...","refresh_token":"eyJ...","user":{...}}
          #   而不是裸 JWT 字符串。旧代码 `echo "PLAYWRIGHT_TEST_TOKEN=$RESP"` 把整个
          #   响应体写进 GITHUB_ENV, 于是 injectAuth 注入的是一个 506 字符的 JSON blob:
          #     - router 守卫只判真值 (`if (requiresAuth && !token)`), blob 也是真值,
          #       所以页面**不会**被打到 /login → 快照里 authed=yes 仍是**假信号**;
          #     - 但 web/src/utils/request.js 发的是 `Bearer <localStorage.access_token>`,
          #       真实前端存的是**裸 access_token 字符串**, 所以每个 API 请求都会带
          #       这个 blob → 后端 401 → a11y 扫的其实是无数据页面。
          #   修法: 像真实前端一样取 access_token 字段再注入。
          #   断言同步收紧到"取出来的 access_token 必须是 JWT", 比原来更严:
          #   login 失败 (错误 JSON) 时取不到 access_token, 依然 exit 1。
          ACCESS_TOKEN=$(printf '%s' "$RESP" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
          echo "PLAYWRIGHT_TEST_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

          case "$ACCESS_TOKEN" in
            eyJ*.*.*) echo "✓ token looks like a JWT (len=${#ACCESS_TOKEN})" ;;
            *) echo "::error::login 未返回可用的 access_token (错误 JSON 或响应结构异常)"
               echo "::error::原始响应(前 200 字符), 长度=${#RESP}: ${RESP:0:200}"
               exit 1 ;;
          esac

      # 2026-10-03: 删掉两个 --update-snapshots 步骤 —— 这道门禁此前**恒绿**, 是装饰品.
      #
      # 原结构 (cec42985f 起, 1ae5699ad 改名保留):
      #   1. update --update-snapshots ... || true          (warm-up pass)
      #   2. update --update-snapshots                    (record CI baseline)
      #   3. verify (不带 --update-snapshots)
      # 第 3 步拿**第 2 步刚重写的基线**跟自己比 → 无论真实现状多少违规都必绿.
      # 两个 update 步骤还各有副作用: 会在 runner 上覆写 __snapshots__/, 让
      # 紧随其后的 "Upload a11y snapshots (回灌仓库用)" artifact 装的其实是
      # CI 现生成的基线, 而非仓库入库基线 —— 回灌通道同样失效.
      #
      # 实证 (本地隔离 worktree @ HEAD 起真 app-test 8001 + vite, 复现 CI 数字):
      #   入库基线 violations 合计 = 10   (15 个文件 0 + 10 个文件 1)
      #   CI 实际      violations 合计 = 27  (run 37041897801 artifact)
      #   本地 verify (不带 --update)   = 27, 25 failed / 27 passed, exit 1
      # 即现状与入库基线**差 17 条**, 旧流程却报 success.
      #
      # 为什么保留一个 warm-up (不带 --update-snapshots):
      #   f987ee8eb 的动机是真实的 —— vite 冷编译时扫到中间态, 与缓存热态结果不一致.
      #   这里保留同样"先跑一遍让 vite 热起来"的语义, 但**不给它写快照的权限**:
      #   无 --update-snapshots 时 toMatchSnapshot 只比对不写盘 (实测: 跑完 verify
      #   后 git status 干净, __snapshots__ 25 个文件字节不变).
      #   冷编译那 2 个 case 的差异被如实报红, 而不是被"改基线"吞掉.
      - name: Warm up vite transform cache (不写快照, 只为消除冷编译中间态)
        working-directory: web
        env:
          BASE_URL: http://localhost:3000
          VITE_API_PROXY_TARGET: http://localhost:8001
          TEST_TOKEN: ${{ env.PLAYWRIGHT_TEST_TOKEN }}
        run: npx playwright test -c tests/visual/a11y/playwright.a11y.config.mjs --reporter=list || true

      - name: Run axe-core a11y tests (verify against COMMITTED baseline)
        working-directory: web
        env:
          BASE_URL: http://localhost:3000
          VITE_API_PROXY_TARGET: http://localhost:8001
          TEST_TOKEN: ${{ env.PLAYWRIGHT_TEST_TOKEN }}
        run: npx playwright test -c tests/visual/a11y/playwright.a11y.config.mjs --reporter=list

      # 2026-10-03: 这个 artifact 的语义此前也是错的 —— 删掉 update 步骤前, 它装的是
      # CI 刚覆写过的现生成基线 (回灌=自我确认, 无意义). 现在 __snapshots__ 在 verify
      # 期间**只读**, 装出来的就是仓库入库基线; 真正要看的是 verify 失败时 playwright
      # 写进 test-results/*-actual.txt 的**实测值**, 那个才代表 CI 真跑出来的违规.
      # 故本步骤保留 (供人核对入库基线), 另见下面的 failure debug 步骤.
      - name: Upload a11y snapshots (仓库入库基线, 供人工核对)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-snapshots
          path: web/tests/visual/a11y/__snapshots__/
          retention-days: 7

      - name: Debug - print actual snapshots on failure
        if: failure()
        working-directory: web
        run: |
          # 2026-10-03: glob 原本是 test-results/*-actual.txt (单层), 但 playwright
          # 实际把每个 case 的 actual 写在 test-results/<case-dir>/<name>-actual.txt
          # (实测本地 verify: find test-results -name '*-actual.txt' 命中 25 个,
          # 单层 glob 命中 0). 即门禁红的时候这个 step 什么都没打印, 门禁红不可诊断.
          # 改用 find 递归, 并顺手汇总 violations 合计, 让"红"能直接读出数字.
          echo "=== CI 实测快照 (vs 入库基线的实际值) ==="
          total=0
          for f in $(find test-results -name '*-actual.txt' 2>/dev/null | sort); do
            echo "--- $f ---"
            cat "$f"
            n=$(grep -m1 '^violations:' "$f" | sed 's/violations: *//')
            [ -n "$n" ] && total=$((total + n))
          done
          echo "=== CI 实测 violations 合计 = $total ==="
          echo "=== test-results dir ==="
          ls test-results/ 2>/dev/null | head -20

      - name: Upload a11y report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

      - name: Teardown test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v 2>&1 | tail -5
          echo "✓ test env cleaned up"

  # ========== Job 2: visual regression ==========
  visual:
    name: visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # W89-P-3 第一版: 视觉回归本身易碎 (v76.2 弃用过), 先 non-blocking
    # 等 baseline 稳定后 (manual review) 撤掉 continue-on-error 改 hard fail
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 2026-10-05 S3.12 阶段 2 治①: 视觉回归**改跑专用容器**。
      #
      # 为什么不在裸 ubuntu runner 上 (实测, 见下方 FONT EVIDENCE 注释):
      #   app 的 body 字体栈 (web/src/assets/variables.css:288) 是
      #     -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, ... , sans-serif
      #   裸 runner 上即使 `apt-get install fonts-noto-cjk` 装好了, fontconfig 仍把
      #   'Segoe UI' 解析成 **WenQuanYi Zen Hei** —— 因为栈里第一个"存在的"名字
      #   就是 Segoe UI, Noto 永远轮不到。这就是"Windows 录 → Linux 比 0/118 全炸"
      #   的根因, 而**不是**"CI 没装字体"。
      #
      #   FONT EVIDENCE (容器内实测):
      #     纯净 playwright 镜像:  fc-match "Segoe UI"  -> WenQuanYi Zen Hei
      #     + fonts-noto-cjk:      fc-match "Segoe UI"  -> WenQuanYi Zen Hei   (装了不起作用)
      #     + fontconfig 别名规则:  fc-match "Segoe UI"  -> Noto Sans CJK SC   (才生效)
      #
      # 容器同时锁死三件事, 使"录基线"与"跑门禁"跑在**同一确定性环境**:
      #   1. Chromium 151.0.7922.34 rev1234  ← 与 web/package-lock.json 锁的
      #      playwright-core 1.62.0 是**同一个浏览器构建**
      #   2. fonts-noto-cjk **钉版本** 1:20230817+repack1-3 (字体升级会改字形)
      #   3. fontconfig 别名规则把字体栈每个名字都指向同一字体文件
      #
      # ⚠️ 本 step 只做 build, 不改 a11y job (它今天刚修到真绿, 口径不动)。
      - name: Build pinned visual-regression image (字体+Chromium 钉死)
        run: |
          set -euo pipefail
          docker build \
            -f docker/visual-regression/Dockerfile \
            -t microbubble-visual-regression:pin-2026-10-05 \
            docker/visual-regression

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      # ⚠️ **不再**在 runner 上装字体 / 装浏览器。
      #   浏览器与字体都由上面的容器提供。留在 runner 上装反而制造
      #   "runner 与容器字体不一致"的假确定性 —— 那正是本 step 要消除的东西。

      - name: "Start test environment"
        run: |
          # 复用 W67 第 48 步 pre-built image 模式
          docker pull ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest 2>&1 | tail -3
          docker tag ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest app-test:ci
          docker images app-test:ci --format "✓ app-test:ci ready, {{.Size}}"
          # 2026-10-02 S3.7④: 同 a11y job — minio-test 上游不可达故不 up。
          #   本 job 是 continue-on-error: true, 其中 4 个 drive spec 会真调
          #   POST /api/v1/drive/files/upload (无 minio 时 500), 不影响门禁。
          docker compose -f docker-compose.test.yml up -d app-test pg-test redis-test 2>&1 | tail -10

          for i in {1..90}; do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "✓ app /health OK (attempt $i/90)"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "✗ app /health never returned 200"
              docker compose -f docker-compose.test.yml logs app-test | tail -50
              exit 1
            fi
            sleep 2
          done

      # 2026-10-05 S3.12: vite 也改在**同一个容器**里跑。
      #   为什么要一起挪: vite dev server 的模块转换/依赖预构建如果跑在 runner 上,
      #   而浏览器跑在容器里, 两边的 Node 平台不同 (rollup/esbuild native 模块) ——
      #   实测本机把 Windows 的 node_modules 挂进 Linux 容器会直接
      #   `Cannot find module '@rollup/rollup-linux-x64-gnu'`。
      #   让 vite 与浏览器同容器 ⇒ 依赖转换结果与截图环境同源。
      - name: Start vite dev server in pinned container (proxy -> app-test:8001)
        run: |
          set -euo pipefail
          docker rm -f visual-vite 2>/dev/null || true
          docker run -d --name visual-vite \
            --network host \
            -e VITE_API_PROXY_TARGET=http://localhost:8001 \
            -v "$PWD:/app" \
            -w /app/web \
            microbubble-visual-regression:pin-2026-10-05 \
            npx vite --host 0.0.0.0 --port 3000 --strictPort

          for i in {1..90}; do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "✓ vite dev OK (attempt $i/90)"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "✗ vite dev never started"
              docker logs visual-vite | tail -40
              exit 1
            fi
            sleep 2
          done

      - name: "Init test DB schema + seed + test user (W98 fix + S3.8/S3.9 fix-loud)"
        run: |
          # W98 (2026-07-31): 同 a11y job — CI 空库无 xiaoqi_testbot → login AUTH_ERROR.
          #   必须先建号再拿 token, 否则 visual 全被重定向到 /dashboard.
          #
          # 2026-10-03 S3.10 (本 job 同步 a11y 的 S3.8/S3.9 修复):
          #   实测 run 37092817894 —— 本 step **从未成功执行过**, 且失败被静默吞掉:
          #     Error response from daemon: No such container: app-test
          #   而 step 结论仍是 success, 因为 `2>&1 | tail -20` 让 bash -e 只看到
          #   tail 的退出码 (恒 0) —— 与 S3.8 记录的第 (2) 类静默失败同型。
          #
          #   根因: docker-compose.test.yml 里 app-test **没有** container_name
          #   (只有 glitchtip / pg-exporter-test 有), compose 按
          #   "<project>-<service>-1" 命名, project 取自仓库目录名 → CI 真实容器名
          #   是 microbubble-agent-app-test-1。写死 `app-test` 恒失败。
          #   ⚠️ 修法**不**是硬编码那个名字 —— project name 会随目录名/环境变 (类 20.158 同型
          #   教训: 容器名/索引名这类部署态事实必须实测, 不能推理)。改用
          #   `docker compose exec -T`, 由 compose 自己解析 service → 容器。
          #
          #   脚本选择同 a11y job (S3.8 第二次修正): init_test_db_all.py 只是
          #   init_db.init_database + ensure_test_user 的薄封装, 而其 ensure 分支
          #   因 scripts/ensure_test_user.py:51 的 parse_args() 无参、而
          #   init_test_db_all.py:34 传了 [] → TypeError, 该分支**从未成功执行过**。
          #   直接分别调用两个可执行脚本, 语义等价且立即生效 (改脚本需重建
          #   app-test-latest 镜像才生效, 本轮拿不到新镜像)。
          set -o pipefail
          {
            docker compose -f docker-compose.test.yml exec -T \
              -e SKIP_DB_SETUP=1 app-test \
              python scripts/init_db.py
            docker compose -f docker-compose.test.yml exec -T \
              -e SKIP_DB_SETUP=1 app-test \
              python scripts/ensure_test_user.py
          } 2>&1 | tee /tmp/init-db-visual.log

          # fail-loud 断言: 不让"没建号"再流到快照比对才以"莫名失败"的面貌爆出来.
          #   数据库初始化完成 ← scripts/init_db.py:29
          #   [CREATED] / [OK]    ← scripts/ensure_test_user.py:116 / :90
          #
          #   ⚠️ 不能按 "Traceback" 字面量判失败 (S3.9 实测): passlib 探测 bcrypt
          #   版本时会往 stderr 打一段**良性** trapped 警告, 其字面量就含
          #   "Traceback" / "AttributeError", 而建号其实已成功 ([CREATED] 已打出)。
          #   该行恰好顶格, 用 '^Traceback' 也拦不住 —— 只能按内容白名单剔除。
          grep -q "数据库初始化完成" /tmp/init-db-visual.log || {
            echo "::error::init_db 未跑成功 (缺 '数据库初始化完成') — 测试账号多半没建"; exit 1; }
          grep -qE "\[(CREATED|OK)\]" /tmp/init-db-visual.log || {
            echo "::error::ensure_test_user 未建号 (缺 [CREATED]/[OK]) — 后续 login 必 AUTH_ERROR"; exit 1; }
          if grep -vE "^\(trapped\)|passlib/handlers/bcrypt\.py|_bcrypt\.__about__|^Traceback \(most recent call last\):$|^ +\^+$|^ *version = _bcrypt|has no attribute '__about__'" /tmp/init-db-visual.log \
             | grep -qE "No such container|Traceback|Error:"; then
            echo "::error::init 输出含容器/致命异常错误"; cat /tmp/init-db-visual.log; exit 1
          fi

      - name: Get fresh TEST_TOKEN from app-test
        env:
          TEST_USERNAME: ${{ secrets.PLAYWRIGHT_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: |
          USER="${TEST_USERNAME:-xiaoqi_testbot}"
          PASS="${TEST_PASSWORD:-testbot_pass_2026}"
          RESP=$(curl -s -X POST http://localhost:8001/api/v1/auth/login             -H "Content-Type: application/json"             -d "{\"username\":\"$USER\",\"password\":\"$PASS\"}")
          echo "TOKEN_LEN=${#RESP}"

          # 2026-10-03 S3.10: 本 job 的登录态此前是**坏的**, 实测 run 37092817894:
          #   TOKEN_LEN=65, 而写进 GITHUB_ENV 的是整个响应体
          #     {"error":{"code":"AUTH_ERROR","message":"用户名或密码错误","details":{}}}
          #   而不是 token。后果: 每个页面请求都带 `Bearer <这个 JSON>` → 后端 401 →
          #   chat 系列 spec 在填完表单后干等满 test.setTimeout(240_000),
          #   CI retries: 1 再等一遍 → 单个 spec 吃掉 8 分钟, job 必然 20 分钟超时.
          #   (对照: 同一 run 的 a11y job TOKEN_LEN=506 = 真 JSON, 能取出 access_token。)
          #
          #   /api/v1/auth/login 返回的是 JSON **对象**
          #     {"access_token":"eyJ...","refresh_token":"eyJ...","user":{...}}
          #   不是裸 JWT。必须像真实前端那样取 access_token 字段:
          #   web/src/utils/request.js 发的是 `Bearer <localStorage.access_token>`,
          #   真实前端存的就是**裸 access_token 字符串**。
          #   (S3.8 教训: 断言写在"取出来的 access_token 必须是 JWT"上, 而不是
          #    响应体非空 —— 错误 JSON 也是非空的, 那是假信号。)
          ACCESS_TOKEN=$(printf '%s' "$RESP" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
          echo "PLAYWRIGHT_TEST_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

          case "$ACCESS_TOKEN" in
            eyJ*.*.*) echo "✓ token looks like a JWT (len=${#ACCESS_TOKEN})" ;;
            *) echo "::error::login 未返回可用的 access_token (错误 JSON 或响应结构异常)"
               echo "::error::原始响应(前 200 字符), 长度=${#RESP}: ${RESP:0:200}"
               exit 1 ;;
          esac

      - name: Run visual regression tests (pinned container, verify mode)
        env:
          BASE_URL: http://localhost:3000
          VITE_API_PROXY_TARGET: http://localhost:8001
          CI: 'true'
          TEST_TOKEN: ${{ env.PLAYWRIGHT_TEST_TOKEN }}
        # 2026-10-05 S3.12 阶段 2: 改由 run-visual.sh 统一入口执行, 浏览器跑在
        # 上面构建的**钉死镜像**里, 且注入 FAKETIME_NO_CACHE=1 冻结时钟。
        #
        #   为什么必须在**容器内**跑而不是 runner 上:
        #     ① 字体 — 裸 runner 上 fc-match "Segoe UI" -> WenQuanYi Zen Hei
        #        (装 fonts-noto-cjk 也不生效, 见上面 build step 的 FONT EVIDENCE)
        #     ② 墙钟 — runner 的墙钟是真实时间, MainLayout 时钟牌 20s tick
        #        ⇒ 跨 20s 边界就飘; 容器内 FAKETIME 冻结
        #     ③ 浏览器版本 — 容器锁 Chromium 151.0.7922.34 rev1234,
        #        与 package-lock.json 的 playwright-core 1.62.0 同构建
        #
        #   run-visual.sh 先做 **fail-loud 前置断言** (字体锁 + 时钟冻结),
        #   任一不成立就 `::error::` 退出 —— 不让"环境没钉死"流到像素比对
        #   才以"莫名全红"的面貌爆出来 (类 20.215 的逐字段圈界思路)。
        #
        #   ⚠️ verify 模式**不带** --update-snapshots: 基线只由人工 review 后的
        #      本地提交产生, CI 不得改写基线 (自我确认 = 无判别力)。
        run: |
          set -uo pipefail
          docker rm -f visual-runner 2>/dev/null || true
          docker run --rm --name visual-runner \
            --network host \
            -e BASE_URL=http://localhost:3000 \
            -e CI=true \
            -e TEST_TOKEN="$TEST_TOKEN" \
            -e VIZ_CONFIG=tests/visual/playwright.visual.config.mjs \
            -v "$PWD:/app" \
            -w /app \
            microbubble-visual-regression:pin-2026-10-05 \
            bash docker/visual-regression/run-visual.sh verify
          echo "visual-runner exit=$?"
        # 2026-10-03 S3.10 第 1 步: 改用专用 config 收敛到**真视觉回归**。
        #
        #   旧命令 `npx playwright test` 走 web/playwright.config.js, 它的 testMatch
        #   是 `tests/visual/.*\.spec\.mjs`, 于是把该目录下 **46 个 spec / 257 用例**
        #   全部收进这道"视觉回归"门禁。其中真正做像素比对 (toHaveScreenshot) 的
        #   只有 5 个 spec / 13 处调用点, 其余 41 个是历史 LLM / 功能 E2E 残留
        #   (chat / drive / RAG / recording 等), 断言的是 DOM 与 computed style。
        #
        #   为什么这会让 job 超时 (实测 run 37100057334, 登录态已修好之后):
        #     测试步 17m02s 只跑到 100/257; chat 系列逐个打满
        #     test.setTimeout(240_000), CI retries: 1 再翻一倍。
        #   而被收敛进来的 5 个 spec 全部 no-llm / no-upload (逐个 grep 确认无
        #   chat/stream 与 drive/files/upload), CI 实测单例 mean 4.10s / max 10.9s
        #   (n=50, 合计 205.2s) ⇒ 收敛后 ~9 分钟可跑完, 不再 cancelled。
        #
        #   收窄到 127 用例, 且**逐 project 复刻**原分布 (28/22/30/47), 因为基线
        #   文件名带 projectName, 少一个 project 会让既有基线对不上。
        #
        # ⚠️ **预期本 job 是 failure, 原因是缺基线, 不是代码回归**:
        #   这 5 个 spec 的 -snapshots/ 基线在 git 里全都不存在 (f9495f13b 废弃 v76
        #   时删, 4c97ae562 删 baseline png, 81423c4a2 又把 PNG 加进 .gitignore)。
        #   实测 Playwright 缺基线时 (updateSnapshots 默认 "missing") 判 1 failed 并报
        #   `A snapshot doesn't exist at ...`, **不会自动写盘**。
        #   ⇒ 看到这个红请勿误判成 UI 回归; 它的含义是"还没有基线可比"。
        #   本步**刻意不带** --update-snapshots: 那会在无人 review 的情况下把基线
        #   悄悄写进 runner, 正是我们要拒绝的"未经审查的基线固化"。
        #
        #   录基线的前置是 ChatViewSSE 的 CSS 抽取完成 —— 像素比对是验收 CSS 改动
        #   的唯一手段, 顺序不可颠倒: CSS 抽取 → 视觉回归转硬门 → 才谈录基线。

      # 2026-10-03 S3.10: 删掉 "Update snapshots (only on main push)" 整步。
      #
      #   该步跑 `npx playwright test --update-snapshots`, 把 runner 上的
      #   **-snapshots/ 全部重写一遍**, 然后**什么都不产出**:
      #     - 没有 git commit / git push (下方两步都不是);
      #     - "Upload visual diff on failure" 只传 web/test-results/,
      #       不含 __snapshots__, 且只在 failure 时跑;
      #     - green 时连 artifact 都没有。
      #   即: 把 257 个用例**整个重跑一遍**换零收益。
      #
      #   与 a11y job 被 9cb3337c1 删掉的是同型"自我确认"病灶: 基线在 runner 上
      #   被改写却从不回灌仓库, 这道门禁因此永远比"自己上一遍刚写的基线"——
      #   换句话说它无法对基线漂移报红, 只是白烧一轮 CI 时间。
      #
      #   真正要重录基线必须是**人工 review 后的本地提交**, 不能靠 CI 自动改写。
      #   注意: 本 job 的 **-snapshots/ 基线目前在 git 里全都不存在**
      #   (f9495f13b 废弃 v76 时删, 4c97ae562 删 baseline png, 81423c4a2 又把 PNG
      #   加进 .gitignore), 所以收敛/重录基线这件事必须走独立决策, 不能在
      #   workflow 里自动补 —— 见 commit message 的"后续顺序"段。

      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diff
          path: web/test-results/
          retention-days: 7

      - name: Teardown test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v 2>&1 | tail -5
          echo "✓ test env cleaned up"