name: "Build app-test image (W67 step 48 路线 2: pre-built)"

# W67 第 48 步 (2026-07-23): GHCR pre-built image 跳过 CI build
# - 每次 push to main (或 Dockerfile 改) 自动 build image 推到 ghcr.io
# - qa-bench-smoke.yml / playwright.yml 用 `docker pull` 直接拉 pre-built image (1-2 min 跨 run cache hit;
#   qa-bench-ci.yml (D5 1000 题门禁) 已于 2026-10-07 退役)
# - 替代每 CI run 重 build app-test image (6-12 分钟 cold cache)
#
# Image 名称约定: ghcr.io/<OWNER>/microbubble-agent:app-test-latest
# qa-bench-smoke.yml 用 `docker pull` + `docker tag ... app-test:ci` 复用启动逻辑
# (qa-bench-ci.yml Step 6 同模式, 该 D5 门禁已于 2026-10-07 退役).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/init_test_db_all.py"
      - "alembic/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build-image.yml"
  # 允许手动 trigger (调试 cache miss / 强制重建)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push app-test image to GHCR
    runs-on: ubuntu-latest
    # 2026-10-02 S3.9: 15 -> 60 minutes (tried 30 first, still not enough; see measurements).
    #
    # **Measured phase timings** (run 37030254673, this commit, the timeout=30 attempt):
    #   - #10 apt (ffmpeg/libreoffice/fonts-noto-cjk)      1352.8s  <- far above estimate
    #   - #12 pip install -r requirements.txt               154.4s  (measure B in effect)
    #   - #14 exporting to image + pushing layers/manifest   272.1s  (4.24 GB compressed)
    #   - ~42s setup overhead, then #16 cache export remains
    #   At 30.5 min it was STILL RUNNING -- #16 "exporting to GitHub Actions Cache"
    #   was killed mid-write by the 30min timeout. So 30 is measurably insufficient.
    #
    # Why 60 and not 35: cold-build cost varies wildly with mirror/CDN conditions --
    #   the same apt step took 407s in run 36342320802 vs 1352.8s here (3.3x spread).
    #   Worst observed (30.5 min, unfinished) x ~2 headroom = 60 minutes.
    #   Cost: a genuinely stuck build now waits up to 30 extra min before being
    #   declared dead; benefit: the cache actually gets written back, so every later
    #   run is a warm build (measured: fully-cached warm build ~2 min).
    #
    # NOTE: raising the timeout alone is only part of the fix. Real root cause is a
    #   deadlock: GHA buildkit cache TTL is 7 days -> cold build cannot finish ->
    #   timeout kills it -> cache-to never completes -> cache never written back ->
    #   every trigger is a cold build again. (Measured: last success 2026-09-20
    #   18:20 -> first cancelled 2026-09-27 18:53, gap 7.02 days; before this fix
    #   gh api repos/:owner/:repo/actions/caches had ZERO buildkit entries.)
    #   The targeted remedy is in the Dockerfile: drop --no-cache-dir and use
    #   --mount=type=cache so the pip cache outlives the layer cache. After the fix
    #   the first run did produce buildkit cache entries (0 -> 3), proving the path
    #   works; widening the timeout lets that export finish and close the loop.
    #
    # Measure A (explicit cache scope on cache-from/cache-to) is deliberately NOT done
    #   -- this is intentional, not an oversight. A scope name could collide with the
    #   implicit buildkit cache shared by qa-bench-smoke.yml /
    #   playwright.yml (they build this same Dockerfile; qa-bench-ci.yml D5 门禁已于
    #   2026-10-07 退役); mutual eviction would be
    #   hard to predict. mode=max already keeps all intermediate layers, and the
    #   Dockerfile cache mount covers the real bottleneck, so scope is risk > benefit.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
