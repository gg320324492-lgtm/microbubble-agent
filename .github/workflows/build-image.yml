name: "Build app-test image (W67 step 48 路线 2: pre-built)"

# W67 第 48 步 (2026-07-23): GHCR pre-built image 跳过 CI build
# - 每次 push to main (或 Dockerfile 改) 自动 build image 推到 ghcr.io
# - qa-bench-ci.yml 用 `docker pull` 直接拉 pre-built image (1-2 min 跨 run cache hit)
# - 替代每 CI run 重 build app-test image (6-12 分钟 cold cache)
#
# Image 名称约定: ghcr.io/<OWNER>/microbubble-agent:app-test-latest
# qa-bench-ci.yml Step 6 用 `docker pull` + `docker tag ... app-test:ci` 复用现有 step 7 启动逻辑.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/init_test_db_all.py"
      - "alembic/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build-image.yml"
  # 允许手动 trigger (调试 cache miss / 强制重建)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push app-test image to GHCR
    runs-on: ubuntu-latest
    # 2026-10-02 S3.9: 15 → 30 分钟。依据是 run 36342320802 / 36750392880 的实测分段耗时,
    # 不是拍脑袋:
    #   - 冷构建 apt 步 (ffmpeg/libreoffice/fonts-noto-cjk) 846s / 262.4 MB / 实测 263 kB/s
    #   - pip install -r requirements.txt (torch/torchaudio/funasr/modelscope) 实测 180s
    #   - #14 exporting to image: app-test 镜像实测 4.24 GB 压缩 / 单层 3651 MB,
    #     推 GHCR 单步实测 >240s 仍未完成即被 15min 超时杀掉
    #   合计 ~21-22 分钟上界, 30 分钟给出约 1.4x 余量应对 runner 抖动/镜像层压缩波动。
    #
    # ⚠️ 调大 timeout 只是**三选一措施之一**, 单靠它治标: 真正的根因是
    #   "GHA buildkit cache TTL 7 天过期 → 冷构建跑不完 → 15min 超时先杀 →
    #    cache-to 从未执行 → 缓存永远写不回去 → 每次触发都是冷构建"的**永久死锁**
    #   (实测: 最后一次 success 2026-09-20 18:20 → 首次 cancelled 2026-09-27 18:53,
    #    间隔 7.02 天; gh api repos/:owner/:repo/actions/caches 当前 buildkit 条目数 = 0)。
    #   对症下药在 Dockerfile: pip 层去掉 --no-cache-dir 改 --mount=type=cache,
    #   让 pip 缓存独立于 layer cache 存活, 冷构建可复用。
    #
    # 未做的措施 A (显式 cache scope, 即 cache-to/cache-from 加 scope=):
    #   有意**不做**, 不是漏了。若加 scope, 一旦该 scope 名与本仓库其它 workflow
    #   (qa-bench-ci.yml / qa-bench-smoke.yml / playwright.yml 同样 build 本 Dockerfile)
    #   隐式共享的 buildkit cache 命名冲突, 缓存互相驱逐的后果难以预测。
    #   当前 mode=max 已保留全部中间层, 加上 Dockerfile 的 cache mount 已能覆盖
    #   "缓存过期后重建太贵" 这个真瓶颈, 再动 scope 属于风险大于收益。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
