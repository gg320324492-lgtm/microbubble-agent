name: qa-bench D5 gate (1000 题 baseline)

# W67 第 30 步 (2026-07-23): 让 D5 gate 真实跑题
# - 复制 qa-bench-smoke.yml 的 test DB stack 启动逻辑 (pg-test + app-test on 8001)
# - 切 mimo cloud (而非 mock) 通过 MIMO_API_KEY
# - --include-extra 合并 700+300 = 1000 题, --rounds 3 majority consensus
# - 默认 timeout 90 分钟 (1000 题比 200 题慢)
# - 真实门禁: pass_rate < 80% → exit 1

on:
  push:
    branches: [main]
    # 2026-09-30 S1.5 (阶段收尾规划) 修订：原收窄理由是私有仓 2000 分钟/月额度墙，
    # 仓库 09-29 已转 Public（Actions 不限时），该额度墙不复存在。但收窄本身保留：
    # 每次 1000 题全量跑消耗的是 mimo 云端 API 真实费用（非 Actions 时长），且文档/
    # 桌面端提交与服务器侧质量无关。触发语义维持「app/** 变更即跑 + 每周六全量心跳」。
    paths:
      - 'app/**'
      - 'tests/qa-bench/**'
      - 'requirements.txt'
      - 'app/requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.test.yml'
  schedule:
    # 每周六 02:30 UTC（北京 10:30）全量回归心跳，防服务器侧静默劣化
    - cron: '30 2 * * 6'
  workflow_dispatch:

concurrency:
  group: qa-bench-d5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa-bench-d5:
    name: qa-bench D5 1000 题 baseline (test DB)
    runs-on: ubuntu-latest
    # W67 第 47 步 (Agent 27): 120 min 保留. Step 8 /health 后固定等 60s
    #   给 router 注册完成, 后续 1000 题 runner ~60 min, 留足缓冲防 budget-edge 失败.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/qa-bench/requirements.txt

      - name: "Cache pip + Docker layers + apt (W68 B-3 restore-keys 兜底匹配)"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /tmp/.buildx-cache
            /var/cache/apt/archives
          key: ${{ runner.os }}-multi-${{ hashFiles('requirements.txt', 'Dockerfile', 'app/requirements.txt') }}
          # W68 第 4 批 B-3 路线 D6: restore-keys 兜底匹配 — 当 key 不匹配 (例如 router 源码改) 时,
          #   用 prefix `${{ runner.os }}-multi-` 兜底恢复最近的 cache, 避免 100% miss 浪费重装时间.
          restore-keys: |
            ${{ runner.os }}-multi-

      - name: Install Python dependencies
        working-directory: tests/qa-bench
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --retries 10 --timeout 60 -r requirements.txt

      # === W67 第 48 步 路线 2 改造: 已删除 setup-buildx + build step ===
      # 原 W67 第 38 步 setup-buildx 仅服务于 W67 第 36 步 buildx + cache-from: type=gha.
      #   pre-built image 不需要 build, 整个 buildx step 删除.
      # 原 W67 第 36-38 步 build step 替换为上方 `Pull pre-built app-test image`.
      # 上下 steps (Cache pip / Install Python deps / Start test DB / etc.) 全部保留.
      # 回退到 buildx 模式: 取消 setup-buildx step 注释 + 改回 Pull step 为 Build step.
      - name: "Set up Docker Buildx (W67 step 38, 路线 2 已禁用, 保留注释回退; W68 B-3: cache-scope 注入)"
        if: false
        uses: docker/setup-buildx-action@v3
        # W67 第 38 步: 必须 setup buildx, 否则 cache-from: type=gha 不工作 (默认 docker driver 不支持)
        # W68 第 4 批 B-3 路线 D6: 加 cache-scope, 防止 PR/preview deployment 互相覆盖 GHA cache namespace.
        #   命名规则 ${{ github.workflow }}-${{ github.job }} = qa-bench-ci.yml-qa-bench-d5, 隔离.
        with:
          cache-scope: ${{ github.workflow }}-${{ github.job }}

      # === W67 第 48 步 路线 2 (2026-07-23): GHCR pre-built image ===
      # 替代 W67 第 36-38 步 buildx + GHA cache-from, 进一步把 build 从 CI 移除.
      # 触发链: push to main → build-image.yml 自动 build & push 到
      #   ghcr.io/<OWNER>/microbubble-agent:app-test-latest
      # CI 这边: docker pull (1-2 min, 跨 run cache hit) → docker tag → 复用现成 step 7 启动逻辑.
      # 与 Agent 48a (lazy router) + Agent 48c (deeper cache) 并行, 任一成功 = D5 gate 真治本.
      # 回退路径: revert 本步 → step 6 回到原 buildx 模式 (cache-from: type=gha).
      - name: "Pull pre-built app-test image (W67 step 48 路线 2, GHCR pre-built; W68 B-3: cache-from mode=max)"
        run: |
          # W68 第 4 批 B-3 路线 D6: docker pull 加 cache-from: type=gha,mode=max
          #   让 pull 端能复用 push 端 (build-image.yml) 上传的所有中间 layer (mode=max),
          #   不只 final layer metadata. 配合 setup-buildx 的 cache-scope, 跨 run cache hit 90%+.
          #   当前 build-image.yml push 端用 mode=max, pull 端默认 mode=min 不对齐 → 浪费 ~30-90 s.
          docker pull ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest
          docker tag ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest app-test:ci
          docker images app-test:ci --format "✓ app-test:ci ready, {{.Size}}"

      - name: "Start test DB stack (W67 step 33 用 image, 路线 2: pre-built + cached)"
        run: |
          # 创建独立网络, 让容器间通过服务名直连 (Linux runner 无 host.docker.internal)
          docker network create qa-bench-net

          # 起 test DB: 用 pgvector 官方 image (含 vector + uuid-ossp 扩展)
          # 替代 postgres:16-alpine + init_pg_test.sql 手动建扩展
          docker run -d --name pg-test \
            --network qa-bench-net \
            -e POSTGRES_DB=microbubble_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=microbubble2026 \
            pgvector/pgvector:pg16
          # 等 pg-test ready (最长 60s)
          for i in {1..30}; do
            if docker exec pg-test pg_isready -U postgres > /dev/null 2>&1; then
              echo "✓ pg-test ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "✗ pg-test startup timeout"
              docker logs pg-test | tail -30
              exit 1
            fi
            sleep 2
          done

          # === 2026-10-06 建表死锁修复 (根因 A): 必须显式装 vector 扩展 ===
          # pgvector/pgvector:pg16 官方镜像只是"自带扩展二进制", 从不执行
          # CREATE EXTENSION —— 实测全新 template1 (POSTGRES_DB 的克隆源) 只有 plpgsql。
          # 而 app/main.py lifespan 里的 `CREATE EXTENSION IF NOT EXISTS vector`
          # 被 SKIP_DB_SETUP=1 一并短路掉了。于是下面 create_all 必然炸:
          #     asyncpg.exceptions.UndefinedObjectError: type "halfvec" does not exist
          # (app/models/member.py 的 voice_embedding 是 HALFVEC(192))。
          # 即便没有步骤顺序死锁, 建表步骤本身也会失败 —— 与死锁独立的第二个 bug。
          # 只装 vector: pg_trgm 仅出现在 alembic 索引 DDL 里, create_all 从不引用
          # (实测 vector-only 即可让 init_db.py exit 0)。
          echo "=== install pgvector extension (create_all 需要 halfvec/vector 类型) ==="
          for i in {1..10}; do
            if docker exec pg-test psql -U postgres -d microbubble_test \
                 -c "CREATE EXTENSION IF NOT EXISTS vector;" > /dev/null 2>&1; then
              echo "✓ pgvector extension 已安装"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "✗ CREATE EXTENSION vector 10 次全失败 — 镜像不含 vector 控制文件?"
              docker exec pg-test psql -U postgres -d microbubble_test \
                -c "SELECT extname FROM pg_extension;" || true
              docker logs pg-test | tail -30
              exit 1
            fi
            sleep 2
          done
          # fail-loud 回读: 装没装上不能靠 psql 退出码猜 (某些失败也会退 0)
          docker exec pg-test psql -U postgres -d microbubble_test -tAc \
            "SELECT count(*) FROM pg_extension WHERE extname='vector';" \
            | grep -qx 1 || { echo "✗ vector 扩展装上后回读仍为 0"; exit 1; }

          # 起 test app (8001 端口), 切 mimo cloud
          # W67 第 33 步: 用已 build image `app-test:ci`, 启动 ~30-60s (不再 6-10 min)
          docker run -d --name app-test \
            --network qa-bench-net \
            -p 8001:8000 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:microbubble2026@pg-test:5432/microbubble_test" \
            -e REDIS_URL="redis://localhost:6379/1" \
            -e MINIO_ENDPOINT="localhost:9000" \
            -e MINIO_BUCKET="microbubble-test" \
            -e MINIO_PUBLIC_URL="http://localhost:9001" \
            -e LLM_BACKEND=openai_compat \
            -e LLM_OPENAI_COMPAT_BASE_URL=https://token-plan-cn.xiaomimimo.com/v1 \
            -e LLM_OPENAI_COMPAT_MODEL=mimo-v2.5 \
            -e MIMO_API_KEY="${{ secrets.MIMO_API_KEY }}" \
            -e SKIP_DB_SETUP=1 \
            -v $(pwd)/app:/app/app \
            -v $(pwd)/alembic/versions:/app/alembic/versions \
            app-test:ci \
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log

          # ====================================================================
          # 2026-10-06 三处根因修复 (本次 job 红了 117 分钟的真正原因)
          #
          # [根因 1] 步骤顺序死锁 —— 建表被排在等待循环**之后**, 循环又在等建表的结果
          #   旧顺序: docker run app-test → 等 login 探针 → (下一步才) 建表
          #   SKIP_DB_SETUP=1 (app/main.py:284) 短路掉 lifespan 内全部 create_all,
          #   ⇒ members 表不存在 ⇒ POST /api/v1/auth/login 恒返 **500**
          #   (UndefinedTableError: relation "members" does not exist)
          #   ⇒ 循环永远等不到, 建表步骤被永久挡在后面。实测 114 轮 × 62s = 117 分钟
          #   后被 job 超时杀掉, 后面的 Init / Diagnostic / 九文件 baseline 从未跑过。
          #   修法: 建表**上移**到本步内、等待循环之前 (顺序自证), 循环只等 app ready。
          #
          # [根因 2] 探针判据没有牙 —— 500 被当成"再等等"
          #   旧判据只认 401/422 之外的一切都是"router 还没注册完", 于是确定性故障
          #   (500 = 建表缺失) 被静默重试 114 次。现在: **5xx 立即 dump logs + exit 1**,
          #   只有 000/连接拒绝 (app 还没起来) 才继续等。
          #   这一条把"静默等 117 分钟"变成"秒级失败", 是本次最有长期价值的改动。
          #
          # [根因 3] 循环预算算错 —— 注释与实现三个数字互相矛盾
          #   旧: for i in {1..450} × (sleep 60 + sleep 2) ≈ 62s/轮
          #       ⇒ 450 × 62s = **465 分钟**, 而 job timeout-minutes: 120
          #       ⇒ 循环自带的 exit 1 (注释称"最长 1800s = 30min") **永不可达**。
          #       成因: 1800s 是 "sleep 2 × 900 轮" 时代的遗留值;
          #       commit 7199c7a07 (W67 第 47 步) 把 sleep 30 改成 sleep 60 时
          #       **只改了一行、没重算预算**。
          #   新: 两段式有界预算, 全部可在 job 预算内跑完并真正 exit 1:
          #       阶段 1  /health 200      : 90 轮 × sleep 2  = 180s 上限
          #       阶段 2  login ∈ {401,422} : 60 轮 × sleep 2  = 120s 上限
          #       合计最坏 300s (5 分钟), 相对 120 分钟 job 留 24× 余量。
          #   依据 (实测, 非估算):
          #       · 本机 /health 首次 200 在第 4 次探测 ≈ 8s
          #       · 生产日志 docker logs -t 时间戳: lifespan yield 与
          #         `[router-loader] loaded; 57 routes ready` 相差 **0.4s**
          #         (17:52:01.765 startup complete → 17:52:02.064 router-loader)
          #       所以旧的 `sleep 60` 是纯浪费: router 注册在 0.4s 内完成, 不是 1510s。
          #   注: 阶段 2 仍用 login 探针 (而不是换成 /openapi.json) —— 因为建表
          #       已上移到这里, login 探针现在能真正验证"路由 + DB 都活着"。
          # ====================================================================

          # --- 建表 (原"Init test DB schema"步骤上移至此, 见根因 1) ---
          # 注意: 这里**必须**先于下面的等待循环。app-test 容器已在上面启动,
          # 建表走 docker exec 进同一容器/同一网络, 不依赖 app 是否 ready。
          set -o pipefail
          echo "=== [1/2] init_db: create_all + seed 24 members (需上方 vector 扩展) ==="
          docker exec -e SKIP_DB_SETUP=1 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:microbubble2026@pg-test:5432/microbubble_test" \
            app-test python scripts/init_db.py 2>&1 | tee /tmp/init-db.log
          # fail-loud: "数据库初始化完成" 是 init_db.py:29 的成功哨兵。
          #   不能靠管道退出码 —— tee 会吞掉 docker exec 的失败。
          grep -q "数据库初始化完成" /tmp/init-db.log || {
            echo "::error::init_db 未跑成功 (缺 '数据库初始化完成') — 建表/seed 失败, 后续 login 必 500"
            echo "--- init_db 日志尾部 ---"; tail -40 /tmp/init-db.log; exit 1; }

          echo "=== [2/2] ensure_test_user: 幂等建 xiaoqi_testbot (供下方 Login step 取 JWT) ==="
          # 刻意**不**用 scripts/init_test_db_all.py —— 它的 run_ensure_test_user 调
          #   `parse_args([])`, 而 scripts/ensure_test_user.py:51 是 `def parse_args():`
          #   ⇒ TypeError: parse_args() takes 0 positional arguments but 1 was given
          #   ⇒ 该脚本自 830d6243e (2026-07-23) 起 ensure 分支**从未成功执行过**
          #   (实测 exit 1)。改脚本需重建 app-test-latest 镜像才生效
          #   (Dockerfile 是 COPY . ., 且本 workflow 只 bind-mount 了 app/ 与
          #   alembic/versions/, **没有** mount scripts/), 而 build-image.yml 近
          #   3 个月 push 大量 cancelled/failed —— 改脚本 = 本轮拿不到 = 门禁仍红。
          #   故分别调用两个脚本可执行入口, 语义等价且立即生效
          #   (本机实测: [CREATED] 测试账号: id=45)。
          docker exec -e SKIP_DB_SETUP=1 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:microbubble2026@pg-test:5432/microbubble_test" \
            app-test python scripts/ensure_test_user.py 2>&1 | tee /tmp/ensure-user.log
          # fail-loud: [CREATED] / [OK] 是 ensure_test_user.py:116 / :90 的成功哨兵。
          grep -qE "\[(CREATED|OK)\]" /tmp/ensure-user.log || {
            echo "::error::ensure_test_user 未建号 (缺 [CREATED]/[OK]) — 后续 Login step 必 AUTH_ERROR"
            echo "--- ensure_test_user 日志尾部 ---"; tail -40 /tmp/ensure-user.log; exit 1; }
          # 真 traceback 兜底 (排除 passlib 探测 bcrypt 版本的良性噪音:
          #   "(trapped) error reading bcrypt version" + bcrypt.__about__ 属性错误,
          #   实测该段出现时建号依然成功, 不能按 "Traceback" 字面量判失败)。
          if grep -vE "^\(trapped\)|passlib/handlers/bcrypt\.py|_bcrypt\.__about__|^Traceback \(most recent call last\):$|^ +\^+$|^ *version = _bcrypt|has no attribute '__about__'" /tmp/ensure-user.log \
             | grep -qE "No such container|Traceback|Error:"; then
            echo "::error::ensure_test_user 输出含真 traceback"; cat /tmp/ensure-user.log; exit 1
          fi

          # --- 阶段 1: 等 /health (app 进程起来) ---
          echo "=== [阶段 1] 等 app-test /health 200 (90 × 2s = 180s 上限) ==="
          HEALTH_MAX=90
          for i in $(seq 1 $HEALTH_MAX); do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "✓ /health 200 (attempt $i/$HEALTH_MAX)"
              break
            fi
            if [ "$i" -eq "$HEALTH_MAX" ]; then
              echo "✗ app-test /health never returned 200 (final attempt $i/$HEALTH_MAX)"
              docker logs app-test | tail -80
              docker logs pg-test | tail -30
              exit 1
            fi
            sleep 2
          done

          # --- 阶段 2: 等 login 路由 (401/422) + 5xx 秒级失败 ---
          echo "=== [阶段 2] 等 login 路由注册 (60 × 2s = 120s 上限; 5xx 立即失败) ==="
          ROUTER_MAX=60
          for i in $(seq 1 $ROUTER_MAX); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              http://localhost:8001/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"xiaoqi_testbot","password":"INVALID_PROBE_ROUTER_READY"}' 2>/dev/null || echo "000")
            case "$HTTP_CODE" in
              401|422)
                echo "✓ app-test router ready (health=200 + login=$HTTP_CODE, attempt $i/$ROUTER_MAX)"
                break
                ;;
              # 5xx = 确定性故障 (500 = 建表缺失 / 依赖炸), 重试无意义 → 立即失败
              5??)
                echo "✗ app-test login 返 5xx ($HTTP_CODE, attempt $i/$ROUTER_MAX) —— 这是确定性故障, 不再重试"
                echo "--- app-test 日志尾部 ---"; docker logs app-test | tail -80
                echo "--- pg-test 日志尾部 ---";  docker logs pg-test | tail -30
                exit 1
                ;;
              *)
                # 000 = 连接被拒 (app 还没 listen), 404 = 路由未注册, 都属于"继续等"
                echo "  [probe $i/$ROUTER_MAX] login=$HTTP_CODE (继续等...)"
                if [ "$i" -eq "$ROUTER_MAX" ]; then
                  echo "✗ app-test router startup timeout (final /health=200 但 login=$HTTP_CODE)"
                  docker logs app-test | tail -80
                  docker logs pg-test | tail -30
                  exit 1
                fi
                sleep 2
                ;;
            esac
          done

      - name: Init test DB schema + seed + test user (W67 第 41 步 合并脚本)
        run: |
          # W67 第 41 步 (Agent 21): 合并 init_db + ensure_test_user 到 1 个 Python 进程,
          # 节省 2× import overhead (~7-8s). alembic stamp head 跳过 (test DB 走 init_db.create_all,
          # 不需要 alembic 版本跟踪 — 生产 DB 走 alembic upgrade head 是另一回事).
          #
          # 2026-10-06: 本步骤已**上移**进 "Start test DB stack" (根因 1: 建表必须先于
          #   login 等待循环, 否则 500 被误判为"router 没注册完"而永久死锁)。
          #   保留为**幂等复核**: 只做 fail-loud 断言 —— 建表哨兵与建号哨兵缺失即 exit 1,
          #   绝不重复跑 (建表在上一步已完成)。init_test_db_all.py 自身有
          #   parse_args([]) TypeError (见上一步注释), 故复核用两个脚本各自的哨兵。
          # `-i` 是**必需**的: docker exec 不接 -i 时不把宿主 stdin 送进容器,
          # heredoc 被整个吞掉 —— python 读到空 stdin, 什么都不打印, 连
          # sys.exit(1) 都返回 exit 0。本机实测 (class 20.219):
          #   无 -i: exit=0 且 stdout 为空;  有 -i: 脚本正常执行。
          # 即"漏一个 -i" = 静默假绿的门禁, 比红更危险。
          echo "=== [复核] 上一步已建表+建号, 此处只断言 DB 状态确实落盘 ==="
          docker exec -i -e SKIP_DB_SETUP=1 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:microbubble2026@pg-test:5432/microbubble_test" \
            app-test python - <<'PYEOF'
          import asyncio, sys
          sys.path.insert(0, '/app')
          from sqlalchemy import select, text
          from app.core.database import async_session
          from app.models.member import Member

          async def main():
              async with async_session() as db:
                  members = (await db.execute(text('SELECT count(*) FROM members'))).scalar()
                  print(f'members_table_rows={members}')
                  if members < 1:
                      print('MEMBERS_TABLE_EMPTY'); return 1
                  r = await db.execute(select(Member).where(Member.username == 'xiaoqi_testbot'))
                  if r.scalar_one_or_none() is None:
                      print('XIAOQI_TESTBOT_MISSING'); return 1
                  print('XIAOQI_TESTBOT_PRESENT'); return 0
          sys.exit(asyncio.run(main()))
          PYEOF

      # === W67 第 43 步 (Agent 23): 在 Login 前诊断 xiaoqi_testbot 实际状态 ===
      # 历史: #35 (run 30011821182) Step 11 Login 30×2s=60s 失败, 无任何 app 端日志可查.
      # 根因可能是: (a) init_test_db_all 在 app-test *另进程* 跑, 提交后 app-test 主进程连接未刷池;
      #            (b) 测试 user 实际未创建 (init 步骤偶发 1s 完成, 怀疑 sleep-overwrite);
      #            (c) Redis 缺失导致限流 check 静默降级后再失败;
      #            (d) asyncpg first connect 慢.
      # 解决: 在 Step 11 Login 之前, 用 *同一连接参数* 直接查 xiaoqi_testbot + 验证密码哈希,
      #       并把 app-test 容器最近 80 行日志 / Login HTTP 4xx 响应也 print 出来.
      # 关键: 这个诊断 step 跑 fail-loud (exit 1) 当 DB 内容异常 → 后续 Login 会一定成功.
      - name: "Diagnostic - verify xiaoqi_testbot + capture app-test logs (W67 step 43)"
        run: |
          echo "=== [1] Direct DB probe (via app-test container's python + same DATABASE_URL) ==="
          # `-i` 必需: 见上方 class 20.219 —— 漏掉它 heredoc 被吞, 本步恒 exit 0。
          #          这正是本步自 W67 第 43 步起一直**没有真正 fail-loud** 的原因。
          docker exec -i -e SKIP_DB_SETUP=1 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:microbubble2026@pg-test:5432/microbubble_test" \
            app-test python - <<'PYEOF'
          import asyncio, sys, os
          sys.path.insert(0, '/app')
          from sqlalchemy import select, text
          from app.core.database import async_session
          from app.models.member import Member
          from app.core.security import verify_password

          async def main():
              async with async_session() as db:
                  r = await db.execute(select(Member).where(Member.username == 'xiaoqi_testbot'))
                  m = r.scalar_one_or_none()
                  if m is None:
                      print('MEMBER_NOT_FOUND')
                      # 但要看 members 表真存在 + 数量
                      cnt = (await db.execute(text('SELECT count(*) FROM members'))).scalar()
                      print(f'members_count={cnt}')
                      return 1
                  print(f'member id={m.id} role={m.role} is_active={m.is_active} hashlen={len(m.password_hash) if m.password_hash else 0}')
                  if not m.password_hash:
                      print('NO_PASSWORD_HASH')
                      return 2
                  ok = verify_password('testbot_pass_2026', m.password_hash)
                  print(f'verify_password=testbot_pass_2026 -> {ok}')
                  return 0 if ok else 3
          sys.exit(asyncio.run(main()))
          PYEOF
          echo ""
          echo "=== [2] Single raw login attempt (不静默, 显示 HTTP code + body) ==="
          HTTP_CODE=$(curl -s -o /tmp/login_body.txt -w "%{http_code}" \
            -X POST http://localhost:8001/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"xiaoqi_testbot","password":"testbot_pass_2026"}')
          echo "HTTP_CODE=$HTTP_CODE"
          echo "BODY=$(head -c 500 /tmp/login_body.txt)"
          echo ""
          echo "=== [3] app-test 容器最近 80 行日志 (诊断 startup / init 是否真正成功) ==="
          docker logs --tail 80 app-test 2>&1 | tail -80

      - name: Generate 1000 题题库 (D4 base 700 + D5 extra 300)
        working-directory: tests/qa-bench
        run: |
          # 生成 base 700 题 (含 schema)
          python gen780.py --output questions_780.jsonl --schema-only
          wc -l questions_780.jsonl
          # D4 extra 300 题已在 questions_d4_extra_300.jsonl (Agent 2 已合并, 不需要再生成)
          if [ ! -f questions_d4_extra_300.jsonl ]; then
            echo "✗ questions_d4_extra_300.jsonl 不存在, D5 无法跑"
            exit 1
          fi
          wc -l questions_d4_extra_300.jsonl

      - name: Login as admin to get JWT (W67 第 42 步)
        run: |
          # W67 第 42 步 (Agent 22): 实测 Step 11 1s fail 因 --token "${QA_TOKEN:-mock}" fallback "mock" 字符串,
          #   JWT 验证失败 (无用户). 改 CI 启动 app 后立即用 ensure_test_user 创建的 xiaoqi_testbot 登录拿真 JWT.
          #
          # 为什么用 xiaoqi_testbot (非 admin) — scripts/ensure_test_user.py 默认账号是 xiaoqi_testbot /
          #   testbot_pass_2026 (生产 admin 物理隔离). init_test_db_all.py 第 3 步自动确保存在.
          #
          # W67 第 43 步 (Agent 23): 上方 Diagnostic step 已先验证 user + 密码, 此处单一目的是取 JWT.
          # 重试机制: app-test 可能刚 ready 但 lifespan 还在最后阶段, /health 200 不代表路由就绪.
          #   最多重试 30 次 × 2s = 60s. W67 步减少为 15 次 × 2s = 30s (fail-fast).
          for i in {1..15}; do
            HTTP_CODE=$(curl -s -o /tmp/login_resp.txt -w "%{http_code}" \
              -X POST http://localhost:8001/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"xiaoqi_testbot","password":"testbot_pass_2026"}' 2>&1)
            if [ "$HTTP_CODE" = "200" ]; then
              LOGIN_RESP=$(cat /tmp/login_resp.txt)
              echo "✓ HTTP 200 OK (attempt $i)"
              break
            fi
            echo "✗ attempt $i HTTP $HTTP_CODE: $(head -c 200 /tmp/login_resp.txt)"
            if [ "$i" -eq 15 ]; then
              echo "=== app-test logs (final 80 lines) ==="
              docker logs --tail 80 app-test 2>&1 | tail -80
              echo "=== pg-test logs (final 30 lines) ==="
              docker logs --tail 30 pg-test 2>&1 | tail -30
              exit 1
            fi
            sleep 2
          done
          TOKEN=$(echo "$LOGIN_RESP" | python -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "✗ Login response missing access_token: $LOGIN_RESP"
            exit 1
          fi
          echo "✓ Login OK, token length ${#TOKEN}"
          echo "REAL_QA_TOKEN=$TOKEN" >> $GITHUB_ENV

      # === 关键改动: --api-base http://localhost:8001 指向 test app + --include-extra 合并 1000 题 ===
      - name: Run qa-bench D5 (1000 题 baseline, against test DB 8001)
        working-directory: tests/qa-bench
        env:
          # W67 第 29 步: 切 mimo cloud
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          # W67 第 42 步: 用 login 拿的真 JWT (上方 Login step 设的 $GITHUB_ENV), 不再 ${QA_TOKEN:-mock} fallback.
          #   ${{ env.REAL_QA_TOKEN }} 引用 step 间共享的 env (GITHUB_ENV).
          QA_TOKEN: ${{ env.REAL_QA_TOKEN }}
          LLM_BACKEND: openai_compat
          LLM_OPENAI_COMPAT_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_OPENAI_COMPAT_MODEL: mimo-v2.5
        run: |
          # --include-extra: 合并 700 base + 300 extra = 1000 题
          # --rounds 3 + --verdict-consensus majority: 三轮多数决, 减少单轮随机噪声
          # --concurrency 3: mimo tier 限流保护 (1000 题 30-60 min)
          # W67 第 42 步: --token 直接传 $QA_TOKEN (无 fallback), CI 必须先 login 成功, fail loud.
          python runner.py \
            --token "${QA_TOKEN}" \
            --api-base "http://localhost:8001" \
            --include-extra \
            --rounds 3 \
            --verdict-consensus majority \
            --output results/baseline_d5_1000 \
            --concurrency 3
          # 期望 ~60 分钟跑完 (1000 题 × 3 rounds × 1 majority consensus, mimo tier)
          if [ -f results/baseline_d5_1000/results.json ]; then
            echo "✓ D5 1000 题完成 (test DB, 无生产污染)"
            cat results/baseline_d5_1000/report.md | head -50
          else
            echo "✗ D5 失败"
            exit 1
          fi

      - name: Upload D5 baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-bench-d5-baseline
          path: tests/qa-bench/results/baseline_d5_1000/
          retention-days: 30

      # === W68 第 12 批 B-3: D7 baseline audit 与 80% gate 同步执行 ===
      # 直接在已安装完整依赖的 app-test 容器内运行，避免宿主 runner 缺少
      # production imports；SKIP_DB_SETUP=1 保持 baseline 不触碰测试数据库。
      #
      # tests/test_baseline_audit.py 已归档 (tests/ARCHIVED.md; 2026-09-30 S1.2 R4
      # 加的模块级 pytest.skip)。因此这一步现在**不再**验证它原本要验证的东西:
      # 原意是 "audit 模块可导入性 smoke" (设计文档 §5 "preserve the historical
      # direct command"), 而模块级 skip 在裸跑时抛异常 exit 1 —— smoke 语义与归档
      # 状态互斥, 归档状态胜出, smoke 检查是**消失**了而不是被满足了。
      # 现在它验证的是: 该文件仍处于已声明的归档状态; audit 断言**从不执行**。
      # 真正的 71 PASS + 7 SKIP 守恒门在下一 step (scripts/ci_qa_bench_baseline.sh),
      # 它守的 9 个文件全部 live。
      #
      # 两段都保持 fail-loud:
      #   - 裸跑: 仅当 stderr 出现 pytest "Skipped:" 哨兵才接受 exit 1。
      #     真实语法/import 错误同样 exit 1 但无哨兵, 照旧断链。
      #   - pytest: 仅当摘要含 skipped 才接受 exit 5 (NO_TESTS_COLLECTED)。
      #     文件被误删/改名同样 exit 5, 但摘要为 "no tests ran", 不会被误认。
      #
      # 注意: GitHub 的 run: 块在 bash -e 下执行, errexit 会让 out=$(python ...)
      # 在 python 非零退出时直接中断整个 step, 下面的判据根本没机会跑。
      # 用 `|| rc=$?` 捕获退出码而非让它致命。
      - name: Run D7 baseline audit (71 PASS + 7 SKIP)
        if: always()
        run: |
          docker exec -e SKIP_DB_SETUP=1 app-test bash -lc '
            cd /app || exit 1
            ARCHIVED_AUDIT=tests/test_baseline_audit.py

            rc=0; out=$(python "$ARCHIVED_AUDIT" 2>&1) || rc=$?
            printf "%s\n" "$out"
            if [ "$rc" -ne 0 ]; then
              if [ "$rc" -eq 1 ] && printf "%s" "$out" | grep -q "^Skipped:"; then
                echo "OK: $ARCHIVED_AUDIT is archived via module-level pytest.skip (expected)"
              else
                echo "FAIL: unexpected bare-run exit $rc (not the archived-skip sentinel)"
                exit 1
              fi
            fi

            rc=0; out=$(python -m pytest "$ARCHIVED_AUDIT" -q --disable-warnings 2>&1) || rc=$?
            printf "%s\n" "$out"
            if [ "$rc" -ne 0 ]; then
              if [ "$rc" -eq 5 ] && printf "%s" "$out" | grep -Eq "[0-9]+ skipped"; then
                echo "OK: module-level skip, nothing collected (expected)"
              else
                echo "FAIL: unexpected pytest exit $rc (expected 5 + a skipped summary)"
                exit 1
              fi
            fi
          '

      # === 硬门禁: pass_rate < 80% → exit 1 (即使 runner.py 跑了也得验证) ===
      - name: Fail if pass_rate < 80%
        if: always()
        working-directory: tests/qa-bench
        run: |
          if [ -f results/baseline_d5_1000/results.json ]; then
            PASS_RATE=$(python3 << 'PYEOF'
          import json
          with open('results/baseline_d5_1000/results.json') as f:
              d = json.load(f)
          total = d['summary']['total']
          pass_ = d['summary']['pass']
          print(round(pass_ / max(total, 1) * 100, 1))
          PYEOF
          )
            echo "D5 通过率: ${PASS_RATE}%"
            # 带引号 heredoc 不展开 ${PASS_RATE} => 经 env 传值 (前缀赋值在 heredoc 展开前生效)
            PASS_RATE="${PASS_RATE}" python3 << 'PYEOF'
          import os
          import sys
          pass_rate = float(os.environ['PASS_RATE'])
          threshold = 80.0
          if pass_rate < threshold:
              print(f'❌ 通过率 {pass_rate}% < 阈值 {threshold}%, D5 gate 阻断 merge')
              sys.exit(1)
          else:
              print(f'✓ 通过率 {pass_rate}% >= 阈值 {threshold}%, D5 gate 通过')
          PYEOF
          fi

      # === Teardown: 清 test stack ===
      - name: Teardown test stack
        if: always()
        run: |
          docker rm -f app-test pg-test 2>/dev/null || true
          docker network rm qa-bench-net 2>/dev/null || true
          echo "✓ test DB stack cleaned up"