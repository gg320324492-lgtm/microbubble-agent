name: upload-download-page

# 落地页（download-page.html）单独上传——发布列车之外的小步更新入口。
# 凭据与 desktop-release 的 OSS 镜像步同源（Secrets OSS_UPLOAD_AK/SK）。
# 用法：gh workflow run upload-download-page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  page:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upload landing page to OSS
        # 2026-10-11: --version 原硬编码 1.3.0, 而线上已是 v1.3.2。改为运行时读取
        #   apps/desktop/package.json 的 "version" 字段(本仓版本真源, electron-builder
        #   的 artifactName / release.mjs 也都从它派生), 写法与 desktop-release.yml 的
        #   "Mirror artifacts to OSS feed" 步完全一致(node -p, 不硬编码)。
        #   ⚠️ 改版本只需改 apps/desktop/package.json 一处, 这里自动跟随。
        #
        #   --version 在本工作流里的实际作用: 仅参与 ARTIFACTS 的文件名模板
        #   (MicroBubbleWorkbench-{v}-setup.exe 等) 与 --prefix 缺省时的 OSS key 前缀。
        #   落地页本身走的是固定 key(download-page.html / index.html), **不吃 version**,
        #   所以版本号错了不会损坏页面 —— 只会在 --dir release 下有残留产物时把它们
        #   上传到错误的版本目录。页面里显示的版本号是 download-page.html 内自己硬编码的,
        #   由改页面的人负责, 不在本工作流管辖范围。
        shell: bash
        env:
          OSS_UPLOAD_AK: ${{ secrets.OSS_UPLOAD_AK }}
          OSS_UPLOAD_SK: ${{ secrets.OSS_UPLOAD_SK }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          echo "落地页发布版本(package.json 真源): $VER"
          node scripts/upload-release-oss.mjs --version "$VER" --dir release --page scripts/download-page.html --skip-if-missing
