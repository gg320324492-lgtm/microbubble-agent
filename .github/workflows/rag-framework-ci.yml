name: RAG Framework CI

# [RAG-FW-12 W98 +0] CI workflow 注册 — Hybrid RAG Stack 框架测试
#
# 设计:
#   - tests/rag_framework/ 全部 mock (conftest patch sys.modules), CI 无需装
#     langchain/llama-index/langfuse 框架依赖 → 精装最小依赖集, 避免 torch
#     (~2GB CPU wheel) + funasr/modelscope 等重依赖拖慢每次 PR.
#   - pytest + pytest-asyncio (root pytest.ini asyncio_mode=auto) + app 轻依赖链
#     (pydantic-settings / python-dotenv / httpx / sqlalchemy / alembic 及其依赖)
#     即可把 app/rag 模块 import 起来 (app/rag/*.py 顶层只依赖 app.rag.config
#     + app.rag.gate, 框架 import 全部在函数内 try/except).
#   - SKIP_DB_SETUP=1: tests/conftest.py 条件跳过 DB 初始化与重型 import
#     (app.main / app.core.database / 全模型), rag_framework 测试不需要 DB.
#   - alembic heads 守卫: 期望恰好 1 head = 091_add_kg_entity (串单链纪律,
#     CLAUDE.md 永久锚点). alembic heads 只读脚本目录, 不加载 env.py, 不连 DB.
#
# 注意 (对齐现有 workflow 风格: actions/checkout@v4 + actions/setup-python@v5
#   + permissions: contents: read, 参考 qa-bench-smoke.yml / qa-bench-ci.yml):
#   - 不在此 workflow 内改任何 app/ 文件; 不动 alembic; 不改现有 workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rag-framework-tests:
    name: RAG framework tests (mock mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # 精装最小依赖集 (见 workflow 头注释). 不 --no-deps:
      #   --no-deps 会跳过依赖解析, pytest 的 pluggy/exceptiongroup/iniconfig
      #   等传递依赖丢失 → pytest 收集阶段直接崩; 且 langchain-core 0.3
      #   会被显式装进去 (requirements.txt 声明的 langchain-core 依赖链
      #   通过 deps 正常解析, 无 torch 侧漏).
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          # 2026-10-01 S3.7: 补 jieba + rank-bm25。两者都在 requirements.txt:61-62 声明,
          # 且被 app/services/bm25_service.py:11-12 模块级 import, 但本列表是 L48-52 从
          # `-r requirements.txt` 改写而来时漏掉的 → CI 收集阶段 ModuleNotFoundError,
          # 整个 RAG 门禁长期红。根治方案(改回 -r requirements.txt, 会连带装 torch 拖慢 CI)
          # 留档单独立项, 本轮只做最小改动让门禁真绿。
          # 2026-10-02 S3.7-R3 复检补: 再补 anthropic。同型漏依赖 ——
          #   requirements.txt:23 已声明 anthropic>=0.39.0, 但本手写列表漏了它。
          #   app/core/llm.py 顶层 import anthropic, 而 rag 测试会经
          #   patch.dict 触发 app.services.knowledge_qa_service 的真实 import
          #   → 12 条用例挂在 ModuleNotFoundError: No module named 'anthropic'。
          #   依据: run 37002426969 日志里去重后 ModuleNotFoundError 只有这一个;
          #   容器内(全依赖)同三个文件实测 22 / 14 / 4 passed 全绿。
          #   版本约束与 requirements.txt:23 保持一致, 不擅自收紧。
          #
          # 2026-10-02 复检第二轮(实测 run 37009719090): 补 anthropic 后 12 条 -> 6 条。
          #   剩余 6 条报的是 `AttributeError: module 'app.services' has no attribute
          #   'knowledge_qa_service' / 'hybrid_retriever'` —— **不是** ModuleNotFoundError。
          #   真因仍是缺依赖, 只是原始异常被 mock 的 _importer 吞掉了:
          #   patch.dict 触发 app.services.knowledge_qa_service 真实 import 链 ->
          #   knowledge_qa_service.py:10 -> app.models.knowledge ->
          #   app/models/__init__.py:7 -> knowledge_chunk.py:29 -> `from pgvector.sqlalchemy
          #   import Vector` -> ModuleNotFoundError -> mock 报成 AttributeError。
          #   复检官本机 venv 直接 import 该模块复现了完整链(见 commit message)。
          #   => **只看 CI 日志里的 ModuleNotFoundError 会漏判**。
          #   requirements.txt:57 已声明 pgvector>=0.3.6,<1.0.0, 同样被本手写列表漏掉。
          # 教训留档: 曾误判 pgvector "不是 CI 的缺口"(理由: 日志里没有它的
          #   ModuleNotFoundError)。那个判据是错的 —— 异常被 mock 吞了。
          #   **判"CI 缺哪个包"不能只 grep 日志, 必须能在 CI 装出的环境里逐个 import 断言。**
          pip install --prefer-binary --retries 10 --timeout 60 pytest pytest-asyncio pydantic-settings python-dotenv httpx sqlalchemy alembic pydantic jieba rank-bm25 "anthropic>=0.39.0" "pgvector>=0.3.6,<1.0.0"

      - name: Run RAG framework tests (mock mode)
        env:
          SKIP_DB_SETUP: "1"
        run: |
          python -m pytest tests/rag_framework/ -v

      # alembic heads 只读脚本目录 (不加载 env.py, 不连 DB).
      # 输出格式: "<revision_id> (head)" 每 head 一行; revision_id 即文件名
      # (如 091_add_kg_entity), 期望恰好 1 行.
      - name: Verify alembic chain (1 head expected)
        run: |
          heads=$(python -m alembic heads)
          echo "$heads"
          count=$(echo "$heads" | grep -c '(head)')
          if [ "$count" -ne 1 ]; then
            echo "FAIL: expected exactly 1 alembic head, got $count"
            exit 1
          fi
          echo "$heads" | grep -q '091_add_kg_entity' || { echo "FAIL: head is not 091_add_kg_entity"; exit 1; }
