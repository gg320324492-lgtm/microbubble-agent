name: Alembic Single-Head Guard

# [RAG-FW-12 W98 +0] CI workflow 注册 — Hybrid RAG Stack 框架测试
# [2026-10-11 瘦身] 删掉 pytest 段, 只保留 alembic 单 head 守卫
#
# 为何保留 (本 workflow 唯一不可替代的职责):
#   `alembic heads` 守卫断言"恰为 1 个 head"这个不变量 (串单链纪律,
#   CLAUDE.md 永久锚点 / 类 20.171 / 20.220)。实测全仓**只有本 workflow**
#   断言 head 数 —— 其余 workflow 出现 alembic 字样的三处都不是这个不变量:
#     - build-image.yml:19      'alembic/**' 只是 paths 过滤 (触发条件)
#     - qa-bench-smoke.yml:273  'alembic stamp head' 是运行期补版本号
#     - qa-bench-baseline.yml:84 'alembic==1.13.0' 只是装个包
#   并行 migration agent 都声明同一个 down_revision 会在链上分叉,
#   `alembic upgrade head` 直接报 Multiple head revisions 阻塞部署
#   (2026-07-24 串单链纪律事故)。单 head 才是那个不变量。
#
# 为何删掉 pytest 段 (tests/rag_framework/ 9 个 test_*.py):
#   这 9 个文件位于 tests/ 之下, 已被 server-tests-baseline.yml:108 的
#   `find tests -name "test_*.py" | sort` 收进 8 片 round-robin 分片, 且该
#   workflow 走 `pip install -r requirements.txt` 全依赖 ⇒ 执行层面纯重复。
#   连带甩掉那条"手写精简依赖列表"的长期维护债 —— 它曾漏装 jieba /
#   anthropic / pgvector / greenlet 四个包, 致本门禁长期红 (2026-10-01/02)。
#
# ⚠️ 若将来要把 pytest 段加回来, 先读下面两条教训再动 (它们是那 4 次
#    ModuleNotFoundError 排查换来的, 不是能重走的弯路):
#   1. **判"CI 缺哪个包"不能只 grep 日志** —— tests/conftest.py 的 mock
#      `_importer` 会把 ModuleNotFoundError 吞成 AttributeError (形如
#      `module 'app.services' has no attribute 'hybrid_retriever'`)。
#      当时据此误判过"pgvector 不是缺口"。必须在 CI 装出的环境里逐个 import 断言。
#   2. **"容器绿 / CI 红"的分叉点在 SQLAlchemy 版本**: requirements.txt:8 pin
#      `SQLAlchemy==2.0.23` (greenlet 是核心依赖, 装 sqlalchemy 即自动带入);
#      而任何**未 pin** 的裸装 sqlalchemy 会解析到 2.1.x —— greenlet 降级到
#      `extra == "asyncio"`, 裸装不带 ⇒ sqlalchemy.ext.asyncio 在 import 期就
#      抛错。requirements.txt 全文未出现 greenlet (它是传递依赖, 谁都不必显式
#      声明), 所以任何手写依赖列表都会命中这个坑。根治手段是改回
#      `-r requirements.txt` (代价 = 连带装 torch ~2GB CPU wheel, 拖慢每次 CI)。
#
# 守卫实现要点 (原样保留, 未改动):
#   - **不写死 head 编号** —— 编号是随迁移推进漂移的快照, 硬编码它等于让守卫
#     每加一个迁移就红一次, 却不防任何真问题 (类 20.220: 自动化断言禁止写死
#     会变的编号, 改校验不变量)。
#   - alembic heads 只读脚本目录, 不加载 env.py, 不连 DB。
#   - 当前 head 编号以实测为准 (2026-10-02 容器实测 = 141_zb2_backup_kb_purge;
#     后续已推进, 此处仅留档, 断言不依赖它)。
#
# 注意 (对齐现有 workflow 风格: actions/checkout@v4 + actions/setup-python@v5
#   + permissions: contents: read):
#   - 不在此 workflow 内改任何 app/ 文件; 不动 alembic; 不改现有 workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alembic-single-head:
    name: Alembic single-head guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只装 alembic 一个包 (守卫不连 DB, 故无需 asyncpg / sqlalchemy / 框架依赖)。
      # 原先此处是 ~13 个包的手写精简列表 —— 已随 pytest 段一并删除。
      # 不配 cache: pip / cache-dependency-path: requirements.txt —— 已不再从
      # requirements.txt 安装, 留着会按一个我们并不安装的文件取缓存, 白付 restore
      # 延迟且语义误导。
      - name: Install alembic
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --retries 10 --timeout 60 "alembic>=1.13"

      # alembic heads 只读脚本目录 (不加载 env.py, 不连 DB).
      # 输出格式: "<revision_id> (head)" 每 head 一行; revision_id 即迁移文件名.
      # 守卫断言 = "恰为 1 个 head". 刻意不校验具体编号:
      #   编号是快照会漂移, 硬编码它会让守卫在每次正常加迁移时红一次, 却不防任何
      #   真问题。真正要拦的是"双 head" —— 并行 agent 都声明了同一个 down_revision
      #   会在链上分叉, `alembic upgrade head` 直接报 Multiple head revisions
      #   阻塞部署 (2026-07-24 串单链纪律事故, CLAUDE.md 永久锚点)。单 head 才是
      #   那个不变量, 也是本守卫提供的全部保护。
      - name: Verify alembic chain (1 head expected)
        run: |
          heads=$(python -m alembic heads)
          echo "$heads"
          count=$(echo "$heads" | grep -c '(head)')
          if [ "$count" -ne 1 ]; then
            echo "FAIL: expected exactly 1 alembic head, got $count"
            echo "--- heads ---"
            echo "$heads"
            echo "--- 常见成因: 并行 migration agent 都声明了同一个 down_revision, 链上分叉成双 head。"
            echo "--- 修法: 让后一张迁移的 down_revision 接前一张 (串单链), 别用 alembic merge 留坑。"
            exit 1
          fi
          echo "OK: exactly 1 alembic head ($heads)"
