# GitHub Actions: 凭据扫描 (W86 第 1 批 A-1)
# 沉淀日期: 2026-07-29
#
# 触发:
#   1. pull_request — 任何 PR 触发 (含 fork PR)
#   2. push — main + dev 分支触发
#   3. schedule — 每周一 6 点 UTC 扫历史 + 当前 commit
#
# 失败门禁:
#   gitleaks 退出码 != 0 → exit 1 → PR 不能合
#
# 工件:
#   - gitleaks-report.sarif — Code Scanning 报告 (GitHub Security tab)
#   - gitleaks-report.json   — 详细 JSON 报告 (artifacts 30 天保留)
#
# 凭据类型:
#   - Anthropic API key / OpenAI API key / GitHub PAT
#   - JWT / RSA / SSH / PGP 私钥
#   - MinIO 默认凭据
#   - 其它 (走 gitleaks 默认 100+ 规则)

name: Secret Scan (gitleaks)

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  schedule:
    # 每周一 6:00 UTC 扫历史 (防 commit 历史新增凭据)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: read
  security-events: write   # 上传 SARIF 报告到 GitHub Code Scanning
  actions: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 完整历史 (--all-commits 默认) — 扫历史 commit 也能命中
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 路径走 .gitleaks.toml (项目根)
          GITLEAKS_CONFIG: .gitleaks.toml
        with:
          # 默认: scan staged + working tree + commits (PR 触发时只扫增量 commit)
          # 周一 schedule 触发时扫完整历史
          args: >-
            --redact
            --no-banner
            --verbose

      - name: Upload SARIF report (Code Scanning)
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks

      - name: Upload JSON report (artifact)
        if: always() && hashFiles('gitleaks-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

      - name: Report failure
        if: failure()
        run: |
          echo "::error::gitleaks 检测到凭据泄漏, 请检查上方报告并修复"
          echo "::error::如有误报, 请调整 .gitleaks.toml 的 allowlists 段"
          echo "::error::或使用环境变量 GITLEAKS_LICENSE 申请 pro 规则"
          exit 1