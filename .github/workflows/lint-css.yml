name: Lint CSS

on:
  pull_request:
    branches: [main]
    paths:
      - "web/src/**"
      - "web/.stylelintrc.json"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/playwright.config.js"
      - "web/tests/**"
      # 2026-10-01 S3.7 6: change this workflow itself did not trigger it before -
      # past removals of continue-on-error / vitest job split could only be verified
      # via manual workflow_dispatch.
      - ".github/workflows/lint-css.yml"
  push:
    branches: [main]
    paths:
      - "web/src/**"
      - "web/.stylelintrc.json"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/playwright.config.js"
      - "web/tests/**"
      # 2026-10-01 S3.7 6: change this workflow itself did not trigger it before -
      # past removals of continue-on-error / vitest job split could only be verified
      # via manual workflow_dispatch.
      - ".github/workflows/lint-css.yml"
  # v76.4: 允许手动触发 baseline-guard, 输入 max-increase 临时放宽门禁
  # 用法: Actions → Lint CSS → Run workflow → 输入 max_increase + tracking_issue
  workflow_dispatch:
    inputs:
      max_increase:
        description: "允许临时增加的 stylelint 错误数 (默认 0 = hard fail on any error)"
        required: false
        default: "0"
      tracking_issue:
        description: "临时放宽门禁对应的 issue 编号 (如 #123), 用于审计追溯"
        required: false
        default: ""

# v76.3p: 给 workflow write 权限 (auto-commit baseline png 需要 push)
permissions:
  contents: write

jobs:
  stylelint:
    name: Stylelint (CSS / Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Stylelint
        working-directory: web
        run: npm run lint:css

      # 检查 var(--token, ...) 中 token 都在 variables.css 定义（v73 沉淀，v74 改 hard fail）
      - name: Check token orphans
        run: bash scripts/check-token-orphans.sh --ci-mode
        # v74: 移除 continue-on-error (白名单已覆盖 --i 等设计意图, 真 orphan 必须 fail)
        # v76.5: 加 --ci-mode 输出 ::error file=...,line=... annotation, PR 视图显示错误位置

      # P3-9: webhint 静态 CSS a11y 兜底 (stylelint 漏掉的 a11y/CSS 最佳实践)
      # 用 @webhint/quick-lint 仅做 CSS 静态分析 (无需 dev server)
      - name: webhint CSS a11y 提示 (非阻塞, 仅 PR 警告)
        continue-on-error: true
        run: |
          if [ -d "web/node_modules/@webhint/quick-lint" ]; then
            npx hint --config web/.hintrc web/dist/index.html 2>&1 | head -50 || true
          else
            echo "::notice::@webhint/quick-lint 未安装, 跳过 webhint 步骤 (npm i -D @webhint/quick-lint 可启用)"
          fi

  # 2026-10-01 S3.4 (b): vitest 从 stylelint job 拆出。原先它排在 `Run Stylelint`
  # 之后且二者同 job，而 `Run Stylelint` 无 continue-on-error —— 296 条既有 stylelint
  # 债会让它先行失败并**短路整个 job**，`Run unit tests` 从未被执行
  # （实测该 run 的 `Run unit tests` 步骤组 / `vitest exit=` / `Test Files` 命中数均为 0）。
  # 拆开后本 job 不依赖 stylelint 结论，门禁才**可证伪**：红了能证明门禁在工作。
  # stylelint 债本身见 S3.7 与 S3.4 (c)（baseline-guard 修复 + 基线棘轮），不在本改动范围。
  frontend-unit-tests:
    name: Frontend unit tests (vitest real gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      # 同时跑 vitest 兜底（stylelint 漏掉的逻辑错误）
      # 2026-09-30 S3.4: 原本双重不拦截 —— ① `| tail -30` 在没有 pipefail 的默认 shell
      # 下把 pytest 退出码吞掉 ② continue-on-error: true。两者叠加意味着 1,440 个前端
      # 用例一条都拦不住。参照 server-tests-baseline.yml 的做法: set -o pipefail +
      # ${PIPESTATUS[0]} 让退出码如实上抛。
      - name: Run unit tests (real gate)
        working-directory: web
        run: |
          set -o pipefail
          npm run test:unit -- --run --reporter=dot 2>&1 | tee vitest-output.txt | tail -40
          rc=${PIPESTATUS[0]}
          echo "vitest exit=$rc"
          exit $rc
        # 2026-10-01 S3.4 收口: 存量 8 → 0, 转硬门。拆解见 desktop-conversion
        # docs/plans/2026-09-30-phase-closeout-plan.md 执行记录 #5:
        # 7 条稳定红灯 = 断言漂移 3 文件 (DriveDetailRail 动作键布局改版 /
        # DriveFileTable 封面块退役 + 文件夹 checkbox 前置 / ChatViewSSEW100Plus61
        # 盯的 .header-context-toggle 已被 f1c3c2645 删除), 另 1 条 useSwipeGesture
        # 49px/50px 是真 flaky (fireSwipe 只 mock 了 touchend 段的 Date.now,
        # touchmove 段读真时钟 → elapsed 偶发 ≥1ms 进速度判定提前触发), 已修根因非改断言。

      # 对齐后端: junit xml + 全量输出都上传, 摘掉 continue-on-error 后红灯才有据可查
      # (此前只 tail -40, 失败时看不到完整报告)
      - name: Upload vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-${{ github.run_number }}
          path: |
            web/vitest-output.txt
            web/test-results/
          retention-days: 14
          if-no-files-found: warn


  # P3 守卫：v70/v71/v72 累计的 0 错误基线 + v74 趋势统计
  stylelint-baseline-guard:
    name: Stylelint 0 errors baseline + trend
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100  # 2026-10-01 S3.7 ⑤: 50->100，浅克隆须含 HEAD~1 才能真取基线
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Get current error count
        id: current
        working-directory: web
        run: |
          # 2026-10-01 S3.7 ⑤: Actions 的 run: 默认 bash -e，原写法使 exit 2
          # 直接打死本 step，current 从未写出 → 该 job 只可能在 0 错时通过。
          set +e
          OUTPUT=$(npm run lint:css 2>&1)
          LINT_RC=$?
          set -e
          # 2026-10-01: `|| true` 会把「lint:css 跑不起来」与「真的 0 错」压成同一个 0，
          # 曾导致 guard 假绿（CI 实测 CURRENT=0 而本地为 296）。故必须留痕。
          echo "::group::lint:css 诊断 (exit=$LINT_RC, 输出 $(echo "$OUTPUT" | wc -l) 行)"
          echo "$OUTPUT" | tail -30
          echo "::endgroup::"
          CLEAN=$(echo "$OUTPUT" | sed 's/\x1b\[[0-9;]*m//g')
          CURRENT=$(echo "$CLEAN" | grep -oE '[0-9]+ problems? \([0-9]+ errors?' | grep -oE '\([0-9]+ errors?' | grep -oE '[0-9]+' || echo "0")
          if [ "$CURRENT" = "0" ] && [ "$LINT_RC" != "0" ]; then
            echo "::error title=stylelint 结果不可信::lint:css 以 exit=$LINT_RC 失败却未解析出错误数（多为环境/依赖问题，非 0 错）。不可把本次结果当作基线。"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "current_error_count=$CURRENT" >> "$GITHUB_ENV"
          echo "📊 当前错误数: $CURRENT"
          # v75: 解析每条 error 详情 (file:line) 用于 PR annotation
          echo "error_details<<EOF" >> "$GITHUB_OUTPUT"
          # stylelint 输出格式: src/path/file.vue:LINE:COL  ✖  message  rule-name
          echo "$OUTPUT" | grep -E "✖" | head -50 >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Get baseline error count from last commit
        id: baseline
        run: |
          # 2026-10-01 S3.7 ⑤: 原为「git stash + 重跑 lint」——CI 是干净 checkout，
          # stash 无内容可存即空操作 → baseline 恒等于 current → 趋势守卫形同虚设。
          # 改为真 checkout HEAD~1 再数；取不到时回退为与当前值比较并显式告警。
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha || 'HEAD' }}" 2>/dev/null || true
          BASELINE_SHA=$(git rev-parse --verify HEAD~1 2>/dev/null || echo '')
          if [ -n "$BASELINE_SHA" ]; then
            git checkout -q "$BASELINE_SHA" -- web/ 2>/dev/null || true
            BASELINE=$(cd web && (npm run lint:css 2>&1 || true) | sed 's/\x1b\[[0-9;]*m//g' | grep -oE '[0-9]+ problems? \([0-9]+ errors?' | grep -oE '\([0-9]+ errors?' | grep -oE '[0-9]+' || echo "0")
            git checkout -q HEAD -- web/ 2>/dev/null || true
            echo "已 checkout 基线 commit: $BASELINE_SHA"
          else
            # 2026-10-01 S3.7 ⑤ 复核: 此处小写 `$current_error_count` 是**正确**的——
            # 上游 `Get current error count` 写入 GITHUB_ENV 的键名就是小写
            # (`echo "current_error_count=$CURRENT" >> "$GITHUB_ENV"`), 且该 step
            # 在本 step 之前执行, GITHUB_ENV 注入对后续所有 step 可见。
            # ⚠️ 不要"规范化"成大写 CURRENT_ERROR_COUNT —— 那才会真的取不到。
            BASELINE="$current_error_count"
            echo "::warning title=基线取不到::本轮回退为与当前值比较，趋势检测本轮不生效（浅克隆可能不含 HEAD~1）"
          fi
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "📊 上次 commit 基线: $BASELINE"

      - name: Trend comparison
        if: steps.current.outputs.current != steps.baseline.outputs.baseline
        run: |
          CURRENT=${{ steps.current.outputs.current }}
          BASELINE=${{ steps.baseline.outputs.baseline }}
          DIFF=$((CURRENT - BASELINE))
          if [ "$DIFF" -gt 0 ]; then
            TREND="🔺 +${DIFF}"
            EMOJI="❌"
          else
            TREND="🔻 ${DIFF}"
            EMOJI="✅"
          fi
          echo "${EMOJI} 趋势: $BASELINE → $CURRENT ($TREND)"


      # 2026-10-01 S3.7 ⑤: 基线棘轮 —— 政策是"只降不升"。
      # 仓库当前有 296 条既有 stylelint 债（2026-06-27 曾清零至 0，之后约 700 个 commit
      # 重新累积），一次性清理属独立立项。故本步不因"当前 > 0"而 fail，只在
      # **超过已登记基线** 时 fail —— 让新增违规无法混入存量。
      - name: Check against registered baseline
        env:
          REGISTERED: 296
          # 2026-10-01 S3.7 ⑤ 补: Bash 普通变量不跨 step 共享。`CURRENT` 只在
          # `Get current error count` 的 shell 里被赋值，`Trend comparison` 里的
          # `CURRENT=${{ steps.current.outputs.current }}` 也只活在那一个 step。
          # 本 step 原直接写 $CURRENT → 展开为空 → `[ "" -gt 296 ]` 恒假 →
          # **新增违规静默放行**，棘轮形同虚设。必须经 outputs 显式接线。
          CURRENT: ${{ steps.current.outputs.current }}
        run: |
          echo "已登记基线: $REGISTERED 条"
          echo "本次实测:   $CURRENT 条"
          if [ "$CURRENT" -gt "$REGISTERED" ]; then
            echo "::error file=.github/workflows/lint-css.yml,title=stylelint 新增违规::新增 $((CURRENT - REGISTERED)) 条（$CURRENT > $REGISTERED）。存量 296 条属既有债单独立项；新增一律 fail。"
            exit 1
          fi
          if [ "$CURRENT" -lt "$REGISTERED" ]; then
            echo "::notice title=stylelint 改善::较基线减少 $((REGISTERED - CURRENT)) 条，请调低 REGISTERED 以固化成果。"
          fi
          echo "OK 未新增违规（存量 $CURRENT <= 基线 $REGISTERED）"
      - name: Baseline gate (must be 0)
        # v76.4: 接受 workflow_dispatch inputs.max_increase 临时放宽门禁
        # PR 自动触发 max_increase=0 (hard fail); workflow_dispatch 输入 N 允许临时增加 N 错误
        if: steps.current.outputs.current != '0'
        env:
          # 默认 0 (hard fail), workflow_dispatch 触发时用输入值
          MAX_INCREASE: ${{ github.event.inputs.max_increase || '0' }}
          TRACKING_ISSUE: ${{ github.event.inputs.tracking_issue || '' }}
        run: |
          CURRENT=${{ steps.current.outputs.current }}
          BASELINE=${{ steps.baseline.outputs.baseline }}
          DIFF=$((CURRENT - BASELINE))

          if [ "$DIFF" -le "$MAX_INCREASE" ]; then
            # ✅ 允许临时增加 (在 max_increase 范围内)
            echo "::warning::Stylelint errors: $BASELINE → $CURRENT (+${DIFF}), within max_increase=${MAX_INCREASE}"
            if [ -n "$TRACKING_ISSUE" ]; then
              echo "::notice::Tracked by ${TRACKING_ISSUE} (manual override)"
            fi
            exit 0
          fi

          # ❌ 超出 max_increase, hard fail
          if [ "$MAX_INCREASE" -gt 0 ]; then
            echo "::error::Stylelint errors increased +${DIFF}, exceeds max_increase=${MAX_INCREASE} (current=$CURRENT, baseline=$BASELINE)"
          else
            echo "::error::Stylelint found $CURRENT errors (baseline violation, must be 0)"
          fi
          if [ -n "$TRACKING_ISSUE" ]; then
            echo "::notice::Requested override with ${TRACKING_ISSUE}, but max_increase exceeded"
          fi
          cd web && npm run lint:css 2>&1 | tail -30
          exit 1

      - name: PR annotation (v75)
        if: github.event_name == 'pull_request' && steps.current.outputs.current != '0'
        run: |
          # v75: 解析每条 stylelint error 输出 ::error file=...line=... annotation
          # GitHub Actions 自动在 PR 视图显示错误位置
          cd web
          ERROR_DETAILS='${{ steps.current.outputs.error_details }}'
          while IFS= read -r line; do
            # 解析 src/path:LINE:COL  ✖  message  rule-name
            FILE=$(echo "$line" | grep -oE '^[^ ]+\.(vue|css|scss)' | head -1)
            LINENUM=$(echo "$line" | grep -oE ':[0-9]+:[0-9]+' | head -1 | cut -d: -f2)
            MESSAGE=$(echo "$line" | sed -E 's/^.*✖[[:space:]]+//' | sed -E 's/[[:space:]]+[a-z][a-z-]*$//')
            if [ -n "$FILE" ] && [ -n "$LINENUM" ]; then
              echo "::error file=$FILE,line=$LINENUM::$MESSAGE"
            fi
          done <<< "$ERROR_DETAILS"

      - name: ✅ Stylelint 0 errors (baseline maintained)
        if: steps.current.outputs.current == '0'
        run: echo "✅ Stylelint 0 errors (baseline maintained)"

  # v76.2 视觉回归 job 已废弃 (2026-06-29):
  # - 失败率 40% (20/50 runs), 全是 Visual regression 自身问题
  # - 真实 bug 拦截率低 (grep 6 月 commit 没找到实锤)
  # - Stylelint (CSS / Vue) + token orphan check 已覆盖 CSS 视觉退化
  # - v77 P2.6-F.2 smoke test (14 项手测) + 浏览器手测已覆盖功能视觉
  # - OS suffix 跨平台坑 + desktop baseline auto-commit bug 长期未修
  # - 保留 baseline PNG 和 spec 文件作本地 dev 用, 不进 CI
  visual-regression-deprecated: # 占位 job (空), workflow 保持 3 jobs 结构
    name: Visual regression (已废弃)
    runs-on: ubuntu-latest
    if: false  # 永远跳过
    steps:
      - run: echo "Visual regression job 已废弃 (2026-06-29). 见 CLAUDE.md"
