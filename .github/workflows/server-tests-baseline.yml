name: Server Tests Baseline (full tests/)

# 2026-09-30 S1.2 (阶段收尾规划 docs/plans/2026-09-30-phase-closeout-plan.md, 仓库 desktop-conversion)
#
# 背景: 服务端 451 个测试文件此前无任何 workflow 跑过全量。红灯已实证潜伏 2 个月
#   (test_drive_v2_pr3_comment_v2_e2e.py, S1.3 已修)。
#
# v2 (2026-09-30): v1 单 job 串行跑全量, 90 分钟 timeout 只完成 ~8-10% 被杀
#   (run 36618267053, 1h30m26s cancelled)。改为 8 片 matrix:
#   - 全部 test_*.py 排序后 round-robin 均分 8 片 (每片时长均匀, 不按字母序聚集)
#   - 每个 matrix job 独立 postgres+redis service 容器 → 并发分片天然库隔离,
#     不触发 "共享 microbubble_test 并发 DROP SCHEMA 互砸" (CLAUDE.md 铁律)
#   - 每片 continue-on-error + junit artifact; summary job 合并统计
#
# 分两步走 (本文件仍是第 1 步): 收集全量基线红灯清单, 不阻塞合并;
#   清单收敛后逐个修复, 最终摘除 continue-on-error 转硬门, 并可删片数。

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/server-tests-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests-baseline:
    name: shard ${{ matrix.shard }} (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microbubble_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 全历史: tests/rag/qa_bench_* 断言基线 commit (如 git log 59b2a9603..HEAD),
          # 默认 shallow clone (depth=1) 下 "fatal: bad revision" → 26 条红灯。
          # 2026-09-30 S1.2 收敛 R4。
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # libsndfile: soundfile 库的系统依赖 — rag multimodal 音频链路需要
          # (基线 R1: 24 条 "find_library sndfile" OSError, 2026-09-30 S1.2 收敛 R2)
          sudo apt-get update -qq && sudo apt-get install -y -qq libsndfile1
          python -m pip install --upgrade pip
          pip install --prefer-binary --retries 10 --timeout 120 -r requirements.txt
          # pytest-timeout: 单测级超时保护。2026-09-30 S1.2 收敛 R3: shard 7 因个别
          # 长 timeout / subprocess 测试挂死拖到 45min 整片被杀 (报告全丢)。加
          # --timeout=300 后单测超 5 分钟即被 thread 模式杀掉并标记, 不再连坐整片。
          pip install pytest pytest-asyncio pytest-timeout

      - name: Prepare test DB (extensions)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d microbubble_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          SQL

      # round-robin 分片: 排序后按 NR % 8 轮转分发, 每片混合全仓各类测试, 时长均匀
      - name: Split test files into 8 shards
        run: |
          mkdir -p .pytest-chunks
          find tests -name "test_*.py" | sort | \
            awk -v N=8 '{print > (".pytest-chunks/chunk-" (NR % N) ".txt")}'
          wc -l .pytest-chunks/chunk-*.txt

      - name: Run shard ${{ matrix.shard }} (baseline collection, failures expected)
        continue-on-error: true
        env:
          # 只设 TEST_DATABASE_URL: 刻意不设 DATABASE_URL。
          # tests/conftest.py 从 settings.DATABASE_URL 派生测试 URL (库名换
          # microbubble_test) —— 若 CI 注入 DATABASE_URL=…/microbubble_test, 则
          # settings.DATABASE_URL 变成测试库, 击穿
          # test_fin1_backup_share_block::test_guard_injected_test_url_is_not_production
          # (它断言 resolved != settings.DATABASE_URL 的 asyncpg 形式)。
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/microbubble_test"
          # 需同时设 DATABASE_URL: tests/conftest.py 的 TEST_DB_URL 默认从
          # settings.DATABASE_URL 派生 (库名换 microbubble_test), CI 需它提供主机/凭据。
          # (R4 曾删除本行 → 4 条 InvalidPasswordError, R5 恢复)
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/microbubble_test"
          REDIS_URL: "redis://localhost:6379/0"
          SKIP_DB_SETUP: ""
        run: |
          set -o pipefail
          echo "===== shard ${{ matrix.shard }} files: $(wc -l < .pytest-chunks/chunk-${{ matrix.shard }}.txt) ====="
          tr '\n' '\0' < .pytest-chunks/chunk-${{ matrix.shard }}.txt | \
            xargs -0 python -m pytest -q \
              --timeout=300 --timeout-method=thread \
              --continue-on-collection-errors \
              --junitxml=report-shard-${{ matrix.shard }}.xml \
              -rfE 2>&1 | tee pytest-shard-${{ matrix.shard }}.txt || true
          echo "===== SHARD ${{ matrix.shard }} SUMMARY ====="
          grep -E "^(FAILED|ERROR)" pytest-shard-${{ matrix.shard }}.txt | head -60 || true
          tail -3 pytest-shard-${{ matrix.shard }}.txt

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-shard-${{ matrix.shard }}
          path: |
            report-shard-${{ matrix.shard }}.xml
            pytest-shard-${{ matrix.shard }}.txt
          retention-days: 14
          if-no-files-found: warn

  baseline-summary:
    name: Merge baseline summary
    runs-on: ubuntu-latest
    needs: server-tests-baseline
    if: always()
    steps:
      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: baseline-shard-*
          merge-multiple: true
          path: reports

      - name: Merge statistics into step summary
        run: |
          python - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET

          tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          bad = []
          for f in sorted(glob.glob("reports/report-shard-*.xml")):
              ts = ET.parse(f).getroot()
              if ts.tag == "testsuites":
                  suites = ts.findall("testsuite")
              else:
                  suites = [ts]
              for s in suites:
                  for k in tot:
                      tot[k] += int(s.get(k, 0))
                  for tc in s.iter("testcase"):
                      for kind in ("failure", "error"):
                          node = tc.find(kind)
                          if node is not None:
                              bad.append(f"{kind.upper():7s} {tc.get('classname','')}.{tc.get('name','')}")
                              break

          lines = [
              "## Full tests/ baseline (v2, 8 shards)",
              "",
              f"| passed | failed | errors | skipped | total |",
              f"|---|---|---|---|---|",
              f"| {tot['tests']-tot['failures']-tot['errors']-tot['skipped']} | {tot['failures']} | {tot['errors']} | {tot['skipped']} | {tot['tests']} |",
              "",
              f"<details><summary>FAILED/ERROR 清单 ({len(bad)} 条)</summary>",
              "",
              "```",
          ]
          lines += bad[:200]
          if len(bad) > 200:
              lines.append(f"... 另有 {len(bad)-200} 条, 见 shard artifact")
          lines += ["```", "</details>"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          print("\n".join(lines[:8]))
          print(f"bad total: {len(bad)}")
          EOF

      - name: Upload merged reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-merged-reports
          path: reports/
          retention-days: 14
