name: QA Bench Smoke (200 questions, < 5 min, test DB)

# v3.0 计划 — 每次 PR 跑 200 题 smoke 子集
# 700 题全量太慢（5+ 小时），所以跑 hot_path 标签的 200 题
# 5 分钟内必须通过，否则 PR 红 ✗ 阻断 merge

# 2026-07-02 修复 (qa-bench-smoke-test-db):
# - 改用 test DB stack (microbubble_test + 8001 端口 app) 避免污染生产 DB
# - 加 init_db + ensure_test_user 步骤 (test DB 完全冷启动)
# - runner.py --api-base http://localhost:8001 指向 test app

on:
  pull_request:
    branches: [main]
    paths:
      - "app/agent/**"
      - "app/services/chat_history*.py"
      - "app/services/self_rag.py"
      - "app/services/reminder_*.py"
      - "app/config.py"
      - "tests/qa-bench/**"
      - ".github/workflows/qa-bench-smoke.yml"
  push:
    branches: [main]
    paths:
      - "app/agent/**"
      - "app/services/chat_history*.py"
      - "app/services/self_rag.py"
      - "tests/qa-bench/**"
      - ".github/workflows/qa-bench-smoke.yml"
  workflow_dispatch:
    inputs:
      question_count:
        description: "跑题数 (默认 200 smoke, 0 = 全量 700)"
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  qa-bench-smoke:
    name: QA Bench 200 题 Smoke (test DB)
    runs-on: ubuntu-latest
    # 2026-10-06 缺陷 4: timeout 复算 10 -> 15, 依据真 run 时间戳 (非拍脑袋):
    # 固定开销实测:
    #   setup -> Install deps   16s  (smoke run 37481598381: 14:45:17 -> 14:45:33)
    #   Pull pre-built image   151s  (同链路 D5 run 37479098887 step7: 14:29:26 -> 14:31:57)
    #   Start test DB stack     27s  (D5 step8: 14:31:57 -> 14:32:24)
    #   init/ensure/gen 题库     ~5s  (D5 step9-12: 14:32:24 -> 14:32:28)
    #   upload/gate/teardown     ~5s  (D5 step14/16/17: 各 0-1s)
    #   => 固定 ≈ 3.4 min
    # 动态部分:
    #   runner 200 题: 本 workflow W71 B-5 注自带预算 主测 ≤2min + 抽测 ≤3min = 5min
    #     (CI 内尚无实测, 历史上 runner 从未执行过; 401 快败只会更短)
    #   fast-vs-deep: 90 req / conc 2, 历史上全 skipped 无实测; 401 快败 <1min,
    #     按 ~5s/req 保守估 45 波 ≈ 4min
    #   合计 3.4 + 5 + 4 ≈ 12.4, 加 ~2.5min 余量 = 15
    #   10min 下动态区只剩 1.6min (5min runner 预算都不够), 故复算取 15。
    #   原 10min 是 build 步 (6-12min) 尚在时代的紧 budget, build 已被 pull 替代。
    # 2026-10-07 第 2 次复算: 15 -> 30。上面动态部分全部按 401/认证快败估的
    #   (runner 题均 0.2-1s), 换 OpenRouter 真 LLM 后该前提作废:
    #   - 本地真探针 (qwen/qwen3.7-flash): 非流式 tool 轮 2.9s, SSE 流式轮 5.6s,
    #     tool 结果回填轮 6.4s (均含 reasoning, provider=Alibaba)。
    #   - 主测/抽测各 100 题 @ conc4: app 每题 1-4 次 LLM 轮 → 题均 5-15s
    #     → 各 ≈ 4min (原预算 2/3min 是 401 时代的数)。
    #   - fast-vs-deep: 90 req @ conc2 同后端真跑, 历史 6s 是 401 快败,
    #     真实 ≈ 90×10s/2 ≈ 7.5min (原估 4min 偏紧)。
    #   合计 3.4(固定实测) + 0.5(login) + 4 + 4 + 8 + 0.5(gate) ≈ 20.4,
    #   加 ~9.6min 余量 (首跑推理更慢 / 429 退避 / 长题) = 30。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache pip + Docker layers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /tmp/.buildx-cache
          key: ${{ runner.os }}-pip-docker-${{ hashFiles('requirements.txt', 'Dockerfile', 'web/package.json', 'web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pip-docker-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --retries 10 --timeout 60 httpx

      # === 2026-10-06 缺陷 1 根因修复: build 步 (cold cache 6-12 min) 撞 job
      # timeout-minutes: 10 必超时 —— 近 10 次 run 全部死在 build 步被砍 (实测
      # run 37481598381: build 跑 9m35s 撞 10min job timeout, 14:45:43->14:55:18)。
      # 照抄 qa-bench-ci.yml (D5, 该文件 2026-10-07 已退役删除) W67 第 48 步路线 2 形态: 改拉 build-image.yml
      # 推到 GHCR 的预构建镜像 (D5 实测 pull 151s), buildx + build 两步
      # `if: false` 注释禁用 (保留注释回退形态, 不物理删 step)。
      # 回退路径: buildx/build 两步去掉 `if: false` + 删 Pull 步, 即回本地 buildx 模式。
      - name: Set up Docker Buildx (W67 step 38, 路线 2 已禁用, 保留注释回退)
        if: false
        uses: docker/setup-buildx-action@v3
        # W67 第 38 步: 必须 setup buildx, 否则 cache-from: type=gha 不工作 (默认 docker driver 不支持)
        # 仅回退到本地 build 模式时才需要 (预构建 pull 不走 buildx)。

      # === W67 第 36 步: Buildx + GHA 跨 run layer cache ===
      # === W67 第 37 步: 显式 context = ${{ github.workspace }} + file 路径 ===
      # 2026-10-06 缺陷 1: 本步与上方 buildx 同时 `if: false` 禁用 (cold cache
      # 6-12 min 必撞 timeout), 由下方 Pull pre-built 步替代。保留本步供回退。
      - name: Build app-test image (W67 step 36 真 cache, 利用 GHA cache-from)
        if: false
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: false
          load: true
          tags: app-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # === 2026-10-06 缺陷 1: GHCR pre-built image (W67 step 48 路线 2, 照抄 D5) ===
      # 触发链: push to main → build-image.yml 自动 build & push 到
      #   ghcr.io/<OWNER>/microbubble-agent:app-test-latest
      # CI 这边: docker pull (D5 实测 151s / 14:29:26 -> 14:31:57) → docker tag
      #   → 复用现成 "Start test DB stack" 步启动逻辑 (镜像名 app-test:ci 不变)。
      # 回退路径: revert 本步 + buildx/build 两步去掉 `if: false`。
      - name: "Pull pre-built app-test image (W67 step 48 路线 2, GHCR pre-built)"
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest
          docker tag ghcr.io/${{ github.repository_owner }}/microbubble-agent:app-test-latest app-test:ci
          docker images app-test:ci --format "✓ app-test:ci ready, {{.Size}}"

      # === 新增 test DB stack 启动 (替代生产 app/db) ===
      # v2026-07-23 修复: 改用 Docker network 让 app-test 通过服务名 `pg-test` 直连,
      #   解决 Linux runner 上 `host.docker.internal` 不解析的连接问题.
      # W67 第 33 步: 用已 build image `app-test:ci`, 启动 ~30-60s (不再 6-10 min)
      - name: Start test DB stack (microbubble_test + app on 8001, 用 image)
        run: |
          # 创建独立网络, 让容器间通过服务名直连 (Linux runner 无 host.docker.internal)
          docker network create qa-bench-net

          # 起 test DB (app 经 qa-bench-net 网络以服务名 pg-test 直连)
          # 2026-10-07 断点 3: postgres:16-alpine 无 vector 扩展二进制, 且
          # SKIP_DB_SETUP=1 短路了 app lifespan 的 CREATE EXTENSION → init_db
          # create_all 报 f405 (member.py voice_embedding 是 HALFVEC(192))。
          # 照抄 D5 (qa-bench-ci.yml 111-162 行, 该文件 2026-10-07 已退役删除): 换 pgvector/pgvector:pg16
          # 官方镜像 —— 注意它只带扩展二进制、从不自动执行 CREATE EXTENSION。
          docker run -d --name pg-test \
            --network qa-bench-net \
            -e POSTGRES_DB=microbubble_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=microbubble2026 \
            pgvector/pgvector:pg16
          # 等 pg-test ready (最长 60s)
          for i in {1..30}; do
            if docker exec pg-test pg_isready -U postgres > /dev/null 2>&1; then
              echo "✓ pg-test ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "✗ pg-test startup timeout"
              docker logs pg-test | tail -30
              exit 1
            fi
            sleep 2
          done

          # === 2026-10-07 断点 3 (照抄 D5 133-162 行): 显式装 vector 扩展 ===
          # pgvector/pgvector:pg16 官方镜像只是"自带扩展二进制", 从不执行
          # CREATE EXTENSION —— 实测全新 template1 (POSTGRES_DB 的克隆源) 只有
          # plpgsql; 而 app lifespan 里的 CREATE EXTENSION 被 SKIP_DB_SETUP=1
          # 短路。只装 vector: create_all 只用 vector/halfvec 类型即可过。
          echo "=== install pgvector extension (create_all 需要 halfvec/vector 类型) ==="
          for i in {1..10}; do
            if docker exec pg-test psql -U postgres -d microbubble_test \
                 -c "CREATE EXTENSION IF NOT EXISTS vector;" > /dev/null 2>&1; then
              echo "✓ pgvector extension 已安装"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "✗ CREATE EXTENSION vector 10 次全失败 — 镜像不含 vector 控制文件?"
              docker exec pg-test psql -U postgres -d microbubble_test \
                -c "SELECT extname FROM pg_extension;" || true
              docker logs pg-test | tail -30
              exit 1
            fi
            sleep 2
          done
          # fail-loud 回读: 装没装上不能靠 psql 退出码猜 (某些失败也会退 0)
          docker exec pg-test psql -U postgres -d microbubble_test -tAc \
            "SELECT count(*) FROM pg_extension WHERE extname='vector';" \
            | grep -qx 1 || { echo "✗ vector 扩展装上后回读仍为 0"; exit 1; }

          # 起 test app (8001 端口, 接 test DB 通过同网络服务名 pg-test)
          # W67 第 33 步: 用已 build image, 不再 `$(docker build -q .)`
          # 2026-10-07 凭据切换: 原 LLM_BACKEND=mock 是**坏值** —— llm.py 只认
          #   anthropic/openai_compat/ollama, "mock" 落 else 分支走 anthropic +
          #   空 CLAUDE_API_KEY → SSE 恒出 error "Could not resolve authentication
          #   method..." → 200/200 题 stream_error_event 快败 0.0% (run
          #   37497190067 实测)。改 openai_compat + OpenRouter (secrets 三件),
          #   与 D5 (qa-bench-ci.yml, 该文件 2026-10-07 已退役删除) 同一凭据链, 逐题进真实 LLM 形态。
          # 2026-10-07 第 2 修 (run 37503878084): 光切 LLM_OPENAI_COMPAT_* 不够 ——
          #   容器无 .env (Dockerfile 不拷贝), 聊天链路的**其余模型 env** 全落
          #   config.py 默认值 (thinking 三档=qwen2.5vl:7b / synthesis=mimo-v2.5 /
          #   intent+compressor=claude-haiku / reflection=claude-sonnet), 逐个被
          #   OpenRouter 400 "not a valid model ID" 打回 (首错 qwen2.5vl:7b,
          #   200 题仍 0.0%)。照本地 .env 的"单模型收敛"打法, 7 个模型 env 全量
          #   注入同一 OpenRouter 模型 (secrets.OPENROUTER_MODEL)。
          docker run -d --name app-test \
            --network qa-bench-net \
            -p 8001:8000 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:microbubble2026@pg-test:5432/microbubble_test" \
            -e REDIS_URL="redis://localhost:6379/1" \
            -e MINIO_ENDPOINT="localhost:9000" \
            -e MINIO_BUCKET="microbubble-test" \
            -e MINIO_PUBLIC_URL="http://localhost:9001" \
            -e LLM_BACKEND=openai_compat \
            -e LLM_OPENAI_COMPAT_BASE_URL="${{ secrets.OPENROUTER_BASE_URL }}" \
            -e LLM_OPENAI_COMPAT_MODEL="${{ secrets.OPENROUTER_MODEL }}" \
            -e LLM_OPENAI_COMPAT_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -e AGENT_THINKING_MODE_FAST_MODEL="${{ secrets.OPENROUTER_MODEL }}" \
            -e AGENT_THINKING_MODE_BALANCED_MODEL="${{ secrets.OPENROUTER_MODEL }}" \
            -e AGENT_THINKING_MODE_DEEP_MODEL="${{ secrets.OPENROUTER_MODEL }}" \
            -e AGENT_SYNTHESIS_MODEL="${{ secrets.OPENROUTER_MODEL }}" \
            -e AGENT_INTENT_MODEL="${{ secrets.OPENROUTER_MODEL }}" \
            -e AGENT_COMPRESSOR_MODEL="${{ secrets.OPENROUTER_MODEL }}" \
            -e AGENT_REFLECTION_MODEL="${{ secrets.OPENROUTER_MODEL }}" \
            -e SKIP_DB_SETUP=1 \
            -v $(pwd)/app:/app/app \
            -v $(pwd)/alembic/versions:/app/alembic/versions \
            app-test:ci \
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log

          # 等 app-test healthy (最长 1800s = 30min)
          # W67 第 39 步: 实测 1510s, 1500s 还差 10 秒. 提到 1800s 留缓冲 (最后 1 次).
          # 拆 build 修复 (W67 第 33 步) + 真 GHA cache (W67 第 36 步) 后实际启动 25+ min
          for i in {1..900}; do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "✓ app-test healthy on 8001"
              break
            fi
            if [ "$i" -eq 900 ]; then
              echo "✗ app-test startup timeout"
              docker logs app-test | tail -50
              exit 1
            fi
            sleep 2
          done

      - name: Init test DB schema + seed data
        run: |
          # 2026-10-07 断点 3: 默认 shell 是 bash -e 无 pipefail, `... | tail -N`
          # 的管道退出码取 tail (恒 0) → init_db 内部 f405 报错被掩绿成 step
          # success (run 37488667066 日志实测 2 处)。照抄 D5 (qa-bench-ci.yml
          # 226 行, 该文件 2026-10-07 已退役删除) 先开 pipefail, 再建表。
          set -o pipefail
          # 用 Base.metadata.create_all 建表 + seed (init_db.py 同时插入 24 members 等)
          docker exec -e SKIP_DB_SETUP=1 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:microbubble2026@pg-test:5432/microbubble_test" \
            app-test python scripts/init_db.py 2>&1 | tail -5

          # alembic stamp head (init_db 用 create_all, 不走 alembic, 需要手动 stamp)
          # 关键: alembic_version.version_num VARCHAR(32) 上限 (CLAUDE.md 2026-06-02 教训),
          # 055 migration 已重命名为 055_personal_wechat_ci (22 字符) 适配
          docker exec -e SKIP_DB_SETUP=1 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:microbubble2026@pg-test:5432/microbubble_test" \
            app-test alembic stamp head 2>&1 | tail -3

          # === 2026-10-07 断点 3 fail-loud: 建表后 psql 实测表数 > 0 才算真 success ===
          # \dt 输出肉眼可见 + information_schema 表数断言, 任一缺失即 exit 1,
          # 不再依赖"命令没报错"这种可被管道/静默失败掩盖的弱信号。
          echo "=== 建表验证: psql \\dt (public schema) ==="
          docker exec pg-test psql -U postgres -d microbubble_test -c "\dt"
          TABLE_COUNT=$(docker exec pg-test psql -U postgres -d microbubble_test -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          if ! [ "${TABLE_COUNT}" -gt 0 ] 2>/dev/null; then
            echo "::error::init_db 后 public schema 表数 = '${TABLE_COUNT}' (空/非正数) — 建表未发生, 拒绝假 success"
            exit 1
          fi
          echo "✓ 建表验证通过: public 表数 = ${TABLE_COUNT}"

      - name: Ensure test user (xiaoqi_testbot) exists
        run: |
          # 2026-10-07 断点 3: 同 Init 步 —— `| tail -3` 无 pipefail 会把
          # ensure_test_user 的非零退出掩成 success, 先开 pipefail。
          set -o pipefail
          docker exec -e SKIP_DB_SETUP=1 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:microbubble2026@pg-test:5432/microbubble_test" \
            app-test python scripts/ensure_test_user.py 2>&1 | tail -3
          # 期望: [OK] 或 [CREATED] 都行 (幂等)

      - name: Generate 700 题题库
        working-directory: tests/qa-bench
        run: |
          python gen780.py --output questions_780.jsonl --schema-only
          wc -l questions_780.jsonl

      # === 2026-10-07 断点 2: 照抄 D5 (qa-bench-ci.yml W67 第 42 步, 421-458 行, 该文件同日已退役删除) Login 模式 ===
      # 根因: 下方三个 runner/benchmark 步原用 QA_TOKEN=${{ secrets.QA_TOKEN }} +
      #   --token "${QA_TOKEN:-mock}" —— secret 为空时 fallback "mock" → app 401
      #   无效的认证凭证 → 双 runner ERROR=100 快败 (run 37488667066 实测)。
      #   D5 同文件 423 行注释自证老 fallback 曾致 1s fail, 早已废弃此路线。
      # 改法 (D5 形态): app 就绪后先用 ensure_test_user 创建的
      #   xiaoqi_testbot / testbot_pass_2026 登录拿真 JWT →
      #   echo "REAL_QA_TOKEN=$TOKEN" >> $GITHUB_ENV → 下游步
      #   QA_TOKEN: ${{ env.REAL_QA_TOKEN }} + --token "${QA_TOKEN}" 无 fallback,
      #   token 缺失即 fail loud。D5 Login 步不含 secrets 引用 (账号密码为
      #   ensure_test_user 默认值), 本步照抄即全部所需, 无其他 secrets 要搬。
      - name: Login as testbot to get JWT (D5 W67 第 42 步照抄)
        run: |
          # /health 200 不代表路由就绪, 重试 15 次 × 2s = 30s (D5 fail-fast 形态)
          for i in {1..15}; do
            HTTP_CODE=$(curl -s -o /tmp/login_resp.txt -w "%{http_code}" \
              -X POST http://localhost:8001/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"xiaoqi_testbot","password":"testbot_pass_2026"}' 2>&1)
            if [ "$HTTP_CODE" = "200" ]; then
              LOGIN_RESP=$(cat /tmp/login_resp.txt)
              echo "✓ HTTP 200 OK (attempt $i)"
              break
            fi
            echo "✗ attempt $i HTTP $HTTP_CODE: $(head -c 200 /tmp/login_resp.txt)"
            if [ "$i" -eq 15 ]; then
              echo "=== app-test logs (final 80 lines) ==="
              docker logs --tail 80 app-test 2>&1 | tail -80
              exit 1
            fi
            sleep 2
          done
          TOKEN=$(echo "$LOGIN_RESP" | python -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "✗ Login response missing access_token: $LOGIN_RESP"
            exit 1
          fi
          echo "✓ Login OK, token length ${#TOKEN}"
          echo "REAL_QA_TOKEN=$TOKEN" >> $GITHUB_ENV

      # === W71 B-5: smoke 200 题拆 2 step (主测 100 ≤ 2min + 抽测 100 ≤ 3min) 避免 5min timeout ===
      # W69 plan 备注 LOW 缺口: 原单次 5min 跑全 200 题不现实. 拆分主测/抽测两段, 各自 offset 定位.
      # 2026-10-06 缺陷 2: 加 id: smoke_main —— 原门禁步 outcome 守卫曾读本步
      # ${{ steps.smoke_main.outcome }} 防止 runner 被砍时读入库旧 results.json;
      # 门禁已于 2026-10-07 退役 (fa66f4f66 仅报数), 守卫随之删除, id 保留备用。
      - name: Run 200 题 smoke — 主测 100 题 (against test DB 8001, ≤ 2min)
        id: smoke_main
        working-directory: tests/qa-bench
        env:
          API_BASE: http://localhost:8001     # ← 8001 (test app)
          # 2026-10-07 断点 2: 原 ${{ secrets.QA_TOKEN }} (secret 空 → fallback
          # "mock" → 401) 改用上方 Login 步写进 $GITHUB_ENV 的真 JWT (D5 形态)。
          QA_TOKEN: ${{ env.REAL_QA_TOKEN }}
        run: |
          # W71 B-5: 主测子集 (前 100 题), --limit 100
          # 断点 2: 去掉 :-mock fallback —— token 必须来自上方 Login 步, 缺失 fail loud
          python runner.py \
            --token "${QA_TOKEN}" \
            --api-base "http://localhost:8001" \
            --smoke --limit 100 \
            --output results/smoke-main \
            --concurrency 4
          if [ -f results/smoke-main/results.json ]; then
            echo "✓ Smoke 主测 100 题完成 (≤ 2min)"
          else
            echo "✗ Smoke 主测失败"
            exit 1
          fi

      # 2026-10-06 缺陷 2: 加 id: smoke_sample —— 原门禁步 outcome 守卫同上;
      # 守卫已随门禁 2026-10-07 退役删除 (fa66f4f66), id 保留备用。
      - name: Run 200 题 smoke — 抽测 100 题 (against test DB 8001, ≤ 3min)
        id: smoke_sample
        working-directory: tests/qa-bench
        env:
          API_BASE: http://localhost:8001
          # 2026-10-07 断点 2: 同主测步, 真 JWT 来自上方 Login 步 (D5 形态)。
          QA_TOKEN: ${{ env.REAL_QA_TOKEN }}
        run: |
          # W71 B-5: 抽测子集 (后 100 题), --offset 100 --limit 100
          # 断点 2: 去掉 :-mock fallback —— token 必须来自上方 Login 步, 缺失 fail loud
          python runner.py \
            --token "${QA_TOKEN}" \
            --api-base "http://localhost:8001" \
            --smoke --offset 100 --limit 100 \
            --output results/smoke \
            --concurrency 4
          # 期望 3 分钟内完成
          if [ -f results/smoke/results.json ]; then
            echo "✓ Smoke 抽测 100 题完成 (test DB, 无生产污染, 主测+抽测合计 200 题)"
            cat results/smoke/report.md | head -50
          else
            echo "✗ Smoke 抽测失败"
            exit 1
          fi

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-bench-smoke-report
          path: tests/qa-bench/results/smoke/
          retention-days: 14

      # === 2026-07-13 #P1: 三档推理模式 benchmark (30 题 × 3 mode = 90 次, 验证 fast/balanced/deep 真区分) ===
      # 2026-10-06 修路径加倍: 脚本在仓库根 scripts/, 本步却设 working-directory
      # tests/qa-bench => `python scripts/benchmark_fast_vs_deep.py` 解析成
      # tests/qa-bench/scripts/... (不存在), --questions tests/qa-bench/... 也加倍。
      # 三处相对路径 (脚本 / 题库 / --output docs/benchmarks) 均按仓库根书写,
      # 故本步不设 working-directory, cwd 即仓库根。
      # 2026-10-06 缺陷 3: 本步原排在门禁 (always()) 之后 —— 门禁红时默认
      # success() 条件必 skip, 永不可达。移到门禁之前: env (API_BASE/QA_TOKEN)
      # 是 step 级自带, 题库/脚本来自 checkout, app-test 直到最后 Teardown 才
      # 下线, 与本步在门禁前后无关。其 upload 步 (if: always()) 留在门禁后不动。
      - name: Run fast vs balanced vs deep benchmark (30 题 × 3 mode)
        env:
          API_BASE: http://localhost:8001
          # 2026-10-07 断点 2: 同 runner 步, 真 JWT 来自上方 Login 步 (D5 形态)。
          QA_TOKEN: ${{ env.REAL_QA_TOKEN }}
        run: |
          python scripts/benchmark_fast_vs_deep.py \
            --questions tests/qa-bench/questions_fast_vs_deep.jsonl \
            --api-base-fast http://localhost:8001 \
            --api-base-balanced http://localhost:8001 \
            --api-base-deep http://localhost:8001 \
            --token "${QA_TOKEN}" \
            --concurrency 2 \
            --output docs/benchmarks/fast-vs-deep-${GITHUB_SHA::8}.md
          # 注: 单 docker 配置下 3 mode 走同一后端, 实际三档区分由 THINKING_MODE env + 后端 thinking_config 调度
          # 验证: deep 模式应该 thinking_tokens_used > 0, fast 模式延迟 < balanced < deep

      # 2026-10-07 门禁退役 (用户拍板选项 1, 依据收尾计划 §4.15 结构性恒红):
      # smoke 与 D5 读同一套过时口径题库 (200 题切片 0 条小写期望 / 98.5% 大写
      # 过时期望), intent_mismatch 虽是 WARN 但 PASS 要求零 issue => 80% 门禁
      # 结构性恒红、任何模型不可达, 且每次 push 都红 = 永久红灯训练无视。
      # 原 `Fail if pass_rate < 80%` 判红步整步替换为仅报数 summary 步 ——
      # 探针价值保留 (真 LLM 应答形态 / 工具调用 / Login / DB / 栈健康 /
      # runner 可执行性); 上游 runner 真挂了 job 自然红, 轮不到本步兜底,
      # 故本步恒 exit 0, 不读 outcome 守卫、不判阈值。
      - name: Smoke pass_rate summary (门禁已退役, 仅报数不判红)
        if: always()
        working-directory: tests/qa-bench
        run: |
          # 2026-10-07 门禁退役（用户拍板，依据收尾计划 §4.15 结构性恒红）—— 本步仅报数
          echo "2026-10-07 门禁退役（用户拍板，依据收尾计划 §4.15 结构性恒红）—— 本步仅报数"
          # 恒 exit 0: 关闭默认 bash -e 短路, 任何读取/解析失败都只报数不判红
          set +e
          if [ -f results/smoke/results.json ]; then
            PASS_RATE=$(python3 << 'PYEOF'
          import json
          # encoding 显式给 utf-8: results.json 由 runner 以 ensure_ascii=False
          # UTF-8 写出, locale 编码 (Windows GBK 等) 读中文字段会炸
          with open('results/smoke/results.json', encoding='utf-8') as f:
              d = json.load(f)
          total = d['summary']['total']
          pass_ = d['summary']['pass']
          print(round(pass_ / max(total, 1) * 100, 1))
          PYEOF
          )
            if [ -n "${PASS_RATE}" ]; then
              echo "Smoke 通过率: ${PASS_RATE}%"
            else
              echo "结果文件无法解析（仅报数不判红, 上游失败 job 自然红）"
            fi
          else
            echo "结果文件缺失（上游步骤应已报红）"
          fi
          exit 0

      - name: Upload thinking mode benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-vs-deep-benchmark
          path: docs/benchmarks/fast-vs-deep-*.md

# === 新增: 清理 test stack ===
      - name: Teardown test stack
        if: always()
        run: |
          docker rm -f app-test pg-test 2>/dev/null || true
          docker network rm qa-bench-net 2>/dev/null || true
          echo "✓ test DB stack cleaned up"