<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · 卷首账目 — 成员详情弹窗</title>
<style>
:root {
  --primary:#0E766E; --primary-dark:#0B5D56; --primary-bg:rgba(14,118,110,.09); --primary-border:rgba(14,118,110,.35);
  --text:#22302C; --text-2:#52615C; --text-3:#8B968F; --text-4:#B9BFB6;
  --bg:#F2F0EB; --card:#FFFFFF; --line:#E5E1D8; --line-2:#D5D0C3; --bg-hover:#EEEBE3;
  --shadow:0 24px 64px rgba(20,40,35,.28); --r-md:8px; --r-lg:12px; --r-full:9999px;
  --font:'PingFang SC','Microsoft YaHei','Segoe UI',Inter,sans-serif;
  --mono:Consolas,'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"] {
  --text:#E9E8E2; --text-2:#B9C0B9; --text-3:#8B938C; --text-4:#5E665F;
  --bg:#121513; --card:#1A1E1B; --line:#2E342F; --line-2:#3A413A; --bg-hover:#242A25;
  --primary:#35C2A4; --primary-dark:#5AD0B5; --primary-bg:rgba(53,194,164,.12); --primary-border:rgba(53,194,164,.35);
  --shadow:0 24px 64px rgba(0,0,0,.6);
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); font-size:13.5px; min-height:100vh; }
.behind { position:fixed; inset:0; padding:26px 40px; filter:blur(2px) saturate(.85); opacity:.55; }
.behind .bar { height:34px; width:180px; border-radius:99px; background:var(--line); margin-bottom:18px; }
.behind .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; }
.behind .hd { padding:12px 18px; border-bottom:1px solid var(--line); font-weight:650; }
.behind .ln { padding:0 18px; height:44px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); color:var(--text-3); font-size:12.5px; }
.behind .ln:last-child { border:none; } .behind .sq { width:26px; height:26px; border-radius:7px; flex:none; }
.scrim { position:fixed; inset:0; background:rgba(20,28,25,.4); }
[data-theme="dark"] .scrim { background:rgba(0,0,0,.6); }
.prop-bar { position:fixed; left:16px; bottom:14px; z-index:99; display:flex; gap:8px; }
.prop-bar a { font-size:12px; padding:6px 12px; border-radius:var(--r-full); background:var(--card); border:1px solid var(--line); color:var(--text-2); text-decoration:none; }
.prop-bar a.on { background:linear-gradient(135deg,#0E766E,#12897C); color:#fff; border-color:transparent; }
.theme-t { position:fixed; right:16px; bottom:14px; z-index:99; font-size:12px; padding:6px 12px; border-radius:var(--r-full); background:var(--card); border:1px solid var(--line); color:var(--text-2); cursor:pointer; }
.sw { position:fixed; top:14px; right:16px; z-index:99; display:flex; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:2px; }
.sw button { border:none; background:none; font-size:12px; color:var(--text-2); padding:5px 11px; border-radius:6px; cursor:pointer; }
.sw button.on { background:var(--primary-bg); color:var(--primary-dark); font-weight:600; box-shadow:inset 0 0 0 1px var(--primary-border); }
.stage { position:fixed; inset:0; display:grid; place-items:center; z-index:5; }

/* ============ 弹窗: 卷首账目 ============ */
.dlg { width:560px; max-width:calc(100vw - 48px); max-height:calc(100vh - 64px); overflow-y:auto; background:var(--card); border-radius:16px; box-shadow:var(--shadow); position:relative; }
.close { position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:50%; border:none; background:var(--bg-hover); color:var(--text-3); font-size:15px; cursor:pointer; display:grid; place-items:center; z-index:3; }
.close:hover { background:var(--primary-bg); color:var(--primary-dark); }
/* 卷首: 姓用大字, 称谓做眉 —— 档案卷头, 无图片无头像 */
.head { padding:26px 28px 0; }
.head .kicker { font-size:12px; color:var(--text-3); }
.head .kicker b { font-weight:600; color:var(--text-2); }
.head h2 { font-size:34px; font-weight:750; letter-spacing:.04em; line-height:1.15; margin-top:4px; display:flex; align-items:baseline; gap:12px; }
.head h2 .en { font-family:var(--mono); font-size:11px; font-weight:400; color:var(--text-4); letter-spacing:.1em; }
.head .bar { display:flex; align-items:center; gap:8px; margin-top:10px; }
.tag { font-size:11.5px; padding:2.5px 10px; border-radius:var(--r-full); background:var(--bg); border:1px solid var(--line); color:var(--text-2); }
.tag.t { background:var(--primary-bg); border-color:var(--primary-border); color:var(--primary-dark); font-weight:600; }
.tag.no { color:var(--text-4); border-style:dashed; background:none; }
.head .fno { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--text-4); }
/* 项目卷带: 名字下方一条色带 = 挂在哪几卷 */
.pjband { display:flex; gap:6px; margin:16px 28px 0; flex-wrap:wrap; }
.pjchip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-2); background:var(--bg); border:1px solid var(--line); border-radius:var(--r-full); padding:3.5px 11px 3.5px 8px; }
[data-theme="dark"] .pjchip { background:#171B18; }
.pjchip .dot { width:8px; height:8px; border-radius:50%; flex:none; }
/* 账目区: 两栏 dl, 基线对齐账目感 */
.ledger { margin:20px 28px 0; padding:2px 0; columns:2; column-gap:28px; }
.li { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); break-inside:avoid; align-items:baseline; }
.li .k { font-size:12px; color:var(--text-3); flex:none; }
.li .dots { flex:1; border-bottom:1px dotted var(--line-2); transform:translateY(-4px); min-width:12px; }
.li .v { font-size:13px; color:var(--text); text-align:right; word-break:break-all; max-width:62%; }
.li .v.mono { font-family:var(--mono); font-size:12px; }
.li .v.dim { color:var(--text-4); }
.li .v.big { font-family:var(--mono); font-size:15px; font-weight:650; color:var(--primary-dark); }
/* 简介块 */
.bio { margin:18px 28px 0; background:var(--bg); border-radius:var(--r-lg); padding:14px 16px; }
[data-theme="dark"] .bio { background:#171B18; }
.bio .k { font-size:11.5px; color:var(--text-3); margin-bottom:5px; }
.bio p { font-size:12.5px; color:var(--text-2); line-height:1.85; }
/* 技能 */
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { font-size:11.5px; color:var(--text-2); border:1px solid var(--line-2); border-radius:var(--r-full); padding:2.5px 11px; }
.acts { display:flex; gap:8px; padding:20px 28px 26px; }
.btn { font-size:12.5px; padding:8px 18px; border-radius:var(--r-md); border:1px solid var(--line-2); background:var(--card); color:var(--text-2); cursor:pointer; }
.btn.main { background:linear-gradient(135deg,#0E766E,#12897C); border-color:transparent; color:#fff; font-weight:600; }
.btn:hover { border-color:var(--primary-border); color:var(--primary-dark); } .btn.main:hover { color:#fff; }
</style>
</head>
<body>
<div class="behind">
  <div class="bar"></div>
  <div class="card"><div class="hd">黑臭水体无药剂低能耗治理 · 7 人</div>
    <div class="ln"><span class="sq" style="background:#2F5D8A"></span>赵航佳 · 博二 · 黑臭水体治理</div>
    <div class="ln"><span class="sq" style="background:#3E7A52"></span>胡小琪 · 研三</div>
    <div class="ln"><span class="sq" style="background:#B07C24"></span>贾琦 · 大四 · 表面清洗</div></div>
</div>
<div class="scrim"></div>
<div class="sw"><button class="on" onclick="pick(0)">赵航佳</button><button onclick="pick(1)">王天志</button></div>
<div class="theme-t" onclick="flip()">深色 / 浅色</div>
<div class="stage"><div class="dlg" id="dlg"></div></div>

<div class="prop-bar">
  <a href="index.html">总览</a><a href="A-band.html">A 色带档案</a><a href="B-card.html">B 名片面</a><a href="C-drawer.html">C 侧抽屉</a><a class="on" href="D-ledger.html">D 卷首账目</a>
</div>

<script>
const MEMBERS = [
  { n:'赵航佳', pinyin:'ZHAO Hangjia', id:2, grade:'博二', title:'博士', dir:'黑臭水体治理',
    email:'zhaohangjia@tju.edu.cn', phone:'', bio:'围绕微纳米气泡在黑臭水体治理中的应用开展研究，重点关注微纳米气泡与底泥-水界面污染物之间的相互作用机制。',
    skills:['臭氧微纳米气泡','底泥-水界面','污染物去除'], vp:0, vpAt:'', meet:14, pj:[['黑臭水体无药剂低能耗治理','#2F5D8A']] },
  { n:'王天志', pinyin:'WANG Tianzhi', id:1, grade:'副教授', title:'导师', dir:'微纳米气泡技术与应用',
    email:'wangtz@tju.edu.cn', phone:'138****0021', bio:'课题组负责人，微纳米气泡发生装置与水体修复方向。',
    skills:['项目管理','气泡生成','水处理','曝气设备'], vp:121, vpAt:'2026-08-14', meet:236,
    pj:[['导师组','#0E766E'],['黑臭水体无药剂低能耗治理','#2F5D8A'],['气泡成核过程调控与设备研发','#7C4E96']] },
];
let cur = 0;
function render() {
  const m = MEMBERS[cur];
  dlg.innerHTML = `
    <button class="close">×</button>
    <div class="head">
      <div class="kicker"><b>${m.title}</b> · ${m.grade} · 研究方向 ${m.dir}</div>
      <h2>${m.n}<span class="en">${m.pinyin}</span></h2>
      <div class="bar">
        <span class="tag t">${m.vp?`声纹 ${m.vp} 段`:'声纹未录入'}</span>
        <span class="tag ${m.vp?'':'no'}">${m.vp?`最近采样 ${m.vpAt}`:'组会发言不能自动标名'}</span>
        <span class="fno">档案 NO.${String(m.id).padStart(3,'0')}</span>
      </div>
    </div>
    <div class="pjband">${m.pj.map(([p,c])=>`<span class="pjchip"><span class="dot" style="background:${c}"></span>${p}</span>`).join('')}</div>
    <div class="ledger">
      <div class="li"><span class="k">手机</span><span class="dots"></span><span class="v mono ${m.phone?'':'dim'}">${m.phone||'未登记'}</span></div>
      <div class="li"><span class="k">邮箱</span><span class="dots"></span><span class="v mono">${m.email}</span></div>
      <div class="li"><span class="k">参会发言</span><span class="dots"></span><span class="v big">${m.meet}</span></div>
      <div class="li"><span class="k">声纹采样</span><span class="dots"></span><span class="v big">${m.vp||'—'}</span></div>
      <div class="li"><span class="k">在研卷数</span><span class="dots"></span><span class="v big">${m.pj.length}</span></div>
      <div class="li"><span class="k">技能标签</span><span class="dots"></span><span class="v mono">${m.skills.length}</span></div>
    </div>
    <div class="bio"><div class="k">个人简介</div><p>${m.bio}</p></div>
    <div style="margin:16px 28px 0"><div class="chips">${m.skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div></div>
    <div class="acts"><button class="btn main">${m.vp?'重新录入声纹':'录入声纹'}</button><button class="btn">查看相关会议</button><button class="btn">编辑资料</button></div>`;
}
function pick(i){ cur=i; document.querySelectorAll('.sw button').forEach((b,k)=>b.classList.toggle('on',k===i)); render(); }
function flip(){ const el=document.documentElement; el.getAttribute('data-theme')==='dark'?el.removeAttribute('data-theme'):el.setAttribute('data-theme','dark'); }
render();
</script>
</body>
</html>
