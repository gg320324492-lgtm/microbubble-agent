<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>A · 空化 — 全黑仪器登录</title>
<style>
  :root {
    --bg: #0b1315;
    --panel: rgba(22, 34, 38, 0.78);
    --line: #2b4145;
    --line-soft: rgba(126, 214, 173, 0.16);
    --text: #e9f2f0;
    --muted: #93aaa7;
    --faint: #627976;
    --green: #7ed6ad;
    --cyan: #78cbd0;
    --amber: #e9b867;
    --font-ui: 'PingFang SC', 'Microsoft YaHei', Inter, sans-serif;
    --font-mono: Consolas, 'SFMono-Regular', 'Liberation Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  /* ambient depth light */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(900px 600px at 82% -8%, rgba(25, 142, 131, 0.16), transparent 62%),
      radial-gradient(700px 520px at 8% 108%, rgba(120, 203, 208, 0.10), transparent 60%);
  }

  /* ── signature: rising microbubble field ─────────────── */
  .field { position: fixed; inset: 0; pointer-events: none; }
  .b {
    position: absolute;
    bottom: -12vh;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, rgba(233, 242, 240, 0.30), rgba(126, 214, 173, 0.10) 55%, rgba(126, 214, 173, 0.02) 70%);
    border: 1px solid rgba(186, 226, 216, 0.16);
    animation: rise linear infinite;
    opacity: 0;
  }
  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0); opacity: 0; }
    8%   { opacity: 0.9; }
    50%  { transform: translate3d(14px, -55vh, 0); }
    92%  { opacity: 0.65; }
    100% { transform: translate3d(-6px, -118vh, 0); opacity: 0; }
  }
  .b:nth-child(1)  { left: 6%;  width: 7px;  height: 7px;  animation-duration: 17s; animation-delay: -2s; }
  .b:nth-child(2)  { left: 13%; width: 3px;  height: 3px;  animation-duration: 13s; animation-delay: -7s; }
  .b:nth-child(3)  { left: 21%; width: 12px; height: 12px; animation-duration: 21s; animation-delay: -12s; filter: blur(0.4px); }
  .b:nth-child(4)  { left: 29%; width: 4px;  height: 4px;  animation-duration: 15s; animation-delay: -4s; }
  .b:nth-child(5)  { left: 38%; width: 8px;  height: 8px;  animation-duration: 19s; animation-delay: -15s; }
  .b:nth-child(6)  { left: 47%; width: 2.5px; height: 2.5px; animation-duration: 11s; animation-delay: -1s; }
  .b:nth-child(7)  { left: 55%; width: 16px; height: 16px; animation-duration: 26s; animation-delay: -9s; filter: blur(1px); opacity: 0.7; }
  .b:nth-child(8)  { left: 63%; width: 5px;  height: 5px;  animation-duration: 14s; animation-delay: -6s; }
  .b:nth-child(9)  { left: 71%; width: 9px;  height: 9px;  animation-duration: 20s; animation-delay: -17s; }
  .b:nth-child(10) { left: 79%; width: 3px;  height: 3px;  animation-duration: 12s; animation-delay: -3s; }
  .b:nth-child(11) { left: 86%; width: 11px; height: 11px; animation-duration: 23s; animation-delay: -11s; filter: blur(0.6px); }
  .b:nth-child(12) { left: 93%; width: 6px;  height: 6px;  animation-duration: 16s; animation-delay: -8s; }
  .b.big {
    width: 130px; height: 130px; left: 4%; bottom: -22vh;
    animation-duration: 40s; animation-delay: -6s;
    background: radial-gradient(circle at 34% 28%, rgba(233, 242, 240, 0.10), rgba(126, 214, 173, 0.05) 60%, transparent 72%);
    border-color: rgba(186, 226, 216, 0.10);
    filter: blur(0.8px);
  }
  .b.big2 { left: 88%; width: 84px; height: 84px; animation-duration: 34s; animation-delay: -22s; }

  /* ── shell ────────────────────────────────────────────── */
  .shell {
    position: relative;
    z-index: 2;
    width: min(980px, calc(100vw - 96px));
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 72px;
    align-items: center;
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
  .brand__mark {
    display: grid; place-items: center;
    width: 34px; height: 34px;
    border: 1px solid var(--line-soft); border-radius: 9px;
    color: var(--green); font-size: 19px; line-height: 1;
    background: rgba(126, 214, 173, 0.06);
  }
  .brand__name { font-size: 13px; font-weight: 700; letter-spacing: 0.10em; color: var(--muted); }

  .kicker {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--cyan); margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(30px, 2.9vw, 40px);
    line-height: 1.16; letter-spacing: -0.02em; font-weight: 700;
    margin-bottom: 18px;
  }
  h1 em { font-style: normal; color: var(--green); }
  .lede { max-width: 380px; color: var(--muted); font-size: 14.5px; line-height: 1.8; }

  /* sonication waveform — signature accent */
  .wave { margin-top: 36px; height: 42px; overflow: hidden; opacity: 0.75;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  .wave svg { width: 400%; height: 42px; animation: scroll 9s linear infinite; }
  @keyframes scroll { to { transform: translateX(-50%); } }
  .wave__label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.16em; color: var(--faint); margin-top: 2px; }

  /* ── instrument panel (form) ──────────────────────────── */
  .panel {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(233, 242, 240, 0.05);
    padding: 34px 34px 28px;
  }
  .panel::before {
    content: '';
    position: absolute; top: 0; left: 28px; right: 28px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(126, 214, 173, 0.55), transparent);
  }
  .panel__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 26px; }
  .panel__head h2 { font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.10em;
    color: var(--green);
    border: 1px solid rgba(126, 214, 173, 0.35); border-radius: 999px;
    padding: 4px 10px; background: rgba(126, 214, 173, 0.07);
  }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  label {
    display: block;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--faint); margin: 18px 0 8px;
  }
  label:first-of-type { margin-top: 0; }
  .input { position: relative; }
  .input input {
    width: 100%; height: 46px;
    border: 1px solid var(--line); border-radius: 10px;
    background: rgba(11, 19, 21, 0.6);
    color: var(--text); font: inherit; font-size: 14.5px;
    padding: 0 14px;
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }
  .input input::placeholder { color: #4d6360; }
  .input input:focus { outline: 0; border-color: rgba(126, 214, 173, 0.6); box-shadow: 0 0 0 3px rgba(126, 214, 173, 0.14); }
  .input__key {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-family: var(--font-mono); font-size: 10px; color: #4d6360;
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px;
  }

  button {
    width: 100%; height: 50px; margin-top: 28px;
    border: 0; border-radius: 11px; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0.04em;
    color: #08120f;
    background: linear-gradient(180deg, #8fe0b9, var(--green));
    box-shadow: 0 10px 26px rgba(126, 214, 173, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    transition: transform 140ms ease, box-shadow 140ms ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(126, 214, 173, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .panel__foot {
    display: flex; gap: 18px; margin-top: 22px; padding-top: 16px;
    border-top: 1px dashed var(--line);
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; color: var(--faint);
  }
  .panel__foot b { color: var(--muted); font-weight: 400; }

  .legal {
    position: fixed; bottom: 22px; left: 0; right: 0; z-index: 2;
    text-align: center; font-family: var(--font-mono);
    font-size: 10.5px; letter-spacing: 0.14em; color: #3d524f;
  }

  @media (prefers-reduced-motion: reduce) {
    .b, .wave svg, .chip i { animation: none; }
    .b { opacity: 0.5; }
  }
  @media (max-width: 880px) {
    .shell { grid-template-columns: 1fr; gap: 40px; width: calc(100vw - 56px); }
    .identity { order: 2; }
  }
</style>
</head>
<body>
  <div class="field" aria-hidden="true">
    <span class="b"></span><span class="b"></span><span class="b"></span><span class="b"></span>
    <span class="b"></span><span class="b"></span><span class="b"></span><span class="b"></span>
    <span class="b"></span><span class="b"></span><span class="b"></span><span class="b"></span>
    <span class="b big"></span><span class="b big2"></span>
  </div>

  <main class="shell">
    <section class="identity">
      <div class="brand">
        <span class="brand__mark">∿</span>
        <span class="brand__name">MICROBUBBLE LAB · 微纳米气泡课题组</span>
      </div>
      <p class="kicker">Scientific Research OS</p>
      <h1>实验产生的气泡，<br>在这里<em>沉淀为知识</em>。</h1>
      <p class="lede">超声空化、气泡分布、会议记录与公式推导——课题组的全部研究现场，收进一台离线可用的本地工作台。</p>
      <div class="wave" aria-hidden="true">
        <svg viewBox="0 0 1600 42" preserveAspectRatio="none">
          <path d="M0 21 Q20 3 40 21 T80 21 Q90 13 100 21 T120 21 L140 21 Q160 39 180 21 T220 21 Q230 9 240 21 T260 21 L300 21 Q320 5 340 21 T380 21 Q395 33 410 21 T440 21 L480 21 Q500 2 520 21 T560 21 Q570 15 580 21 T600 21 L620 21 Q640 38 660 21 T700 21 Q715 8 730 21 T760 21 L800 21"
            fill="none" stroke="rgba(126,214,173,0.55)" stroke-width="1.4"/>
          <path transform="translate(800,0)" d="M0 21 Q20 3 40 21 T80 21 Q90 13 100 21 T120 21 L140 21 Q160 39 180 21 T220 21 Q230 9 240 21 T260 21 L300 21 Q320 5 340 21 T380 21 Q395 33 410 21 T440 21 L480 21 Q500 2 520 21 T560 21 Q570 15 580 21 T600 21 L620 21 Q640 38 660 21 T700 21 Q715 8 730 21 T760 21 L800 21"
            fill="none" stroke="rgba(126,214,173,0.55)" stroke-width="1.4"/>
        </svg>
      </div>
      <p class="wave__label">20 kHz · CAVITATION STANDING WAVE</p>
    </section>

    <section class="panel" aria-labelledby="t">
      <div class="panel__head">
        <h2 id="t">身份验证</h2>
        <span class="chip"><i></i>LOCAL NODE ONLINE</span>
      </div>
      <form onsubmit="return false">
        <label for="u">用户名</label>
        <div class="input"><input id="u" type="text" placeholder="researcher_01" autocomplete="username"></div>

        <label for="p">密码</label>
        <div class="input">
          <input id="p" type="password" placeholder="••••••••" autocomplete="current-password">
          <span class="input__key">本地校验</span>
        </div>

        <button type="submit">进入工作台</button>
      </form>
      <div class="panel__foot">
        <span>DATA <b>仅存本机</b></span>
        <span>ACCOUNT <b>管理员创建</b></span>
        <span>NET <b>离线可用</b></span>
      </div>
    </section>
  </main>

  <p class="legal">MICROBUBBLE LAB — LOCAL RESEARCH TERMINAL — ALL DATA STAYS ON THIS MACHINE</p>
</body>
</html>
