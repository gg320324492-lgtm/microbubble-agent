<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>B · 实验台 — 个人设置</title>
<style>
  :root {
    --bg: #eef1ef;
    --panel: #fbfcfb;
    --ink: #1c2b31;
    --teal: #0e766e;
    --ok: #2e9e7b;
    --amber: #d99a3d;
    --line: #cfdad5;
    --muted: #637571;
    --font-ui: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: Consolas, 'SFMono-Regular', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      repeating-linear-gradient(0deg, rgba(14,118,110,0.05) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(14,118,110,0.05) 0 1px, transparent 1px 28px),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 36px clamp(18px, 3.5vw, 48px) 90px; }

  /* ── 顶部: 仪器铭牌 ─────────────────────── */
  .badge {
    background: var(--ink); color: #e8f1ee;
    border-radius: 14px; padding: 22px 28px;
    display: flex; align-items: center; gap: 20px;
    box-shadow: 0 16px 40px rgba(16, 30, 35, 0.25);
  }
  .badge__mark {
    width: 46px; height: 46px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    border: 1px solid rgba(126, 214, 173, 0.5); color: #7ed6ad; font-size: 22px;
    background: rgba(126, 214, 173, 0.08);
  }
  .badge__id b { font-size: 17px; letter-spacing: 0.02em; }
  .badge__id small { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; color: #7e948f; margin-top: 4px; }
  .badge__meta { margin-left: auto; text-align: right; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.16em; color: #7e948f; }
  .badge__meta b { display: block; font-size: 13px; color: #7ed6ad; margin-top: 3px; }

  /* ── 模块面板 ───────────────────────────── */
  .modules { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 24px; }
  .mod {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 22px 22px;
  }
  .mod--wide { grid-column: 1 / -1; }
  .mod__head {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.2em; color: var(--muted);
    padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
  }
  .mod__head .led {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 6px var(--ok);
  }
  .mod__head b { color: var(--ink); font-size: 12px; letter-spacing: 0.14em; }
  .mod__head .code { margin-left: auto; color: var(--teal); }

  /* 行式布局 (标签在左) */
  .row { display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: center; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .row > label { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
  .row .io {
    width: 100%; height: 42px; border: 1px solid #c3d0cb; border-radius: 9px;
    background: #fff; padding: 0 12px; font: inherit; font-size: 14px; color: var(--ink);
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .row .io:focus { outline: 0; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(14, 118, 110, 0.12); }
  .row .io::placeholder { color: #a9b6b2; font-size: 13px; }
  textarea.io { height: auto; min-height: 68px; padding: 10px 12px; resize: vertical; }

  /* 仪器拨杆 */
  .lever { position: relative; width: 48px; height: 24px; flex: none; }
  .lever input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .lever .track {
    position: absolute; inset: 0; border: 1.5px solid #b7c6c1; border-radius: 999px; background: #fff;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .lever .track::after {
    content: ''; position: absolute; top: 3px; left: 4px; width: 14px; height: 14px; border-radius: 50%;
    background: #b7c6c1; transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), background 180ms ease;
  }
  .lever input:checked + .track { border-color: var(--teal); background: rgba(14, 118, 110, 0.1); }
  .lever input:checked + .track::after { transform: translateX(22px); background: var(--teal); }
  .lever input:focus-visible + .track { outline: 2px solid var(--teal); outline-offset: 3px; }

  .btn {
    height: 44px; padding: 0 26px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--teal); color: #fff; font: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: 0.06em; transition: transform 140ms ease, background 140ms ease;
  }
  .btn:hover { background: #0c665f; transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .btn-ghost:hover { background: #fff; color: var(--ink); }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }

  /* 恢复码 */
  .recover { border: 1px dashed #b7c6c1; border-radius: 10px; padding: 14px 16px; margin-top: 16px; display: flex; gap: 16px; align-items: center; }
  .recover b { font-size: 13px; }
  .recover .st { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em; color: var(--amber); border: 1px solid var(--amber); border-radius: 999px; padding: 1px 8px; margin-left: 8px; }
  .recover p { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.7; }
  .recover .btn-ghost { margin-left: auto; flex: none; height: 38px; padding: 0 18px; }

  /* 外观 swatch */
  .theme-grid { display: flex; gap: 12px; flex-wrap: wrap; }
  .sw {
    width: 118px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
    padding: 12px; cursor: pointer; font: inherit; text-align: left;
    transition: border-color 150ms ease, transform 150ms ease; position: relative;
  }
  .sw:hover { border-color: var(--teal); transform: translateY(-2px); }
  .sw .bar { height: 30px; border-radius: 6px; margin-bottom: 8px; }
  .sw b { font-size: 12.5px; }
  .sw small { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; color: var(--muted); margin-top: 2px; }
  .sw.on { border: 1.5px solid var(--teal); box-shadow: 0 0 0 3px rgba(14, 118, 110, 0.12); }
  .sw.on::after { content: '●'; position: absolute; top: 7px; right: 9px; font-size: 9px; color: var(--teal); }

  @media (max-width: 920px) { .modules { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="badge">
    <span class="badge__mark">∿</span>
    <div class="badge__id">
      <b>杜同贺 · 管理员</b>
      <small>LAB-WS-01 · 科研工作台</small>
    </div>
    <div class="badge__meta">STATUS<b>● SYSTEMS NOMINAL</b></div>
  </header>

  <div class="modules">
    <section class="mod mod--wide">
      <div class="mod__head"><span class="led"></span><b>个人资料</b><span class="code">MOD-01 / PROFILE</span></div>
      <div class="row"><label>姓名</label><input class="io" value="杜同贺"></div>
      <div class="row"><label>邮箱</label><input class="io" value="320324492@qq.com"></div>
      <div class="row"><label>电话</label><input class="io" value="18031816670"></div>
      <div class="row"><label>研究方向</label><input class="io" value="污染控制与水质提升"></div>
      <div class="row"><label>个人简介</label><textarea class="io">围绕污染控制与水质提升，开展微纳米气泡强化工艺研究与数据分析</textarea></div>
      <div class="btn-row">
        <button class="btn">保存资料</button>
        <button class="btn btn-ghost">重置</button>
        <button class="btn btn-ghost" style="margin-left:auto">更换头像</button>
      </div>
    </section>

    <section class="mod">
      <div class="mod__head"><span class="led"></span><b>账号安全</b><span class="code">MOD-02 / SECURITY</span></div>
      <div class="row"><label>旧密码</label><input class="io" type="password" placeholder="请输入旧密码"></div>
      <div class="row"><label>新密码</label><input class="io" type="password" placeholder="至少 6 位"></div>
      <div class="row"><label>确认密码</label><input class="io" type="password" placeholder="再次输入新密码"></div>
      <div class="btn-row"><button class="btn">修改密码</button></div>
      <div class="recover">
        <div>
          <b>密码恢复码</b><span class="st">未生成</span>
          <p>忘记密码时，在登录页输入「用户名 + 恢复码 + 新密码」即可自助重置，无需联系管理员。恢复码只在生成时显示一次，请立即保存到微信收藏；重置成功后即失效。</p>
        </div>
        <button class="btn btn-ghost">生成</button>
      </div>
    </section>

    <section class="mod">
      <div class="mod__head"><span class="led"></span><b>通知偏好</b><span class="code">MOD-03 / NOTIFY</span></div>
      <div class="row"><label>每日提醒</label>
        <div style="display:flex;align-items:center;gap:14px">
          <label class="lever"><input type="checkbox" checked><span class="track"></span></label>
          <span style="font-size:12px;color:var(--muted)">关闭后将不再推送任何提醒</span>
        </div>
      </div>
      <div class="row"><label>推送时间</label>
        <div style="display:flex;align-items:center;gap:12px">
          <input class="io" style="width:96px" value="11:00">
          <span style="font-size:12px;color:var(--muted)">北京时间 · 每日一次</span>
        </div>
      </div>
    </section>

    <section class="mod">
      <div class="mod__head"><span class="led"></span><b>外观主题</b><span class="code">MOD-04 / THEME</span></div>
      <div class="row"><label>深色模式</label>
        <div style="display:flex;align-items:center;gap:14px">
          <label class="lever"><input type="checkbox"><span class="track"></span></label>
          <span style="font-size:12px;color:var(--muted)">也可在顶栏 ☀️ / 🌙 切换</span>
        </div>
      </div>
      <div class="row"><label>主题色</label>
        <div class="theme-grid">
          <button class="sw on"><span class="bar" style="background:linear-gradient(120deg,#FF7A5C,#FFB347)"></span><b>活力橙</b><small>DEFAULT</small></button>
          <button class="sw"><span class="bar" style="background:linear-gradient(120deg,#4A90E2,#6BABFF)"></span><b>海蓝</b><small>OCEAN</small></button>
          <button class="sw"><span class="bar" style="background:linear-gradient(120deg,#4CAF50,#66BB6A)"></span><b>森林绿</b><small>FOREST</small></button>
        </div>
      </div>
    </section>
  </div>
</div>
</body>
</html>
