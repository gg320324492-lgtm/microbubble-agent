<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议详情顶端重做 · 方案D 极简单行</title>
<style>
  :root {
    --paper: #f4f6f4; --card: #fdfefc; --ink: #16232a;
    --teal: #0e766e; --coral: #ef7256;
    --line: #cdd8d4; --line-dash: #b9c9c5; --muted: #5f6f6b;
    --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    --font-mono: Consolas, 'SFMono-Regular', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-serif); font-size: 14px; line-height: 1.7; padding: 32px 24px 80px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .pv-head { margin-bottom: 22px; }
  .pv-head .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .3em; color: var(--teal); border: 1px solid var(--line-dash); display: inline-block; padding: 2px 10px; margin-bottom: 8px; background: var(--card); border-radius: 2px; }
  .pv-head h1 { font-size: 21px; font-weight: 700; }
  .pv-head p { color: var(--muted); font-size: 13px; }

  /* ── 方案D: 全信息单行 ── */
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 13px 18px; }
  .hero-line { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .back { font-family: var(--font-mono); font-size: 10px; letter-spacing: .15em; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .no { font-family: var(--font-mono); font-size: 10px; color: var(--teal); white-space: nowrap; }
  .title { font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stamp { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; border: 1px solid var(--teal); color: var(--teal); border-radius: 2px; padding: 1px 8px; white-space: nowrap; }
  .meta { display: flex; gap: 13px; margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .avs { display: flex; }
  .av { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--card); display: grid; place-items: center; font-size: 9px; color: #fff; margin-left: -6px; }
  .av:first-child { margin-left: 0; }
  .av.a { background: #41564f; } .av.b { background: #6b8787; } .av.c { background: #8fa5a0; }
  .ico-act { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 3px; background: var(--card); display: grid; place-items: center; font-size: 12px; cursor: pointer; color: var(--muted); }
  .ico-act:hover { color: var(--teal); border-color: var(--teal); }
  .ico-act.danger:hover { color: #c0564a; border-color: rgba(239,114,86,.5); }

  /* 第二行: 头像组 (悬停浮现完整名单, 默认并入第一行尾部) */
  .hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 9px; padding-left: 2px; }
  .hero-sub .lbl { font-family: var(--font-mono); font-size: 9px; letter-spacing: .25em; color: var(--muted); }
  .hero-sub .names { font-size: 12px; color: var(--muted); }
  .avs2 { display: flex; }
  .av2 { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; color: #fff; background: #41564f; margin-right: -4px; border: 1.5px solid var(--paper); }

  .player { display: flex; align-items: center; gap: 13px;
    border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line);
    padding: 10px 4px; margin-top: 14px; background: transparent; }
  .player .play { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ink);
    background: transparent; color: var(--ink); display: grid; place-items: center; font-size: 10px; cursor: pointer;
    transition: all .15s ease-out; }
  .player .play:hover { background: var(--ink); color: var(--paper); }
  .player .tm { font-family: var(--font-mono); font-size: 11px; }
  .player .sep { opacity: .4; margin: 0 2px; }
  .player .track { flex: 1; height: 3px; background: var(--paper); border: 1px solid var(--line); border-radius: 2px; position: relative; }
  .player .track i { position: absolute; left: 0; top: 0; height: 100%; width: 10%; background: var(--ink); border-radius: 2px; }
  .player .note { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="pv-head">
    <span class="tag">MEETING HERO · REDESIGN 方案D</span>
    <h1>方案D · 极简单行</h1>
    <p>全部信息压进一行：返回 | 编号 | 标题 | 状态戳 | 时间/地点/时长 | 头像组 | 编辑/删除图标钮。头像与次要信息悬停浮现。竖向压缩到极致，给下方内容让出最大空间。</p>
  </div>

  <div class="hero">
    <div class="hero-line">
      <a class="back" href="#">← 返回</a>
      <span class="no">#247</span>
      <span class="title">关于超材料与原子层面构造及变换模式理论的讨论</span>
      <span class="stamp">已完成</span>
      <div class="meta">
        <span>2026-08-21 10:44</span><span>📍 未设置</span><span>⏱ 3分23秒</span>
      </div>
      <div class="avs">
        <span class="av a">王</span><span class="av b">杜</span><span class="av c">陈</span>
      </div>
      <span class="ico-act" title="编辑">✎</span>
      <span class="ico-act danger" title="删除">🗑</span>
    </div>
    <div class="hero-sub">
      <span class="lbl">PARTICIPANTS</span>
      <div class="avs2"><span class="av2">王</span><span class="av2">杜</span><span class="av2">陈</span></div>
      <span class="names">王天志 · 杜同贺 · 陈金薪</span>
    </div>
  </div>

  <div class="player">
    <span class="play">▶</span>
    <span class="tm">00:00 <span class="sep">/</span> 03:23</span>
    <div class="track"><i style="width: 10%; background: var(--ink);"></i></div>
    <span class="note">时间戳点击 seek</span>
  </div>
</div>
</body>
</html>
