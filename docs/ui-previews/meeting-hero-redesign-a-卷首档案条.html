<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议详情顶端重做 · 方案A 卷首档案条</title>
<style>
  :root {
    --paper: #f4f6f4; --card: #fdfefc; --ink: #16232a;
    --teal: #0e766e; --teal-soft: #198e83; --coral: #ef7256;
    --line: #cdd8d4; --line-dash: #b9c9c5; --muted: #5f6f6b;
    --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    --font-mono: Consolas, 'SFMono-Regular', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-serif); font-size: 14px; line-height: 1.7; padding: 32px 24px 80px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .pv-head { margin-bottom: 22px; }
  .pv-head .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .3em; color: var(--teal); border: 1px solid var(--line-dash); display: inline-block; padding: 2px 10px; margin-bottom: 8px; background: var(--card); border-radius: 2px; }
  .pv-head h1 { font-size: 21px; font-weight: 700; }
  .pv-head p { color: var(--muted); font-size: 13px; }

  /* ── 方案A: 单行紧凑档案条 ── */
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 14px 20px; }
  .hero-r1 { display: flex; align-items: center; gap: 14px; }
  .back { font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .back:hover { color: var(--teal); }
  .no { font-family: var(--font-mono); font-size: 10px; color: var(--teal); letter-spacing: .15em; white-space: nowrap; }
  .title { font-size: 18px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stamp { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; border: 1px solid var(--teal); color: var(--teal); border-radius: 2px; padding: 1px 9px; white-space: nowrap; }
  .acts { margin-left: auto; display: flex; gap: 8px; }
  .act { font-size: 12px; padding: 5px 14px; border-radius: 3px; border: 1px solid var(--line); background: var(--card); cursor: pointer; white-space: nowrap; }
  .act:hover { border-color: var(--teal); color: var(--teal); }
  .act.pri { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .act.danger { color: #c0564a; border-color: rgba(239,114,86,.5); }
  .hero-r2 { display: flex; align-items: center; gap: 18px; margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line-dash); }
  .meta { display: flex; gap: 16px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .avs { display: flex; }
  .av { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--card); display: grid; place-items: center; font-size: 10px; color: #fff; margin-left: -6px; }
  .av:first-child { margin-left: 0; }
  .av.a { background: #41564f; } .av.b { background: #6b8787; } .av.c { background: #8fa5a0; }

  /* 播放条 (衔接示意) */
  .player { display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 16px; margin-top: 12px; }
  .player .play { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--teal);
    background: transparent; color: var(--teal); display: grid; place-items: center; font-size: 11px; cursor: pointer;
    transition: all .15s ease-out; }
  .player .play:hover { background: var(--teal); color: #fff; }
  .player .tm { font-family: var(--font-mono); font-size: 11.5px; }
  .player .sep { opacity: .4; margin: 0 2px; }
  .player .track { flex: 1; height: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 2px; position: relative; }
  .player .track i { position: absolute; left: 0; top: 0; height: 100%; width: 10%; background: var(--teal); border-radius: 2px; }
  .player .note { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="pv-head">
    <span class="tag">MEETING HERO · REDESIGN 方案A</span>
    <h1>方案A · 卷首档案条</h1>
    <p>标题/状态/动作一行, 元数据+头像第二行 (虚线分隔)。竖向最省 (两行高度), 播放条紧贴其下形成"档案条 + 设备条"的组合。</p>
  </div>

  <div class="hero">
    <div class="hero-r1">
      <a class="back" href="#">← 返回列表</a>
      <span class="no">MEETING #247</span>
      <span class="title">关于超材料与原子层面构造及变换模式理论的讨论</span>
      <span class="stamp">已完成</span>
      <div class="acts">
        <span class="act">✎ 编辑</span>
        <span class="act danger">删除</span>
      </div>
    </div>
    <div class="hero-r2">
      <div class="avs"><span class="av a">王</span><span class="av b">杜</span><span class="av c">陈</span></div>
      <div class="meta">
        <span>2026-08-21 10:44</span><span>📍 未设置</span><span>⏱ 3分23秒</span>
      </div>
    </div>
  </div>

  <div class="player">
    <span class="play">▶</span>
    <span class="tm">00:00 <span class="sep">/</span> 03:23</span>
    <div class="track"><i></i></div>
    <span class="note">时间戳点击 seek</span>
  </div>
</div>
</body>
</html>
