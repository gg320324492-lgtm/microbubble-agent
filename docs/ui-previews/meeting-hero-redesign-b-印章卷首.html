<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议详情顶端重做 · 方案B 印章卷首</title>
<style>
  :root {
    --paper: #f4f6f4; --card: #fdfefc; --ink: #16232a;
    --teal: #0e766e; --coral: #ef7256;
    --line: #cdd8d4; --line-dash: #b9c9c5; --muted: #5f6f6b;
    --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    --font-mono: Consolas, 'SFMono-Regular', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-serif); font-size: 14px; line-height: 1.7; padding: 32px 24px 80px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .pv-head { margin-bottom: 22px; }
  .pv-head .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .3em; color: var(--teal); border: 1px solid var(--line-dash); display: inline-block; padding: 2px 10px; margin-bottom: 8px; background: var(--card); border-radius: 2px; }
  .pv-head h1 { font-size: 21px; font-weight: 700; }
  .pv-head p { color: var(--muted); font-size: 13px; }

  /* ── 方案B: 大标题 + 竖排档案戳 + 收纳动作 ── */
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 24px 28px 20px; position: relative; }
  .hero .back { position: absolute; left: 20px; top: 22px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; color: var(--muted); text-decoration: none; }
  .hero-grid { display: flex; gap: 26px; padding-left: 90px; }
  .hero-main { flex: 1; min-width: 0; }
  .hero-main .kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: .35em; color: var(--teal); margin-bottom: 6px; }
  .hero-main .title { font-size: 23px; font-weight: 700; line-height: 1.45; letter-spacing: .02em; margin-bottom: 12px; }
  .hero-main .title .stamp { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; border: 1px solid var(--teal); color: var(--teal); border-radius: 2px; padding: 2px 10px; vertical-align: 6px; margin-left: 12px; font-weight: 400; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .avs { display: flex; }
  .av { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--card); display: grid; place-items: center; font-size: 11px; color: #fff; margin-left: -8px; }
  .av:first-child { margin-left: 0; }
  .av.a { background: #41564f; } .av.b { background: #6b8787; } .av.c { background: #8fa5a0; }

  /* 竖排档案戳 */
  .seal { flex: none; width: 74px; text-align: center; border: 1px solid var(--teal); border-radius: 3px; padding: 10px 0 8px; color: var(--teal); }
  .seal .big { font-size: 15px; font-weight: 700; letter-spacing: .3em; margin-left: .3em; font-family: var(--font-serif); }
  .seal .en { font-family: var(--font-mono); font-size: 8px; letter-spacing: .2em; opacity: .7; margin-top: 2px; }

  /* 动作收纳 */
  .menu { flex: none; align-self: flex-start; }
  .menu-btn { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); font-size: 15px; cursor: pointer; color: var(--muted); }
  .menu-pop { border: 1px solid var(--line); border-radius: 3px; background: var(--card); margin-top: 8px; overflow: hidden; font-size: 12.5px; }
  .menu-pop div { padding: 7px 16px; cursor: pointer; }
  .menu-pop div:hover { background: rgba(14,118,110,.06); }
  .menu-pop div.danger { color: #c0564a; }

  .player { margin-top: 14px; display: flex; align-items: center; gap: 14px;
    background: var(--ink); color: var(--paper); border-radius: 4px; padding: 11px 18px; }
  .player .play { width: 34px; height: 34px; border-radius: 50%; background: var(--coral); display: grid; place-items: center; }
  .player .tm { font-family: var(--font-mono); font-size: 12px; }
  .player .track { flex: 1; height: 4px; background: rgba(255,255,255,.18); border-radius: 2px; }
  .player .note { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,.55); }
</style>
</head>
<body>
<div class="wrap">
  <div class="pv-head">
    <span class="tag">MEETING HERO · REDESIGN 方案B</span>
    <h1>方案B · 印章卷首</h1>
    <p>大衬线标题为绝对主角, 右侧竖排「已完成」档案印章戳, 编辑/删除收进 ⋯ 下拉菜单。仪式感最强, 顶面最干净。</p>
  </div>

  <div class="hero">
    <a class="back" href="#">← 返回列表</a>
    <div class="hero-grid">
      <div class="hero-main">
        <div class="kicker">MEETING #247 · ARCHIVE</div>
        <div class="title">关于超材料与原子层面构造及变换模式理论的讨论<span class="stamp">已完成</span></div>
        <div class="meta">
          <span>🕒 2026-08-21 10:44</span><span>📍 未设置</span><span>⏱ 3分23秒</span>
        </div>
        <div class="avs"><span class="av a">王</span><span class="av b">杜</span><span class="av c">陈</span></div>
      </div>
      <div class="seal">
        <div class="big">已完成</div>
        <div class="en">COMPLETED</div>
      </div>
      <div class="menu">
        <button class="menu-btn">⋯</button>
        <div class="menu-pop">
          <div>✎ 编辑会议</div>
          <div class="danger">🗑 删除会议</div>
        </div>
      </div>
    </div>
  </div>

  <div class="player">
    <span class="play">▶</span>
    <span class="tm">00:00 / 03:23</span>
    <div class="track"></div>
    <span class="note">点击转录时间戳可 seek · 当前段自动高亮</span>
  </div>
</div>
</body>
</html>
