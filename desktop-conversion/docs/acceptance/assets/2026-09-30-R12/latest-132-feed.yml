releaseDate: '2026-09-29T18:08:05.744Z'
releaseNotes: |-
    （自动更新通知 · 更新日志直达 · 备份隐私加固）

    > 本版三项主打：① **自动更新通知**——有新版本弹窗直达（版本号 + 更新日志 + 一键更新），组员不再需要盯落地页 ② **备份隐私加固**——备份容器与解密钥匙仅本人可见，不再进入知识库与向量索引 ③ **云端附件恢复修复**——此前残缺的附件恢复已补齐。
    > 同时携带：备份失败原因落日志、Windows 应用身份统一（任务栏图标）、自动检查节流等收尾改进。

    ### 自动更新通知

    - 应用启动后**自动检查更新**（每日至多一次，不打扰；可在设置关闭）
    - 发现新版本时**弹窗提示**：新版本号 + **本次更新日志** + 「立即更新 / 稍后」
    - 「立即更新」一键完成下载（带进度）并重启安装；「稍后」同一版本 24h 内不再打扰
    - 更新日志正文来自课题组 CDN 更新源，**国内直连可达**，不依赖 GitHub
    - 下载/检查失败有明确提示，不阻塞主界面；设置页原有更新入口保持不变

    ### 备份隐私加固

    - 零感托管备份的**容器与解密钥匙改存到本账号私有目录**（`backups/`），服务端对保留区文件强制「仅本人可见」，不再出现在团队共享视图中
    - 备份上传保留**目录信息**：容器与钥匙落 `backups/<用户>/` 子目录（旧版本会丢目录信息落到根目录），清理策略按目录精确定位
    - 备份产物（`.mnbbak` / `.key.json`）**不再进入知识库**：不生成知识库条目、不进入语义检索与向量索引，避免钥匙内容被检索命中
    - 修正了自动入库时私有文件可见性被上调的问题：知识库条目现在继承来源文件的可见性
    - 备份文件**禁止公开分享与公开可见**（操作会被明确拒绝并提示原因）
    - **历史数据清理**：此前已产生的知识库条目与检索索引中的备份密钥明文已从数据库移除（本机数据库升级时自动执行）
    - 说明：以上为备份链路的隐私闭环；不声称覆盖产品其他面的安全问题

    ### 云端附件恢复修复

    - **≤4MB 小文件上传修复**：此前该形态上传在服务端全废（现走 multipart 通道）
    - **子目录附件恢复修复**：恢复段名带上完整子目录层（旧实现丢层导致附件错位/同名互相覆盖）
    - 上传请求的 Content-Type 正确透传（此前被标成 application/json 导致 422）

    ### 其他

    - **Windows 应用身份统一**：开发/直启实例任务栏与应用内图标统一为课题组 logo（不再显示 Electron 默认原子图标）
    - **可观测性**：云端备份失败原因写入本地主进程日志（此前只弹系统通知，排查无痕迹）
    - 托盘创建失败时自动降级，不再影响应用启动后的自动更新检查
