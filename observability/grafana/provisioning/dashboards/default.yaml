apiVersion: 1

# 2026-08-17 #Step13: 业务指标 + Grafana 仪表盘 (Plan v1)
# 自动 provisioning dashboard - 启动时自动加载 observability/grafana/rag_dashboard.json
providers:
  - name: default
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
