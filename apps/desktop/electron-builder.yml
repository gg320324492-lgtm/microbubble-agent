# electron-builder — M0 最小可安装配置（未签名，正式发布走 M6 发布设计）
appId: cn.mnb-lab.workbench
productName: MicroBubbleWorkbench
directories:
  output: release
  buildResources: build
icon: build/icon.ico
extraResources:
  - from: resources
    to: resources
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: MicroBubbleWorkbench-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: 小气科研工作台
# 自动更新源（M6-1）— 有 publish 段时 electron-builder 才会产出 resources/app-update.yml
# （electron-updater 的下载器必读该文件，仅运行时 setFeedURL 不足以替代），同时自动生成
# latest.yml 更新信息。发布流程用 `gh release create` 上传，故打包时务必带 `-p never` 禁止
# electron-builder 自行上传，避免重复发布。
publish:
  provider: github
  owner: gg320324492-lgtm
  repo: microbubble-agent
