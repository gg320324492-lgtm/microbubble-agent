# gitleaks 配置 (W86 第 1 批 A-1)
# 沉淀日期: 2026-07-29
# 任务: gitleaks 安装 (配置 + workflow + scripts + e2e + 扫描报告)
#
# 用法:
#   gitleaks detect --source . --config .gitleaks.toml --report-path logs/gitleaks-report.json --no-banner
#   gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
#
# 触发:
#   1. 本地: scripts/gitleaks/scan-history.sh
#   2. CI:   .github/workflows/secret-scan.yml (PR + push + 周一 6 点 cron)
#   3. pre-commit: scripts/check-secrets-before-commit.sh (JWT) + gitleaks pre-commit (全规则) 双层

title = "MicroBubble Agent gitleaks config"

# 扫描模式: commits (扫历史) + files (扫工作树文件内容)
# commits 模式会逐 commit diff, 命中 commit hash + author + date
# 适合发现"凭据入库后某次 commit 误提交"
[extend]
useDefault = true   # 启用 gitleaks 内置 100+ 默认规则

# 全局 allowlists — 已知凭据 / 测试 fixture / 文档解释段
[allowlists]
description = "全局 allowlist — 已知凭据 (已轮换待清理) + 测试 fixture + 文档"

# 1. 已知历史泄漏 (凭据已轮换, 等 W86-X-1 主指挥拍板 git filter-repo 清理)
# 暂用 commit-level regex 兜底, 等首次扫描报告生成后再细化到具体 commit
regexes = [
    '''REDACTED_SECURITY_PLACEHOLDER''',
    '''<REDACTED>''',
    '''<ANTHROPIC_API_KEY>''',
    '''<OPENAI_API_KEY>''',
    '''<JWT_TOKEN>''',
    '''<PRIVATE_KEY>''',
    '''minioadmin:minioadmin''',   # MinIO 默认密码兜底, 仅文档解释段
    '''sk-ant-test-fixture''',
    '''sk-test-fixture''',
]

# 2. 路径 allowlist — 测试 fixture + 文档示例 + 锁文件
paths = [
    '''tests/fixtures/.*\.json$''',
    '''tests/fixtures/.*\.py$''',
    '''tests/gitleaks/test_.*\.py$''',
    '''docs/.*\.md$''',                      # 文档示例凭据字面量
    '''README\.md$''',
    '''CHANGELOG\.md$''',
    '''HISTORY\.md$''',
    '''CLAUDE\.md$''',
    '''scripts/install-gitleaks\.md$''',     # 本任务安装说明
    '''\.gitleaks\.toml$''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
    '''poetry\.lock$''',
    '''Pipfile\.lock$''',
    # 2026-10-10 批次 7: desktop-conversion 并入主仓后的验收取证目录。
    # 该目录存放"验收证据快照"(HTTP 响应体 / E2E 驱动脚本 / 截图), 按其性质必然含
    # 一次性且已失效的凭据: ① 已被显式撤销且已过期的网盘分享 token
    # (a1-share-block-http.json, expires_at 2026-10-06); ② Electron 首启零用户时
    # 本地注册的临时探针账号口令 dl5/dl6/dl7-probe-12345 (仅 userCount===0 时
    # 建号, 从不接触服务端账号体系)。均为 generic-api-key 规则误报。
    #
    # 粒度: 文件级($ 锚定到具体文件), 不取"目录级"也不取"文件+行号级"。
    #   · 不取目录级: canary 实测证明 `assets/.*` 会把整个目录变成免检区 ——
    #     在 assets/ 内种一个 generic-api-key 形状的假密钥不会被拦, 而同形状
    #     放在目录外会被拦。验收快照恰恰是"真 token 最可能落地"的地方, 后续
    #     DL8/DL9 的取证一旦误提交真凭据, 目录级会静默放行。
    #   · 不取行号级: 行号随编辑漂移, allowlist 会静默失效(要么 CI 误红, 要么
    #     被人"顺手"放宽作用域)。文件路径比行号稳定(仅重命名会断, 而重命名是
    #     显式动作, 届时连带更新本处即可)。
    #   · 故作用域恰好等于已知误报集合: 这 4 个文件, 一次不多。
    # 若未来出现同类 fixture(如 DL8 的 dl8-probe-12345): 先确认它确为一次性且
    # 已失效的取证快照, 再照本格式追加一条 $ 锚定路径; 不要为省事改成目录级。
    '''desktop-conversion/docs/acceptance/assets/2026-09-28-DL5/dl5-e2e-driver\.mjs$''',
    '''desktop-conversion/docs/acceptance/assets/2026-09-29-DL6/dl6-e2e-driver\.mjs$''',
    '''desktop-conversion/docs/acceptance/assets/2026-09-29-DL7/dl7-e2e-driver\.mjs$''',
    '''desktop-conversion/docs/acceptance/assets/2026-09-30-FIN1/a1-share-block-http\.json$''',
]

# 3. 注释 / 文档字面量兜底 — 含"example" / "TODO" / "FIXME" 的行
regexTarget = "line"
stopwords = [
    "example",
    "Example",
    "EXAMPLE",
    "todo",
    "TODO",
    "Todo",
    "fixme",
    "FIXME",
    "Fixme",
    "placeholder",
    "Placeholder",
    "PLACEHOLDER",
    "redacted",
    "REDACTED",
    "Redacted",
    "fixture",
    "Fixture",
    "FIXTURE",
]


# ============================================================
# 项目自定义规则 (5 条)
# ============================================================

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-...)"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]
tags = ["api-key", "anthropic", "llm"]
entropy = 3.5

[[rules]]
id = "openai-api-key"
description = "OpenAI API key (sk-...)"
# 必须 48+ 字符避免误伤短串
regex = '''sk-[A-Za-z0-9]{48,}'''
keywords = ["sk-"]
tags = ["api-key", "openai", "llm"]
entropy = 3.5

[[rules]]
id = "private-key"
description = "RSA / SSH 私钥头部"
regex = '''-----BEGIN (RSA |OPENSSH |EC |DSA |PGP )?PRIVATE KEY( BLOCK)?-----'''
keywords = ["PRIVATE KEY"]
tags = ["private-key", "ssh", "rsa"]
entropy = 0

[[rules]]
id = "jwt-bearer"
description = "JWT Bearer token (eyJ... 开头)"
# 至少 3 段 (header.payload.signature), 段间用 . 分隔
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}'''
keywords = ["eyJ"]
tags = ["jwt", "bearer", "token"]
entropy = 3.0

[[rules]]
id = "minio-admin-default"
description = "MinIO 默认管理员凭据 (minioadmin:minioadmin)"
# 仅匹配 user:pass 格式的明文凭据, 不匹配文档里提"minioadmin 是默认用户名"
regex = '''minioadmin:minioadmin[A-Za-z0-9]{0,32}'''
keywords = ["minioadmin:minioadmin"]
tags = ["minio", "default-credentials", "s3"]
entropy = 1.0

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token (ghp_, gho_, ghu_, ghs_, ghr_)"
regex = '''(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]
tags = ["github", "token", "vcs"]
entropy = 3.5

[[rules]]
id = "anthropic-claude-api-key"
description = "Anthropic Claude API key (alternative formats)"
# 一些团队可能用 ANTHROPIC_API_KEY=... 形式存储
regex = '''ANTHROPIC_API_KEY[=:][[:space:]]*["']?[A-Za-z0-9_-]{32,}["']?'''
keywords = ["ANTHROPIC_API_KEY"]
tags = ["api-key", "anthropic", "env-var"]
entropy = 3.0


# ============================================================
# 项目特定 allowlist (按规则细分)
# ============================================================

# JWT 规则: docs/ + 顶级 md 文件 (含 JWT 字面量解释, 已知非真凭据)
[[rules.Allowlists]]
target = "match"
description = "JWT in docs / 顶级 md / 安装说明"
regexes = [
    '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}''',
]
paths = [
    '''docs/.*''',
    '''README\.md$''',
    '''CHANGELOG\.md$''',
    '''HISTORY\.md$''',
    '''CLAUDE\.md$''',
    '''scripts/install-gitleaks\.md$''',
]

# 测试 fixture allowlist (gitleaks pre-commit + CI 扫描都跳)
[[rules.Allowlists]]
target = "match"
description = "测试 fixture 文件"
paths = [
    '''tests/fixtures/.*''',
    '''tests/gitleaks/test_.*\.py$''',
]