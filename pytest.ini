[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    precommit: pre-commit 框架配置合法性 (W86-D-1)
    e2e: end-to-end 测试
    slow: 慢测试 (CI 跳过)
