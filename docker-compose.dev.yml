# 开发环境：热重载，无 nginx，轻量化
# 使用方式：docker compose -f docker-compose.dev.yml up -d
services:
  nginx:
    profiles:
      - disabled

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: microbubble
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microbubble2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio2026secure}
    command: server /data --console-address ":9001"
    restart: unless-stopped

  whisper:
    profiles:
      - disabled

  celery-worker:
    build: .
    command: celery -A app.core.celery worker --loglevel=info
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A app.core.celery beat --loglevel=info
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # 2026-07-29 W87-B-1: GlitchTip all-in-one; host port 8001 avoids production 8000.
  # 2026-08-05 W-N-GLITCH-IMPL +1: 加 aliases [db, redis] 让 glitchtip 容器在 default network
  #   漏 attach 时仍能通过 service_name 解析主机名 (类 20.140 沉淀补强).
  #   up 后必须 docker network inspect 验证 attach 成功 (W-N-GLITCH +1 沉淀).
  glitchtip:
    image: glitchtip/glitchtip:6.2.2
    container_name: microbubble-agent-glitchtip-dev-1
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-microbubble2026}@db:5432/glitchtip"
      VALKEY_URL: "redis://redis:6379/1"
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:-dev-glitchtip-change-me}"
      PORT: "8000"
      GLITCHTIP_DOMAIN: "${GLITCHTIP_DOMAIN:-http://localhost:8001}"
      EMAIL_ENABLED: "False"
      SERVER_ROLE: "all_in_one"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          - db
          - redis
    restart: unless-stopped

  # 2026-07-29 W86-F-1: pg_exporter — PostgreSQL Prometheus 暴露
  # image 钉死 tag v0.15.0 (latest 不跟, 避免主指挥据实上报不可控)
  # DATA_SOURCE_NAME 走环境变量, 不在 compose 明文写密码
  # 仅加 service 段, 其它 service 的 image / volume / port 不动
  pg-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: microbubble-agent-pg-exporter-dev-1
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:-microbubble2026}@db:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped
