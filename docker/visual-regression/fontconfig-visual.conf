<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  docker/visual-regression/fontconfig-visual.conf — 视觉回归字体锁定 (阶段 2 治①)

  为什么需要这个文件 (实测, 见 docker/visual-regression/Dockerfile 注释):
    app 的 body 字体栈第一个"存在的"名字是 'Segoe UI', fontconfig 把它解析成
    WenQuanYi Zen Hei ⇒ 装 fonts-noto-cjk 也不生效, 且 Windows 上同一栈解析到
    微软雅黑/PingFang ⇒ 跨平台像素必然全炸。

  做法: 把栈里每个家族名用 mode="assign" binding="strong" **强制**指向
        Noto Sans CJK SC。这不是 append (append 无法抢占栈首), 是替换。

  影响范围: 只在这个容器里生效 (COPY 到 /etc/fonts/local.conf)。
            不影响生产 (生产跑在 nginx 静态资源上, 不在容器里做文本栅格化),
            也不影响本机开发 (本机走自己的系统字体)。
-->
<fontconfig>

  <!-- app body 字体栈 (web/src/assets/variables.css:288-289) 逐个别名 -->
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Roboto</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- 通用兜底: 任何漏网的名字也别落到 WenQuanYi / DejaVu 上 -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Courier</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!--
    禁用 WenQuanYi: 它是这个镜像里唯一会抢中文的"意外"字体。
    钉死之后若仍有 wqy 命中, 说明 fontconfig 规则没生效 —— 变基线是危险的,
    所以让它**显式不可用**, 而不是"碰巧没被选中"。
  -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>WenQuanYi Zen Hei</string></patelt>
      </pattern>
    </rejectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>WenQuanYi Zen Hei Sharp</string></patelt>
      </pattern>
    </rejectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>WenQuanYi Zen Hei Mono</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>

</fontconfig>