services:
  # Nginx 反向代理 + 前端静态文件
  nginx:
    # base image pinned on 2026-07-29 for CVE tracking (W86-C-1 Trivy)
    image: nginx:1.31.2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 主应用
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models/hf_cache:/root/.cache/huggingface
      - ./models/torch_hub:/root/.cache/torch/hub
      - ./models/modelscope:/root/.cache/modelscope
      # 2026-06-27 P2-2: alembic 挂载 (新迁移即时生效无需 rebuild 25GB 镜像)
      - ./alembic/versions:/app/alembic/versions
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=microbubble2024
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-auto}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-64}
      # 2026-07-01 BGE m3 reranker (#001): 取代 Self-RAG #009 的 judge 路径
      - RERANKER_MODEL_NAME=${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      - RERANKER_DEVICE=${RERANKER_DEVICE:-auto}
      - RERANKER_MAX_LENGTH=${RERANKER_MAX_LENGTH:-512}
      - RERANKER_BATCH_SIZE=${RERANKER_BATCH_SIZE:-32}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # PostgreSQL数据库
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: microbubble
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microbubble2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped

  # Redis缓存
  redis:
    # base image pinned on 2026-07-29 for CVE tracking (W86-C-1 Trivy)
    image: redis:7.4.9-alpine
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  # Neo4j 图数据库（知识图谱）
  neo4j:
    # base image pinned on 2026-07-29 for CVE tracking (W86-C-1 Trivy)
    image: neo4j:5.26.27-community
    ports:
      - "7474:7474"   # Web UI
      - "7687:7687"   # Bolt 协议
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/microbubble2024
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped

  # MinIO对象存储
  minio:
    # base image pinned on 2026-07-29 for CVE tracking (W86-C-1 Trivy)
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio2026secure}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    restart: unless-stopped

  # ⚠️ Whisper 退役 (2026-06-30 ASR 迁移到 SenseVoice)
  # 保留 Dockerfile.whisper / whisper_entrypoint.sh / whisper_server.py 作为紧急回滚路径
  # 启动回滚: docker compose up -d whisper (前提: GPU 显存充足 8 GB)
  # 配置文件保留: app/config.py WHISPER_* / app/voice/asr.py 注释掉的 fallback 逻辑
  # 详见 plan: woolly-pondering-muffin.md (CLAUDE.md 顶部任务链)
  #
  # whisper:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.whisper
  #   volumes:
  #     - ./models:/app/models
  #     - ./models/hf_cache:/root/.cache/huggingface
  #     - ./whisper_entrypoint.sh:/app/entrypoint.sh
  #     - ./app/whisper_server.py:/app/whisper_server.py:ro
  #   entrypoint: ["bash", "/app/entrypoint.sh"]
  #   environment:
  #     - MODEL_SIZE=${WHISPER_MODEL_SIZE:-large-v3}
  #     - DEVICE=${WHISPER_DEVICE:-cuda}
  #     - HF_ENDPOINT=${HF_ENDPOINT:-}
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   mem_limit: 4g
  #   restart: unless-stopped

  # 2026-07-13 #P1: Ollama 服务 (本地 LLM, fast/balanced/deep 三档模式都用)
  # - fast/balanced: qwen3:8b (默认)
  # - deep: deepseek-r1-distill-qwen:7b (原生 reasoning_content 通道)
  # - volume ./data/ollama 持久化模型 (首次 pull ~4GB)
  # - GPU: deploy.resources.reservations.devices 走 NVIDIA driver (与 app 共享同一 GPU)
  # - OLLAMA_KEEP_ALIVE=10m: 模型空闲 10 分钟后自动 unload 释放显存
  ollama:
    # base image pinned on 2026-07-29 for CVE tracking (W86-C-1 Trivy)
    image: ollama/ollama:0.31.1
    ports:
      - "127.0.0.1:11434:11434"     # host 仅本地访问 (避免暴露公网)
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_HOST=0.0.0.0:11434
    extra_hosts:
      # Docker Desktop Windows 默认只 bind IPv6, 加 host-gateway 强制 IPv4 NAT
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # ollama 官方镜像无 curl/wget, 用 ollama ps 代替 (列已 load 模型, server 启动后永真)
      test: ["CMD-SHELL", "ollama ps > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # 2026-06-30 ASR 迁移: SenseVoice 服务 (唯一 ASR 后端, 单模型策略)
  # 内存占用 ~1 GB (vs Whisper 8 GB), RTF 0.001 (1000× real-time)
  # 长音频自动 chunked (60s × N, cache={}) 避免 OOM
  # 长会议 (>= 10 min) 自动 fallback 到 Whisper (见 app/voice/asr.py 路由层)
  sensevoice:
    build:
      context: .
      dockerfile: Dockerfile.funasr
    volumes:
      - ./models:/app/models
      - ./models/hf_cache:/root/.cache/huggingface
      - ./models/modelscope:/root/.cache/modelscope
      - ./funasr_entrypoint.sh:/app/entrypoint.sh
      # bind mount 源码 → 修改本地 sensevoice_server.py 后 docker compose restart 即可生效
      - ./app/sensevoice_server.py:/app/sensevoice_server.py:ro
    entrypoint: ["bash", "/app/entrypoint.sh"]
    environment:
      - MODEL=${SENSEVOICE_MODEL:-iic/SenseVoiceSmall}
      - DEVICE=${SENSEVOICE_DEVICE:-cuda}
      - DEFAULT_BATCH_SIZE_S=${SENSEVOICE_BATCH_SIZE_S:-60}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 4g
    restart: unless-stopped

  # Celery Worker (异步任务)
  celery-worker:
    build: .
    # 使用 solo pool 避免 prefork 子进程保留旧代码快照。
    # 本项目的重任务主要受 GPU/模型限制，单 worker 更符合本地开发和线上稳定性；
    # 代码改动后 docker compose restart celery-worker 即可重新加载。
    command: celery -A app.core.celery worker --loglevel=info --pool=solo
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models/hf_cache:/root/.cache/huggingface
      - ./models/torch_hub:/root/.cache/torch/hub
      - ./models/modelscope:/root/.cache/modelscope
      # 2026-06-19 Phase 7: alembic 迁移挂载（celery 也可能跑迁移相关任务）
      - ./alembic/versions:/app/alembic/versions
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=microbubble2024
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-auto}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-64}
      # 2026-07-01 BGE m3 reranker (#001): 取代 Self-RAG #009 的 judge 路径
      - RERANKER_MODEL_NAME=${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      - RERANKER_DEVICE=${RERANKER_DEVICE:-auto}
      - RERANKER_MAX_LENGTH=${RERANKER_MAX_LENGTH:-512}
      - RERANKER_BATCH_SIZE=${RERANKER_BATCH_SIZE:-32}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 4g
    restart: unless-stopped

  # 2026-08-04 Batch D-1: 会议处理独立 worker, 只消费 meeting-processing 队列
  # 避免 35min 会议后处理阻塞默认 worker 184s (会议 242 实测).
  celery-meeting-worker:
    build: .
    command: >
      celery -A app.core.celery worker
        --loglevel=info --pool=solo
        -Q meeting-processing
        --concurrency=1
        -n meeting-worker@%h
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models/hf_cache:/root/.cache/huggingface
      - ./models/torch_hub:/root/.cache/torch/hub
      - ./models/modelscope:/root/.cache/modelscope
      - ./alembic/versions:/app/alembic/versions
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 4g
    restart: unless-stopped

  # Celery Beat (定时任务)
  celery-beat:
    build: .
    command: celery -A app.core.celery beat --loglevel=info
    volumes:
      # 2026-06-03 修复：之前 beat 容器没有 ./app 挂载，导致新增的 Celery 任务
      # (如 auto_purge_trash) 修改代码后 beat 仍加载旧 schedule，必须 rebuild
      # 25GB 镜像才能生效。补上 volume 与 worker 一致，代码改动即时生效。
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models/hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  # Vision MCP Server
  vision-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    # MCP stdio 服务器默认 stdin 会被 Docker 关闭 → 进程退出 → restart 死循环
    # 必须 stdin_open + tty 保持 stdio 开放，等待 MCP 客户端连接
    stdin_open: true
    tty: true
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_BASE_URL=${CLAUDE_BASE_URL}
      - VISION_MODEL=${VISION_MODEL:-mimo-v2.5}
    env_file:
      - .env
    mem_limit: 512m
    restart: unless-stopped

  # 2026-07-29 W87-B-1: GlitchTip all-in-one error tracking (default SDK reporting remains off)
  # Docker Hub current stable semantic tag verified and pinned; never follow latest/major-only.
  # The dedicated "glitchtip" database must exist before first start; see docs/sentry-setup.md.
  glitchtip:
    image: glitchtip/glitchtip:6.2.2
    container_name: microbubble-agent-glitchtip-1
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-microbubble2026}@db:5432/glitchtip"
      VALKEY_URL: "redis://redis:6379/1"
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:-please-change-me-in-prod}"
      PORT: "8000"
      GLITCHTIP_DOMAIN: "${GLITCHTIP_DOMAIN:-https://glitchtip.example.com}"
      EMAIL_ENABLED: "False"
      SERVER_ROLE: "all_in_one"
    ports:
      # app 已占 127.0.0.1:8000；保持 GlitchTip host port 8000 但用独立 loopback IP。
      - "127.0.0.2:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # 2026-07-29 W86-F-1: pg_exporter — PostgreSQL Prometheus 暴露
  # 多租户慢查询监控入口 (pg_stat_database / pg_stat_user_tables / pg_stat_statements)
  # image 钉死 tag v0.15.0 (latest 不跟, 避免主指挥据实上报不可控)
  # DATA_SOURCE_NAME 走环境变量, 不在 compose 明文写密码
  # 仅加 service 段, 其它 service 的 image / volume / port 不动
  pg-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: microbubble-agent-pg-exporter-1
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:-microbubble2026}@db:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  # === LangFuse — 开源 LLM 可观测平台 (2026-07-31 Hybrid RAG Stack) ===
  # 2026-07-31 RAG-FW-DEPLOY 修复: DATABASE_URL 指向独立 langfuse 库 (P3005 非空库拒绝),
  # host 端口 3000 → 3001 (3000 被 web vite dev server 占用)
  langfuse:
    image: ghcr.io/langfuse/langfuse:2
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-production}
      - SALT=${LANGFUSE_SALT:-change-me-in-production}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:-change-me-in-production}
    depends_on:
      - db
    networks:
      - default
